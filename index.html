<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七路将棋カードバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a kaya-wood 7x7 board lit like a night tea room; your hand of cards below, opponent above, log on the side. Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#131823; --panel:#1b2230; --panel-2:#232c3d; --line:#33405a;
  --fg:#ede4cf; --muted:#9ba6ba;
  --wood:#d8b06a; --wood-dk:#b88a45; --grid:#5a3a14; --koma:#f1d9a4; --koma-ink:#2a1b0c; --pro:#b4231a;
  --enh:#c9502f; --res:#c99a34; --mag:#6e62c9;
  --poison:#8cc66a; --seize:#9d7ae0; --smoke:#c3c8d2; --gold:#e1b24c; --danger:#e8603c;
  --beast-l:#8fa39a; --beast-r:#cbc2b8; --beast-head:#a6736b; --beast-body:#3e3345;
  --parch:#f2e7cc; --parch-ink:#2a2230;
  --f-disp:'Dela Gothic One','Hiragino Sans',sans-serif;
  --f-min:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  --bs:max(270px, min(calc(100vw - 56px), calc(100vh - 400px), 560px));
  --cw:124px; --ch:200px;
}
@supports (height:100svh){ :root{ --bs:max(270px, min(calc(100vw - 56px), calc(100svh - 400px), 560px)); } }
@media (min-width:1000px){
  :root{ --bs:max(320px, min(calc(100vw - 460px), calc(100vh - 340px), 600px)); }
  @supports (height:100svh){ :root{ --bs:max(320px, min(calc(100vw - 460px), calc(100svh - 340px), 600px)); } }
}
@media (max-width:700px){ :root{ --cw:108px; --ch:186px; } }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;min-height:100%;
  background-image:radial-gradient(ellipse at 50% -20%, #263049 0%, transparent 60%)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:var(--f-min);font-weight:800;font-size:22px;letter-spacing:.12em;color:var(--gold)}
.logo span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stage{display:grid;grid-template-columns:1fr;gap:16px;padding-block:12px 24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:1000px){ .stage{grid-template-columns:minmax(0,1fr) 300px;align-items:start} }
.play{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}

.strip{width:min(100%, 900px);display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.strip.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.who{font-weight:700;display:flex;align-items:center;gap:8px}
.who .mk{font-size:16px}
.stat{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg)}
.stat .en b{color:var(--gold)}
.turnno{margin-left:auto;font-size:12px;color:var(--muted)}

.board-wrap{position:relative;padding:22px 26px 10px 10px;border-radius:6px;background:linear-gradient(#5b3c1c,#3e2911);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.files,.ranks{position:absolute;display:flex;font-family:var(--f-min);font-weight:800;color:#f0d9a8;font-size:12px;pointer-events:none}
.files{left:10px;top:3px;width:var(--bs);justify-content:space-around}
.ranks{right:6px;top:22px;height:var(--bs);flex-direction:column;justify-content:space-around}
.board{position:relative;width:var(--bs);height:var(--bs);user-select:none;-webkit-user-select:none;background:var(--wood)}
.squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);border:2px solid var(--grid)}
.sq{position:relative;border:0;padding:0;cursor:pointer;background:var(--wood);box-shadow:inset 0 0 0 .5px var(--grid)}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none}
.sq.last::before{inset:0;background:rgba(201,80,47,.22)}
.sq.sel::before{inset:0;box-shadow:inset 0 0 0 3px var(--enh);background:rgba(201,80,47,.25)}
.sq.mv::after{width:24%;height:24%;left:38%;top:38%;border-radius:50%;background:rgba(42,27,12,.45)}
.sq.hmv::after{width:24%;height:24%;left:38%;top:38%;border-radius:50%;background:transparent;box-shadow:0 0 0 3px rgba(42,27,12,.55)}
.sq.cap::after{inset:6%;border-radius:4px;box-shadow:inset 0 0 0 4px rgba(201,80,47,.9)}
.sq.tgt::before{inset:0;background:var(--tgtc);opacity:.42;animation:pulse 1.2s ease-in-out infinite}
.sq.tgt:hover::before{opacity:.7}
.sq.chk::before{inset:0;background:radial-gradient(circle, rgba(232,96,60,.85), rgba(232,96,60,0) 72%)}
.sq.area::before{inset:0;background:var(--tgtc);opacity:.6;box-shadow:inset 0 0 0 2px #fff}
.sq.shot::after{inset:10%;border-radius:50%;border:3px solid var(--danger);background:radial-gradient(circle,transparent 30%,rgba(232,96,60,.3) 32%);box-shadow:0 0 0 1px #000 inset}
.sq .cd{position:absolute;right:3%;top:2%;font-family:var(--f-disp);font-size:calc(var(--bs) / 34);color:#7a1a0c;pointer-events:none;text-shadow:0 0 3px #fff}
.hint .hb{margin-left:8px;border:1px solid var(--danger);background:transparent;color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.hint .hb.on{background:var(--danger);color:#fff}
.hint .facepick{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:12.5px}
.hint .hb.face{margin-left:0;border-color:var(--gold)}
.hint .hb.face.on{background:var(--gold);color:#241a06}
@keyframes pulse{50%{opacity:.18}}

.pieces,.fx{position:absolute;inset:2px;pointer-events:none}
.pc{position:absolute;width:calc(100%/7);height:calc(100%/7);display:grid;place-items:center;transition:left .28s ease, top .28s ease, opacity .3s, transform .3s}
.pc .kw{width:78%;height:86%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));display:grid}
.pc .k{clip-path:polygon(50% 0,86% 16%,100% 100%,0 100%,14% 16%);background:linear-gradient(170deg,#f7e4b6,var(--koma) 55%,#d6b679);
  display:grid;place-items:center;padding-top:14%;font-family:var(--f-min);font-weight:800;color:var(--koma-ink);font-size:calc(var(--bs) / 7 * .44);line-height:1}
.pc.g .kw{transform:rotate(180deg)}
.pc.pro .k{color:var(--pro)}
.pc.beast .k{position:relative;color:transparent;background:linear-gradient(90deg,var(--beast-l) 50%,var(--beast-r) 50%)}
.pc.beast .k::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--beast-body);clip-path:polygon(0 45%,28% 0,72% 0,100% 45%,100% 100%,0 100%)}
.pc.beast .k::before{content:"";position:absolute;z-index:1;width:46%;aspect-ratio:1;left:27%;top:30%;border-radius:50%;background:var(--beast-head)}
.pc.king .k{font-size:calc(var(--bs) / 7 * .48)}
.pc.hid .k{color:#55606f;background:linear-gradient(170deg,#c9ccd3,#a5aab5)}
.pc.mine-hid .kw{opacity:.72}
.pc.gone{opacity:0;transform:scale(.6)}
.pc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.badges{position:absolute;left:2%;right:2%;bottom:1%;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;z-index:2}
.bd{font-size:calc(var(--bs) / 52);min-width:calc(var(--bs) / 34);padding:0 2px;line-height:1.35;border-radius:3px;font-weight:700;text-align:center;color:#fff;background:var(--enh);font-variant-numeric:tabular-nums}
.bd.res{background:#9a7420}.bd.mag{background:var(--mag)}.bd.poi{background:var(--poison);color:#14260a}.bd.dng{background:var(--danger)}
.ring{position:absolute;inset:4%;border-radius:50%;border:2px dashed rgba(110,98,201,.85);pointer-events:none}

.fxt{position:absolute;width:calc(100%/7);text-align:center;font-weight:700;font-size:clamp(11px, calc(var(--bs) / 36), 15px);white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 2px #000;animation:rise 1.1s ease-out forwards;z-index:5}
.fxt.enh{color:#ffb08f}.fxt.poi{color:var(--poison)}.fxt.mag{color:#c8bdff}.fxt.kill{color:var(--danger)}.fxt.res{color:var(--gold)}
@keyframes rise{from{transform:translateY(10%);opacity:1}to{transform:translateY(-120%);opacity:0}}

.hint{min-height:24px;font-size:13px;color:var(--muted);text-align:center;max-width:640px;text-wrap:balance}
.hint b{color:var(--fg)}

.me{width:min(100%, 900px);display:grid;grid-template-columns:130px minmax(0,1fr) 150px;grid-template-areas:"left hand right";gap:12px;align-items:end}
@media (max-width:700px){ .me{grid-template-columns:1fr auto;grid-template-areas:"left right" "hand hand"} }
.me-left{grid-area:left;display:flex;flex-direction:column;align-items:center;gap:6px}
.me-right{grid-area:right;display:flex;flex-direction:column;gap:8px}
@media (max-width:700px){ .me-left{flex-direction:row;justify-self:start} .me-right{flex-direction:row;align-items:center} }
.orb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;color:#2a1c04;
  background:radial-gradient(circle at 35% 30%, #fff0bf 0%, var(--gold) 50%, #7a5612 100%);box-shadow:0 0 18px rgba(225,178,76,.4), inset 0 -4px 8px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.orb.off{filter:grayscale(.8) brightness(.6);box-shadow:none}
.orb-note{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.chips{display:flex;flex-direction:column;gap:4px;align-items:center}
@media (max-width:700px){.chips{align-items:flex-start}}
.chip{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--enh);white-space:nowrap}
.chip.on{background:var(--enh);color:#fff;font-weight:700}
.chip.off{border-color:var(--line);color:var(--muted)}
.piles{display:flex;gap:6px}
.pile{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;cursor:pointer;font-size:11px;line-height:1.25;text-align:center}
.pile b{display:block;font-family:var(--f-disp);font-weight:400;font-size:16px}
.pile:hover{border-color:var(--gold)}
.endbtn{border:0;border-radius:8px;padding:12px 10px;background:linear-gradient(#e9c16a,#b3862b);color:#241a06;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #6f5114}
.endbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #6f5114}
.endbtn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}

.hand{grid-area:hand;display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--ch) + 18px);padding-top:18px;min-width:0}
@media (max-width:700px){ .hand{justify-content:flex-start;overflow-x:auto;padding-bottom:6px} }
.empty-hand{color:var(--muted);font-size:13px;align-self:center}

.card{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:9px;border:0;padding:0;cursor:pointer;background:var(--frame);
  box-shadow:0 6px 14px rgba(0,0,0,.45);transition:transform .15s ease, filter .15s;text-align:center;display:flex;flex-direction:column}
.card.enh{--frame:var(--enh)} .card.awk{--frame:#a3326b} .card.res{--frame:var(--res)} .card.mag{--frame:var(--mag)}
.card .cost{position:absolute;left:-7px;top:-7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;z-index:2;font-family:var(--f-disp);font-size:15px;color:#2a1c04;
  background:radial-gradient(circle at 35% 30%, #fff0bf, var(--gold) 55%, #7a5612);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.card .cost.down{background:radial-gradient(circle at 35% 30%, #e6ffd2, #7fd05a 55%, #2f6a18)}
.card .cname{font-family:var(--f-min);font-weight:800;font-size:13px;color:#fff6e4;padding:8px 6px 2px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card .art{margin:2px 8px 0;height:19%;border-radius:4px;display:grid;place-items:center;font-family:var(--f-min);font-weight:800;font-size:calc(var(--ch) * .13);
  color:var(--frame);background:radial-gradient(circle at 50% 40%, #fff7e3, #dccba4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.card .ctype{font-size:9px;letter-spacing:.15em;color:#fff6e4;opacity:.9;padding:2px 0}
.card .ctext{flex:1;margin:0 7px 8px;border-radius:4px;background:var(--parch);color:var(--parch-ink);font-size:9.6px;line-height:1.42;padding:4px 5px;text-align:left;overflow:hidden}
@media (max-width:700px){ .card .ctext{font-size:9px;padding:3px 4px} .card .cname{font-size:12px} }
.hand .card:hover{transform:translateY(-12px);z-index:5}
.card.pending{transform:translateY(-18px);z-index:6;box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,0,0,.5)}
.card.dim{filter:saturate(.35) brightness(.7);cursor:not-allowed}
.hand .card.dim:hover{transform:translateY(-4px)}
.card.static{cursor:default}
.opp-hand{width:min(100%, 900px);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.oh-label{font-size:12px;color:var(--muted);margin-right:2px}
.oh-empty{font-size:12px;color:var(--muted)}
.ochip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;padding:3px 10px 3px 4px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;background:var(--enh)}
.ochip.res{background:#9a7420}.ochip.awk{background:#a3326b}.ochip.mag{background:var(--mag)}
.ochip:hover{filter:brightness(1.15)}
.ochip .oc{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:400;font-size:11px;color:#2a1c04;background:radial-gradient(circle at 35% 30%, #fff0bf, var(--gold) 55%, #7a5612)}
.ochip .oheld{font-size:10px;background:var(--danger);border-radius:6px;padding:0 5px}
.libitem{display:flex;flex-direction:column;align-items:center;gap:4px}
.libcount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;font-size:12.5px}
.glossary div{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.glossary b{display:block;color:var(--gold);margin-bottom:2px}
.card .heldtag{position:absolute;right:-6px;top:-8px;z-index:3;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.card.held{box-shadow:0 0 0 2px var(--danger),0 6px 14px rgba(0,0,0,.45)}

.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side h2{font-family:var(--f-min);font-weight:800;font-size:15px;margin:0;letter-spacing:.05em}
.notice{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px 10px;font-size:12.5px}
.notice b{color:var(--gold);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:min(50vh,460px);overflow:auto;font-size:12.5px}
.log li{padding:5px 10px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log li.sep{color:var(--gold);font-weight:700;background:var(--panel-2)}
.log li.g{color:#c6cde0}
.legend{font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,10,16,.78);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.modal.wide{max-width:1040px}
.modal h3{font-family:var(--f-min);font-weight:800;font-size:22px;margin:0 0 6px;text-wrap:balance}
.modal p{margin:0 0 12px;color:var(--muted)}
.grid-cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-min);font-weight:800;font-size:38px;color:var(--gold);text-align:center;margin:6px 0 10px}
.rules{display:grid;gap:12px;font-size:13.5px}
.rules h4{font-family:var(--f-min);font-weight:800;font-size:15px;margin:0 0 2px;color:var(--gold)}
.rules p{margin:0;color:var(--fg);max-width:68ch}

/* deck builder */
.deckbar{position:sticky;top:-22px;z-index:3;background:var(--panel);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px;display:grid;gap:8px}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:640px){ .slots{grid-template-columns:repeat(4,minmax(0,1fr))} }
.slot{min-height:40px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:2px 4px;text-align:center;line-height:1.2}
.slot.f{border-style:solid;color:#fff;font-weight:700}
.slot.f.enh{background:var(--enh);border-color:var(--enh)} .slot.f.res{background:#9a7420;border-color:#9a7420} .slot.f.mag{background:var(--mag);border-color:var(--mag)}
.slot.f:hover{filter:brightness(1.15)}
.slot .c{font-family:var(--f-disp);font-weight:400;font-size:11px;opacity:.85}
.board-wrap.flip .squares,.board-wrap.flip .pieces{transform:rotate(180deg)}
.board-wrap.flip .badges,.board-wrap.flip .sq .cd{transform:rotate(180deg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--panel-2);padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;color:var(--muted)}
.tab.on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:700}
.onl{display:grid;gap:10px;font-size:13px}
.onl p{margin:0}
.onl .ok{color:#9fd47f}
.onl .err{color:var(--danger);font-weight:700}
.cfgbox{display:grid;gap:6px}
.cfgbox textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.onrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.onrow input{width:7em;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:700 15px var(--f-disp);letter-spacing:.2em;text-transform:uppercase}
.onrow .or{color:var(--muted);font-size:12px}
.onstatus{min-height:1em}
.roomcode{font-family:var(--f-disp);font-size:40px;letter-spacing:.25em;color:var(--gold);line-height:1.1}
.linkbtn{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
details.guide{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px 12px;margin-top:10px}
details.guide summary{cursor:pointer;font-family:var(--f-min);font-weight:800;font-size:15px;color:var(--gold)}
details.guide .rules{margin-top:10px}
details.guide .glossary{margin-top:10px}

<script>
(function(){
const $=s=>document.querySelector(s);
const N=7, ROWS='一二三四五六七';
const KJ={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'王'}, KJP={P:'と',L:'杏',N:'圭',S:'全',B:'馬',R:'龍'};
const VAL={P:1,L:3,N:3,S:4,G:5,B:7,R:8,K:100}, VALP={P:4,L:5,N:5,S:5,B:10,R:11};
const CAT={enh:'駒強化',res:'エネルギー・サーチ',mag:'魔法',awk:'BEAST KING専用'};
const CARDS={
  haste:{name:'疾風',cost:2,cat:'enh',art:'疾',target:'own',text:'次の自分の番から、この駒はメインの手とは別に1回動ける（駒は取れない）。使うと消える。'},
  ward:{name:'加護',cost:1,cat:'enh',art:'護',target:'own',text:'3ターンの間、毒・延焼・石化・シーズなど相手の妨害を受けない。今かかっている毒・延焼・石化も消す。'},
  blade:{name:'毒刃',cost:2,cat:'enh',art:'刃',target:'ownNoKing',text:'武器（付けた次の番から有効）。動く前に向き（前・左・右）を決める。動いた後、向いた方向2マス以内で最初に当たる敵駒に毒を与える（貫通しない）。毒を与えたら、次の1回の移動で装填し直す。'},
  operator:{name:'オペレーター',cost:4,cat:'enh',art:'狙',target:'ownNoKing',text:'狙撃銃。付けた番と次の番は撃てない。メインの手とエネルギー1で、縦横斜めの射線で最初の敵駒（王も可）を破壊。撃つと4ターン撃てない。動く・押される・移されると、その番と次の番は撃てない。撃てる状態（覗き中）でスタンを受けると、スタン中は動けない。'},
  rib:{name:'ランイットバック',cost:4,cat:'enh',art:'戻',target:'own',text:'今のマスにアンカーを置く。次の番はメインと別に1回動ける（取れる）。倒されるか3ターン後にアンカーへ戻る。そこに駒がいると倒れる。'},
  atomic:{name:'アトミック',cost:4,cat:'enh',art:'核',target:'ownPawn',text:'歩にだけ付けられる。4ターン後、この駒を中心に5×5マス（四隅の4マスを除く21マス）の駒を、王も含め敵味方関係なくすべて破壊。疾風・桂脚・逆行・ランイットバックとは重ねられない。'},
  fireb:{name:'火だるま',cost:2,cat:'enh',art:'焼',target:'ownNoKing',text:'2ターン後、この駒は燃え尽きて倒れ、周りのしずく形（周り1マスと、前・左・右の2マス先、計11マス）にいる駒すべて（敵味方・王も）に延焼を付ける。さらに次の自分の番の初めに、そこで燃えた敵1体ごとに、燃えた位置の上下左右へ火が燃え移る（敵味方とも延焼・1回だけ）。自分で燃やした駒が倒れても保険は降りない。'},
  bomb:{name:'自爆',cost:1,cat:'enh',art:'爆',target:'ownNoKing',text:'2ターン後、この駒を中心に3×3マスの駒を、王も含め敵味方関係なくすべて破壊。巻き込まれた保険付きの自分の歩からはエネルギーが入る（自爆した駒自身の保険は出ない）。'},
  iso:{name:'アイソアーマー',cost:3,cat:'enh',art:'甲',target:'own',text:'次の相手の番が終わるまで（1ターン）、どんな攻撃でも1回だけ耐える（取られても取られず、攻めた駒は元のマスに戻る）。自分で起動したアトミック・自爆では耐えられない。付けてから2ターン以内にこの駒が敵駒を倒すと、アーマーが1ターン分復活する（倒すたびに2ターンの猶予も延びる）。'},
  assassin:{name:'アサシン',cost:3,cat:'enh',art:'影',target:'ownNoKing',text:'3ターンの間、相手から見えなくなる（盤から消える）。見えない間は駒を取れないが、次の自分の番から毎ターン、メインの手とは別に1回動ける（取れない）。この駒が敵駒を取れる位置関係になると姿を現す（自分の移動で現した番は取れない）。一度だけ、まだ動いていない番に「潜伏」でき、動かすまで最大4ターン見えなくなる。見えない駒のマスに入ろうとした敵はぶつかってターン終了。単体を狙う魔法・武器の対象にならないが、範囲攻撃は当たる。武器・アトミック・移動系の強化とは重ねられない（自爆は可）。'},
  breach:{name:'ブリーチ',cost:3,cat:'enh',art:'破',target:'ownNoKing',text:'武器（付けた次の番から有効）。メインの手を使うか、この駒を動かした後に、前方の7つのエリア（正面・左右の縦3マス、その外の縦2マス、斜めの2マス）から1つを選んでスタン弾を撃つ。1ターン後に着弾し、中の駒（味方も巻き込む）をスタン2ターン。各エリアの一番奥のマスと、正面の縦3の真ん中のマスはスタン3ターン（王も可・魔法防御も貫通）。撃つと2ターン撃てない。'},
  molotov:{name:'遠投兵',cost:3,cat:'enh',art:'瓶',target:'ownNoKing',text:'武器（付けた次の番から有効）。メインの手を使い、火炎瓶を投げる。落とす中心（正面3マス先・2マス前の左右）と倒す向き（上下左右）を選び、1×2マスにいる駒すべて（敵味方・王も）に延焼。即着弾。間の駒は飛び越え、魔法防御も貫通する。投げると4ターン投げられない。'},
  outlaw:{name:'アウトロー',cost:4,cat:'enh',art:'賊',target:'ownNoKing',text:'武器（付けた次の番から有効）。メインの手を使い、前1〜3マスは直線、その先4〜6マスは直進・左・右のどれかに曲げて撃つ。最初に当たった敵駒（王も可）に致死毒。相手がすでに何かのデバフ（懸賞以外）を受けていればその場で倒れる。魔法防御も貫通。撃つと3ターン撃てない。'},

function isHidden(p,r,c){

  if(inOwnPit(p,r,c))return true;
  return G.fields.some(f=>f.owner===p.c&&active(f)&&(
    (f.type==='smoke'&&has(f.cells,r,c))||
    (f.type==='cloud'&&(inCamp(p.c,r)||piecesOf(p.c).some(([r2,c2,q])=>q.b.barrier&&cheb(r,c,r2,c2)<=1)))));
}
function hasCommand(col){return piecesOf(col).some(([r,c,p])=>p.b.command&&(col==='s'?r<=3:r>=3));}
function costOf(key,col){const d=CARDS[key];let c=d.cat==='mag'?d.cost-(hasCommand(col)?1:0):d.cost;const pl=G&&G.players&&G.players[col];if(pl&&pl.discount&&key!=='combo')c-=pl.discount;return Math.max(0,c);}
function log(t,c,sep){if(SIM)return;G.log.unshift({t,c,sep});if(G.log.length>150)G.log.pop();}

/* --- shapes --- */
function areaCells(key,caster,r,c){
  const out=[];
  if(key==='roll'){
    const f=fw(caster);for(let k=1;k<=4;k++)for(let cc=c-1;cc<=c+1;cc++){const rr=r+f*k;if(inB(rr,cc)&&!isProtected(caster,rr,cc))out.push([rr,cc]);}
    return out;
  }
  for(let rr=r-1;rr<=r+1;rr++)for(let cc=c-1;cc<=c+1;cc++){
    if(!inB(rr,cc)||isProtected(caster,rr,cc))continue;
    if(key==='swamp'){const q=G.board[rr][cc];if(q&&q.c!==caster)continue;}
    out.push([rr,cc]);
  }
  return out;
}
function rectLines(a,b){
  const dr=b[0]-a[0],dc=b[1]-a[1];
  const long=Math.abs(dr)===4?'r':'c';
  const lines=[];
  for(let k=0;k<5;k++){const line=[];
    if(long==='r'){const rr=a[0]+Math.sign(dr)*k;for(const cc of[a[1],b[1]])line.push([rr,cc]);}
    else{const cc=a[1]+Math.sign(dc)*k;for(const rr of[a[0],b[0]])line.push([rr,cc]);}
    lines.push(line);}
  return lines;
}
function rectOk(a,b){const dr=Math.abs(b[0]-a[0]),dc=Math.abs(b[1]-a[1]);return (dr===4&&dc===1)||(dr===1&&dc===4);}
function thunderCells(caster,a,b){return rectLines(a,b).flat().filter(([r,c])=>!isProtected(caster,r,c));}
function pitCells(col,r,c){
  const out=[];const r2=r+fw(col);
  for(const rr of[r,r2]){if(!inB(rr,0))continue;for(let cc=c-2;cc<=c+2;cc++)if(inB(rr,cc))out.push([rr,cc]);}
  return out;
}

/* ---------- game flow ---------- */
function mkPlayer(keys){return {draw:shuffle(keys.map(k=>({uid:uid++,key:k}))),hand:[],discard:[],exhaust:[],energy:0,started:false};}
function botDeck(){
  const by=c=>Object.keys(CARDS).filter(k=>CARDS[k].cat===c&&k!=='awaken');
  const pick=(list,n,out)=>{let g=0;while(n>0&&g++<60){const k=list[Math.random()*list.length|0];if(out.filter(x=>x===k).length<2){out.push(k);n--;}}};
  const out=[];pick(by('enh'),3,out);pick(by('res'),2,out);pick(by('mag'),3,out);return out;
}
function freshState(deckS,deckG,preview){
  return {mode:'bot',board:setup(),T:0,turn:'s',players:{s:mkPlayer(deckS),g:mkPlayer(deckG)},main:true,sel:null,pending:null,shootMode:false,
    fields:[],campManual:{s:2,g:2},over:null,log:[],last:null,busy:false,modal:!!preview,preview:!!preview,flash:null};
}
function newGame(deck){
  if(ONLINE)leaveOnline(true);
  ME='s';setOrientation();
  uid=1;pieceEls.clear();$('#pieces').innerHTML='';$('#fx').innerHTML='';closeModal();
  let bd,deckName='';
  if(botLevel===3){const d=HARD_DECKS[Math.random()*HARD_DECKS.length|0];bd=[...d.keys];deckName=d.name;}else bd=botDeck();
  G=freshState(deck,bd,false);G.botDeckName=deckName;
  {const pl=G.players.g;const i=pl.draw.findIndex(c=>c.key===bd[0]);if(botLevel===3&&i>=0){pl.opener=pl.draw.splice(i,1)[0];}}
  {const pl=G.players.s;const i=pl.draw.findIndex(c=>c.key===deck[0]);if(i>=0){pl.opener=pl.draw.splice(i,1)[0];}}
  log('対局開始。あなたが先手（▲）、botが後手（△）。',null,true);
  log(`bot（${LV_NAME[botLevel]}）のデッキ${deckName?'「'+deckName+'」':''}：${bd.map(k=>CARDS[k].name).join('・')}`,'g');
  startTurn();
}
function draw(col,n){
  const pl=G.players[col];
  for(let i=0;i<n;i++){
    if(pl.hand.length>=6)break;
    if(!pl.draw.length){if(!pl.discard.length)break;pl.draw=shuffle(pl.discard);pl.discard=[];log(`${who(col)}の捨て札をシャッフルして山札に戻した`,col);}
    const dc=pl.draw.pop();if(CARDS[dc.key].sticky)dc.held=true;pl.hand.push(dc);
  }
}
function startTurn(){
  G.T++;const me=G.turn,pl=G.players[me];
  log(`第${G.T}手・${who(me)}（${mark(me)}）`,me,true);
  if(G.T===16)log('敵陣の魔法防御が自然に1段はがれた（手前の段）');
  if(G.T===26)log('敵陣の魔法防御がすべてはがれた');
  G.fields=G.fields.filter(f=>active(f)&&(f.type!=='pit'||findById(f.carrier)));
  eachPiece(p=>{if(p.b.iso&&p.b.iso.win<=G.T)delete p.b.iso;if(p.bounty&&p.bounty.until<=G.T)delete p.bounty;if(p.poison&&p.poison.until<=G.T)p.poison=null;for(const k of['ward','leg','barrier','rewind'])if(p.b[k]&&p.b[k].until<=G.T)delete p.b[k];});
  // rolling thunder strikes
  for(const f of G.fields.filter(f=>f.type==='thunder'&&f.owner===me)){
    for(const st of f.stages){
      if(st.done||st.at>G.T)continue; st.done=true;
      const cells=st.cells;
      log(`${who(me)}のアルマゲドンが着弾（${cells.length}マス）`,me);
      for(const[r,c]of cells){fx(r,c,'爆撃','kill');const q=G.board[r][c];if(q&&q.t!=='K')killPiece(r,c,'thunder',me);}
      G.fields.push({type:'burn',cells,until:G.T+2,owner:me});
    }
  }
  if(G.over)return;
  for(const f of G.fields.filter(f=>f.type==='roll'&&f.owner===me&&f.at<=G.T&&!f.done)){
    f.done=true;f.until=G.T;
    const dr=fw(me);
    const cells=[...f.cells].sort((x,y)=>me==='s'?x[0]-y[0]:y[0]-x[0]);
    let moved=0,stuck=0;
    for(const[r,c]of cells){
      const p=G.board[r][c];if(!p)continue;
      const nr=r+dr;
      if(inB(nr,c)&&!G.board[nr][c]){
        G.board[nr][c]=p;G.board[r][c]=null;moved++;
        if(p.b.xbow)p.b.xbow.ch=null;
        if(p.b.op)p.b.op.ready=Math.max(p.b.op.ready,G.T+4);
        if(p.b.snake)p.b.snake.movedT=G.T;
        if(canPromote(p)&&(zone(p.c,r)||zone(p.c,nr)))p.pro=true;
        stunFor(p,1);fx(nr,c,'押し出し','mag');
      }else{stunFor(p,2);stuck++;fx(r,c,'スタン2','mag');}
    }
    log(`${who(me)}のローリングサンダーが発動。${moved}体を押し出し、${stuck}体は押し出せずスタン2ターン`,me);
    for(const[r,c]of f.cells){const nr=r+dr;if(inB(nr,c)&&G.board[nr][c]){checkBurn(nr,c);if(G.board[nr][c])snakeCheck(nr,c);}if(G.over)return;}
  }
  G.fields=G.fields.filter(f=>!(f.type==='roll'&&f.done));
  for(const f of G.fields.filter(f=>f.type==='neon'&&f.owner===me&&f.at<=G.T&&!f.done)){
    f.done=true;const[r,c]=f.cells[0];const q=G.board[r][c];
    if(q&&!ward(q)){stunFor(q,2);fx(r,c,'雷 スタン2','mag');log(`雷が${nota(r,c)}に着弾。${isHidden(q,r,c)?'？':pname(q)}をスタン2ターン`,me);}
    else{fx(r,c,'雷 空振り','mag');log(`雷が${nota(r,c)}に着弾したが空振り`,me);}
  }
  G.fields=G.fields.filter(f=>!(f.type==='neon'&&f.done));
  for(const f of G.fields.filter(f=>f.type==='breach'&&f.owner===me&&f.at<=G.T&&!f.done)){
    f.done=true;let n=0;
    for(const[r,c]of f.cells){const q=G.board[r][c];if(q&&!ward(q)){const k=f.strong&&has(f.strong,r,c)?3:2;stunFor(q,k);fx(r,c,'スタン'+k,'mag');n++;}if(G.over)return;}
    log(`${who(me)}のブリーチが着弾。${n}体をスタン（「3」のマスは3ターン）`,me);
  }
  G.fields=G.fields.filter(f=>!(f.type==='breach'&&f.done));
  for(const f of G.fields.filter(f=>(f.type==='tdf'||f.type==='hunter'||f.type==='chain'||f.type==='fspread')&&f.owner===me&&f.at<=G.T&&!f.done)){f.done=true;if(f.type==='tdf')fireTdf(f);else if(f.type==='chain')resolveChain(f);else if(f.type==='fspread'){let n=0;for(const[r,c]of f.cells){fx(r,c,'燃え移り','kill');if(G.board[r][c]){burnPiece(r,c,'燃え移り',f.by||{c:me,b:{}});n++;}if(G.over)return;}log(`火が燃え移り、${n}体が延焼`,me);}else fireHunter(f);if(G.over)return;}
  G.fields=G.fields.filter(f=>!((f.type==='tdf'||f.type==='hunter'||f.type==='chain'||f.type==='fspread')&&f.done));
  // run it back: forced return
  for(const[r,c,p]of piecesOf(me)){ if(p.b.rib&&p.b.rib.until<=G.T){ log(`${pname(p)}（${nota(r,c)}）がアンカーへ強制帰還`,me); G.board[r][c]=null; ribReturn(p); if(G.over)return; } }
  // atomics
  for(const[r,c,p]of piecesOf(me)){
    for(const[k,rad]of[['atomic',2],['bomb',1]]){ if(p.b[k]&&p.b[k].at<=G.T){ const f=findById(p.id); if(f&&f[2].b[k]){delete f[2].b[k];atomicBlast(f[0],f[1],rad);} if(G.over)return; } }
    if(p.b.fireb&&p.b.fireb.at<=G.T){const f=findById(p.id);if(f&&f[2].b.fireb){delete f[2].b.fireb;fireBlast(f[0],f[1]);}if(G.over)return;}
  }
  // viper's pit ticks
  for(const f of G.fields.filter(f=>f.type==='pit'&&f.owner===me)){
    for(const[r,c]of f.cells){const q=G.board[r][c];if(!q)continue;
      if(q.c===me){ if(!ward(q)){ q.poison={at:(q.poison&&q.poison.until>G.T)?q.poison.at:G.T,until:G.T+6}; } }
      else{const cf=findById(f.carrier);poisonPiece(r,c,'バイパーズピット',cf&&cf[2]);}}
  }
  if(G.over)return;
  for(const[r,c,p]of piecesOf(me)){if(p.b.xbow&&p.b.xbow.ch!=null&&G.T>p.b.xbow.ch+4){p.b.xbow.ch=null;log(`${pname(p)}（${nota(r,c)}）の弩の溜めが切れた`,me);}}
  if(!pl.started){pl.started=true;pl.energy=2;if(pl.opener){if(CARDS[pl.opener.key].sticky)pl.opener.held=true;pl.hand.push(pl.opener);pl.opener=null;draw(me,2);}else draw(me,3);}
  else{pl.energy=Math.min(10,pl.energy+1);draw(me,2);}
  if(pl.fixate&&G.T>=pl.fixate.next&&pl.started){pl.fixate.next=G.T+4;if(pl.hand.length<6){pl.hand.push({uid:uid++,key:pl.fixate.key,zero:true});log(`固定化：「${CARDS[pl.fixate.key].name}」（コスト0）を手札に加えた`,me);}}
  pl.awakeUsed=false;
  for(const[r,c,q]of piecesOf(opp(me))){if(q.poop&&q.poop.by===me&&q.poop.at<=G.T){delete q.poop;log(`${isHidden(q,r,c)?'？':pname(q)}（${nota(r,c)}）はうんちで倒れた`,me);killPiece(r,c,'poop',me);if(G.over)return;}}
  if(pl.awake&&G.T>=pl.awake.next){
    const cand=piecesOf(me).filter(x=>x[2].t!=='K').sort((a,b)=>val(a[2])-val(b[2]));
    if(!cand.length){log('犠牲にする駒がなく、BEAST KINGは力尽きた',me,true);gameOver(opp(me));return;}
    const[sr,sc,sp]=cand[0];G.board[sr][sc]=null;fx(sr,sc,'犠牲','kill');log(`BEAST KINGの代償：${pname(sp)}（${nota(sr,sc)}）を犠牲にした`,me);pl.awake.next=G.T+4;
  }
  if(pl.magician&&!findById(pl.magician.pid))magicianEnd(me);
  if(pl.magician&&G.T>=pl.magician.next){pl.magician.ready=true;if(SIM||(G.mode!=='online'&&me!==ME)){if(magicianOutside(me))magicianCast(me);}else log(`魔術師の「${CARDS[pl.magician.card.key].name}」がこの番に使える${magicianOutside(me)?'':'（魔術師の駒を自分の魔法防御の外に出すと使える）'}`,me);}
  if(G.T>=11){const q=G.board[CENTER[0]][CENTER[1]];if(q&&q.c===me&&(G.T>=25||G.T>=(pl.centerNext||0))){pl.energy=Math.min(10,pl.energy+1);pl.centerNext=G.T+4;fx(CENTER[0],CENTER[1],'中央+1','res');log(`中央（${nota(...CENTER)}）を押さえているので${who(me)}はエネルギー+1${G.T>=25?'':'（次は2ターン後から）'}`,me);}}
  G.main=true;G.sel=null;G.pending=null;G.shootMode=false;G.forceEnd=false;G.neonFrom=null;G.breachAim=null;G.leaderFrom=null;
  asnCheck(true);
  priestStart(me);
  render();
  if(me==='g'&&!SIM&&G.mode!=='online')setTimeout(botTurn,700);
}
function endTurn(){
  const me=G.turn,pl=G.players[me];
  const cands=pl.hand.filter(c=>!c.held);
  if(pl.awake&&cands.length){
    if(me===ME&&!SIM){openBeastHold(cands);return;}
    const k=[...cands].sort((a,b)=>(CARDS[b.key].cat==='awk')-(CARDS[a.key].cat==='awk')||CARDS[b.key].cost-CARDS[a.key].cost)[0];
    k.held=true;finishEnd(null);return;
  }
  if(pl.keeper&&cands.length){
    if(me===ME&&!SIM){openKeep(cands);return;}
    const k=[...cands].sort((a,b)=>CARDS[b.key].cost-CARDS[a.key].cost)[0];
    finishEnd(k.uid);return;
  }
  finishEnd(null);
}
function finishEnd(keepUid){
  const me=G.turn,pl=G.players[me];
  G.modal=false;pl.discount=0;
  if(pl.awake){const k=findKing(me);if(k)for(const[r,c,q]of piecesOf(opp(me))){if(cheb(r,c,k[0],k[1])<=1&&isLocked(q)){log(`王の周りで熟睡していた${pname(q)}（${nota(r,c)}）が倒れた`,me);killPiece(r,c,'sleep',me);if(G.over){render();return;}}}}
  if(pl.magician&&pl.magician.ready){if(!SIM&&!(G.mode!=='online'&&me!==ME))log(`魔術師の「${CARDS[pl.magician.card.key].name}」は使われずに不発`,me);magicianFinish(me);}
  for(const[r,c,p]of piecesOf(me)){
    if(p.burn&&p.burn.dl<=G.T){log(`${pname(p)}（${nota(r,c)}）は動かなかったため延焼で倒れた`,opp(me));{const kc=p.burn.col!=null?p.burn.col:opp(me);killPiece(r,c,'fire',kc===p.c?null:kc,kc===p.c?null:p.burn.by);}if(G.over){render();return;}}
  }
  for(const[r,c,p]of piecesOf(me)){
    if(p.petri&&p.petri.dl<=G.T){delete p.petri;p.b.lock={until:G.T+3};p.petImm=G.T+6;fx(r,c,'石化','mag');log(`${pname(p)}（${nota(r,c)}）は動かなかったため石になり、次の番は動けない`,opp(me));}
  }
  const out=pl.hand.filter(c=>!c.held&&c.uid!==keepUid);
  pl.hand=pl.hand.filter(c=>c.held||c.uid===keepUid);
  if(out.length){out.forEach(c=>{if(c.zero)return;if(pl.awake&&CARDS[c.key].cat!=='awk')pl.exhaust.push(c);else pl.discard.push(c);});log(`使わなかった${out.length}枚を捨て札へ`,me);}
  const kept=pl.hand.find(c=>c.uid===keepUid);
  if(kept)log(me===ME&&!isOnline()?`「${CARDS[kept.key].name}」を次のターンへ持ち越した`:`${who(me)}は1枚を次のターンへ持ち越した`,me);
  asnCheck();
  if(pl.hunter2){if(pl.hunter2.t===G.T)log('ハンターズフューリーの2発目は予告されず不発',me);pl.hunter2=null;}
  G.sel=null;G.pending=null;G.shootMode=false;G.molAim=null;G.turn=opp(G.turn);startTurn();
}

/* ---------- movement ---------- */
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]],DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];
function rawMoves(r,c){
  const p=G.board[r][c];
  let out=genMoves(r,c,fw(p.c));
  if(p.b.rewind&&p.b.rewind.until>G.T){for(const m of genMoves(r,c,-fw(p.c)))if(!m.cap&&!out.some(x=>x.r===m.r&&x.c===m.c))out.push(m);}
  if(!ward(p)){const sz=fieldsAt('seize',r,c);if(sz.length)out=out.filter(m=>sz.every(f=>has(f.cells,m.r,m.c)));}
  return out;
}
function genMoves(r,c,f){
  const b=G.board,p=b[r][c],out=[];
  const step=(dr,dc)=>{const rr=r+dr,cc=c+dc;if(!inB(rr,cc))return;const t=b[rr][cc];if(t&&t.c===p.c)return;const iv=!!t&&invis(t);out.push({r:rr,c:cc,cap:!!t&&!iv,path:[[rr,cc]],bump:iv?[rr,cc]:null});};
  const slide=(dr,dc)=>{let rr=r+dr,cc=c+dc;const path=[];let bump=null;while(inB(rr,cc)){const t=b[rr][cc];if(t&&t.c===p.c)break;const iv=!!t&&invis(t);path.push([rr,cc]);out.push({r:rr,c:cc,cap:!!t&&!iv,path:[...path],bump:bump||(iv?[rr,cc]:null)});if(iv&&!bump)bump=[rr,cc];if(t&&!iv)break;rr+=dr;cc+=dc;}};
  const GOLD=[[f,0],[f,-1],[f,1],[0,-1],[0,1],[-f,0]];
  const t=p.t;
  if(t==='K')[...ORTH,...DIAG].forEach(([a,d])=>step(a,d));
  else if(t==='G'||(p.pro&&'PLNS'.includes(t)))GOLD.forEach(([a,d])=>step(a,d));
  else if(t==='P')step(f,0);
  else if(t==='L')slide(f,0);
  else if(t==='N'){step(2*f,-1);step(2*f,1);}
  else if(t==='S')[[f,0],[f,-1],[f,1],[-f,-1],[-f,1]].forEach(([a,d])=>step(a,d));
  else if(t==='B'){DIAG.forEach(([a,d])=>slide(a,d));if(p.pro)ORTH.forEach(([a,d])=>step(a,d));}
  else if(t==='R'){ORTH.forEach(([a,d])=>slide(a,d));if(p.pro)DIAG.forEach(([a,d])=>step(a,d));}
  if(p.b.leg&&p.b.leg.until>G.T){step(2*f,-1);step(2*f,1);}
  const seen=new Set();return out.filter(m=>{const k=m.r*N+m.c;if(seen.has(k))return false;seen.add(k);return true;});
}
function movesFor(r,c){
  const p=G.board[r][c];
  if(!p||p.c!==G.turn||isLocked(p)||shotLocked(p)||(isStunned(p)&&aiming(p)))return [];
  const mv=rawMoves(r,c);

function validTargets(key,first,col){

    case 'enemyPoisoned':return xy(piecesOf(op).filter(([r,c,p])=>!invis(p)&&p.poison&&p.poison.until>G.T&&!isProtected(me,r,c)&&!ward(p)));
    case 'summonSq':{const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(G.board[r][c])continue;if(campRowProtected(me,r)||mine.some(([r2,c2,p])=>p.b.barrier&&cheb(r,c,r2,c2)<=1))o.push([r,c]);}return o;}

      if(k==='ward')return (p.poison||p.burn||p.petri?4:0)+(att?1:0)+(p.t==='K'?2:0);

function scoreMove(fr,fc,m,me){

    for(const e of top){if(timeUp())break;const r=runPlan(base,e.plan,real);e.sum+=r.score;e.n++;await tick();}
    if(level===2&&top.every(e=>e.n>=4))break;

async function botTurnSearch(){
  const myG=G;if(!G||G.over||G.turn!=='g')return;
  G.busy=true;render();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stale=()=>G!==myG||G.over;
  const best=await searchPlan(botLevel,botLevel===3?10000:6000);
  if(stale())return;
  render();
  if(best)for(const a of best.rec){await wait(550);if(stale())return;simApply(a);if(stale())return;if(G.forceEnd)break;}
  if(G.main&&!G.forceEnd){const g2=greedyMain('g');if(g2){await wait(500);if(stale())return;simApply(g2);if(stale())return;}}
  await wait(450);if(stale())return;
  if(!G.over){greedyBreach(G.turn,null);greedyArrow(G.turn,null);greedyInterro(G.turn,null);greedyTaser(G.turn,null);greedyHunter(G.turn,null);botAmbush(G.turn);}
  G.busy=false;endTurn();
}

  marshal:()=>mkDiag(7,7,[3,3],rays([3,3],DG4,7,7,'v'),[['v','斜めの射線。最初に当たった敵に毒']]),
  outlaw:()=>mkDiag(7,7,[6,3],outlawCells(),[['a','必ず通る直線（前1〜3）'],['g','そのまま直進'],['b','左か右に1列曲げる'],]),
  hunter:()=>mkDiag(7,7,[6,3],outlawCells(),[['a','必ず通る（貫通）'],['g','直進'],['b','左か右に曲げる'],]),
  xbow:()=>mkDiag(7,7,[3,3],[[2,3,'a'],[1,3,'a'],[0,3,'a'],[3,2,'b'],[3,1,'b'],[3,0,'b'],[3,4,'b'],[3,5,'b'],[3,6,'b']],[['a','前を向いた時の3マス'],['b','左・右を向いた時']]),
  arrow:()=>mkDiag(5,5,[4,2],[[3,2,'a'],[2,2,'g'],[1,2,'g'],[2,1,'b'],[2,3,'b']],[['a','1マス前（必ず通る）'],['g','直進で3マス先まで'],['b','2マス先で左右に曲げる'],['n','最初に当たった敵1体に延焼']]),
  neon:()=>mkDiag(5,5,[4,2],[[3,2,'y'],[2,2,'y']],[['y','1マス前か2マス前を選ぶ（1ターン後に着弾）']]),
  blade:()=>mkDiag(5,5,[2,2],[[1,2,'v'],[0,2,'v'],[2,1,'o'],[2,0,'o'],[2,3,'o'],[2,4,'o']],[['v','前を向いた時の2マス'],['o','左・右を向いた時']]),
  snake:()=>mkDiag(5,5,[2,2],[[1,2,'m'],[0,2,'m'],[2,1,'o'],[2,0,'o'],[2,3,'o'],[2,4,'o']],[['m','前を向いた時：止まった敵を石化'],['o','左・右を向いた時'],['n','前の自分の番に動いていると発動しない']]),
  chain:()=>{const c=[[2,2,'b'],[2,3,'a','×'],[2,4,'b'],[1,2,'b'],[1,4,'b']];for(let r=3;r<=5;r++)for(let cc=2;cc<=4;cc++)if(!(r===4&&cc===3))c.push([r,cc,'k']);return mkDiag(7,7,[4,3],c,[['b','鎖を付けられる敵の位置'],['a','動かなければここへ引き寄せて毒'],['k','この周り1マスに来たら致死毒'],['n','それ以外へ逃げたらスタン1ターン']]);},
  taser:()=>mkDiag(6,5,[5,2],[[4,2,'y'],[3,2,'r'],[2,2,'y'],[1,2,'y']],[['y','前4マスの敵をスタン1（即）'],['r','2マス目はスタン＋延焼']]),
  interro:()=>mkDiag(5,5,[2,2],[[0,1,'m'],[0,2,'m'],[0,3,'m'],[4,1,'m'],[4,2,'m'],[4,3,'m'],[1,0,'m'],[2,0,'m'],[3,0,'m'],[1,4,'m'],[2,4,'m'],[3,4,'m']],[['m','2マス離れた輪の敵1体（動いた後）'],['n','毒→致死毒／スタン→石化']]),
  molotov:()=>{const c=[];for(const[r0,c0]of[[3,3],[4,2],[4,4]]){for(const[a,b]of[[-1,0],[1,0],[0,-1],[0,1]])c.push([r0+a,c0+b,'o']);}for(const[r0,c0]of[[3,3],[4,2],[4,4]])c.push([r0,c0,'x','◎']);return mkDiag(7,7,[6,3],c,[['x','落とす中心（3か所から選ぶ）'],['o','倒す向き（中心の上下左右）']]);},
  breach:()=>mkDiag(7,7,[6,3],[[3,3,'a'],[2,3,'a','3'],[1,3,'a','3'],[3,2,'b'],[2,2,'b'],[1,2,'b','3'],[3,4,'b'],[2,4,'b'],[1,4,'b','3'],[3,1,'g'],[2,1,'g','3'],[3,5,'g'],[2,5,'g','3'],[4,1,'y'],[3,0,'y','3'],[4,5,'y'],[3,6,'y','3']],[['a','正面の縦3'],['b','左右の縦3'],['g','外側の縦2'],['y','斜めの2マス'],['n','7つから1つを選ぶ。「3」はスタン3ターン。味方も巻き込む']]),
  roll:()=>{const c=[];for(let r=2;r<=5;r++)for(let cc=2;cc<=4;cc++)c.push([r,cc,'m']);return mkDiag(7,7,[6,3],c,[['m','前方3×4。1ターン後に押し出してスタン']]);},
  tdf:()=>{const c=rays([3,3],ALL8,7,7,'o');for(const x of c)if(x[1]===3&&x[0]<3)x[2]='a';c.push(...sq(0,3,1,'s').filter(x=>!(x[0]===0&&x[1]===3)));c.push([0,3,'k','×']);return mkDiag(7,7,[3,3],c,[['o','8方向から1本を選ぶ'],['a','選んだ射線（例）'],['k','最初に当たった駒を破壊'],['s','そこを中心にシーズ']]);},
  thunder:()=>{const c=[];const lab=['1','1','2','3','3'];for(let k=0;k<5;k++)for(const r of[2,3])c.push([r,1+k,'a',lab[k]]);return mkDiag(6,7,null,c,[['a','横5×縦2。数字の順に1ターンおきに爆撃']]);},
  pit:()=>{const c=[];for(const r of[3,2])for(let cc=1;cc<=5;cc++)c.push([r,cc,'v']);return mkDiag(6,7,[3,3],c,[['v','横5×縦2の毒領域']]);},
  fireb:()=>mkDiag(5,5,[2,2],[[0,2,'r'],[2,0,'r'],[2,4,'r'],[1,1,'r'],[1,2,'r'],[1,3,'r'],[2,1,'r'],[2,3,'r'],[3,1,'r'],[3,2,'r'],[3,3,'r']],[['r','しずく形11マスに延焼（敵味方・王も）'],['n','燃えた敵の上下左右へ、次の番に1回だけ燃え移る'],['n','この駒自身は燃え尽きて倒れる']]),
  bomb:()=>mkDiag(5,5,[2,2],sq(2,2,1,'a'),[['a','3×3（敵味方・王も）']]),
  atomic:()=>mkDiag(7,7,[3,3],sq(3,3,2,'a').filter(([r,c])=>!(Math.abs(r-3)===2&&Math.abs(c-3)===2)),[['a','5×5の四隅を除く21マス（敵味方・王も）']]),
  leader:()=>mkDiag(5,5,[2,2],[[1,1,'o'],[1,2,'o'],[1,3,'o'],[2,1,'g','歩'],[2,3,'o'],[3,1,'o'],[3,2,'o'],[3,3,'g','歩'],[1,1,'y','↑'],[2,3,'y','↑']],[['o','周り1マス（動く前か後の位置）'],['g','連れて行ける歩'],['y','1マス前へ（1ターンに1つ）']],'導'),
  priest:()=>mkDiag(5,5,[2,2],sq(2,2,1,'h'),[['h','自分と周り1マスの味方1体を解除']]),
  barrier:()=>mkDiag(5,5,[2,2],sq(2,2,1,'m'),[['m','相手の魔法が届かない範囲']]),
  roar:()=>mkDiag(5,5,[2,2],sq(2,2,2,'y'),[['y','王の周り5×5をスタン']],'王'),
  poop:()=>mkDiag(7,7,[3,3],rays([3,3],ALL8,7,7,'r'),[['r','王からの射線。最初の敵にうんち']],'王'),
};
for(const k of['seize','swamp','smoke','mist','dispel'])DIAGS[k]=()=>mkDiag(5,5,null,sq(2,2,1,'m'),[['m','選んだマスを中心に3×3']]);
function diagramHTML(k){try{return DIAGS[k]?DIAGS[k]():'';}catch(e){return '';}}

/* ---------- debuff jump ---------- */
function showDebuff(id){
  let el=$('#modalRoot').querySelector('#db-'+id);
  if(!el){showLibrary();el=$('#modalRoot').querySelector('#db-'+id);}
  if(!el)return;tipHide();
  const det=el.closest('details');if(det)det.open=true;
  const bar=$('#modalRoot').querySelector('.deckbar');el.style.scrollMarginTop=((bar?bar.offsetHeight:0)+12)+'px';
  el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-db]');if(!b)return;e.preventDefault();e.stopPropagation();showDebuff(b.dataset.db);},true);

/* ---------- card tooltip ---------- */
let tipEl=null,tipFor=null,lpTimer=null,lpShown=false,lpSuppress=false;
function tipShow(cardEl,k){
  const d=CARDS[k];if(!d)return;
  if(!tipEl){tipEl=document.createElement('div');tipEl.id='cardTip';tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);}
  const g=subOf(k);
  tipEl.className='ctip '+d.cat;
  const dg=diagramHTML(k);
  tipEl.innerHTML=`<div class="th"><span class="tc">${d.cost}</span><b>${d.name}</b><span class="tt">${CAT[d.cat]}${g?' ／ '+g.name:''}</span></div>${winfoChips(k,true)}<div class="tb${dg?' hasdg':''}">${dg}<div class="tx">${d.text}</div></div>`;
  tipEl.style.display='block';tipFor=cardEl;
  const r=cardEl.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight,tw=Math.min(dg?470:320,W-16);tipEl.style.width=tw+'px';
  const th=tipEl.offsetHeight;let x,y;
  if(r.right+10+tw<=W-8){x=r.right+10;y=r.top;}
  else if(r.left-10-tw>=8){x=r.left-10-tw;y=r.top;}
  else{x=Math.max(8,Math.min(W-tw-8,r.left+r.width/2-tw/2));y=r.top-th-8;if(y<8)y=r.bottom+8;}
  y=Math.max(8,Math.min(y,H-th-8));
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}
function tipHide(){if(tipEl)tipEl.style.display='none';tipFor=null;}
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.card[data-k],.ochip[data-key]');if(!c){if(tipFor)tipHide();return;}if(c!==tipFor)tipShow(c,c.dataset.k||c.dataset.key);});
document.addEventListener('scroll',()=>{if(tipFor&&!lpShown)tipHide();},true);
document.addEventListener('touchstart',e=>{const c=e.target.closest&&e.target.closest('.card[data-k],.ochip[data-key]');clearTimeout(lpTimer);if(!c){if(lpShown){tipHide();lpShown=false;}return;}if(lpShown){tipHide();lpShown=false;}lpTimer=setTimeout(()=>{lpShown=true;lpSuppress=true;tipShow(c,c.dataset.k||c.dataset.key);},450);},{passive:true});
document.addEventListener('touchmove',()=>clearTimeout(lpTimer),{passive:true});
document.addEventListener('touchend',()=>clearTimeout(lpTimer),{passive:true});
document.addEventListener('click',e=>{if(lpSuppress){lpSuppress=false;e.preventDefault();e.stopPropagation();}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.card[data-k]'))e.preventDefault();});

/* ---------- modals ---------- */
function openModal(html,bind,wide){
  const root=$('#modalRoot');root.innerHTML=`<div class="modal-bg"><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  bind&&bind(root);
}
function closeModal(){$('#modalRoot').innerHTML='';tipHide();}
function openSearch(){
  const pl=G.players[ME];G.modal=true;
  const list=[...pl.draw].sort((a,b)=>a.key<b.key?-1:1);
  openModal(`<h3>探索：山札から1枚選ぶ</h3><p>選んだカードは保留で手札に入り、使うまでターンをまたいで手札に残ります。</p>
    <div class="grid-cards">${list.map(c=>cardHTML(c.key,c.uid,'',ME)).join('')}</div>`,root=>{
    root.querySelectorAll('.grid-cards .card').forEach(el=>el.addEventListener('click',()=>{
      const id=+el.dataset.uid;const card=pl.draw.find(x=>x.uid===id);
      pl.draw=shuffle(pl.draw.filter(x=>x.uid!==id));
      card.held=true;pl.hand.push(card);
      log(`${who(ME)}は山札から${isOnline()?'1枚':'「'+CARDS[card.key].name+'」'}を保留で手札に加えた`,ME);
      G.modal=false;closeModal();render();
    }));
  });
}
function showPile(which){
  if(!G||G.preview)return;
  const pl=G.players[ME];const list=[...pl[which]].sort((a,b)=>a.key<b.key?-1:1);
  const prev=G.modal;G.modal=true;
  openModal(`<h3>${which==='draw'?'山札':'捨て札'}（${list.length}枚）</h3><p>${which==='draw'?'並びは種類順です。実際の順番はシャッフルされています。':'山札が尽きると捨て札をシャッフルして山札にします。'}</p>
    <div class="grid-cards">${list.length?list.map(c=>cardHTML(c.key,null,'static',ME)).join(''):'<span style="color:var(--muted)">カードはありません</span>'}</div>
    <div class="modal-actions"><button class="btn" data-close type="button">閉じる</button></div>`,root=>{
    root.querySelector('[data-close]').addEventListener('click',()=>{G.modal=prev;closeModal();render();});
  });
}
function showCard(key){
  const prev=G?G.modal:false;if(G)G.modal=true;
  openModal(`<div class="grid-cards">${cardHTML(key,null,'static')}</div><div class="modal-actions"><button class="btn" data-close type="button">閉じる</button></div>`,root=>{
    root.querySelector('[data-close]').addEventListener('click',()=>{if(G)G.modal=prev;closeModal();render();});
  });
}
function showLibrary(){
  const prev=G?G.modal:false;if(G)G.modal=true;
  const color={enh:'var(--enh)',res:'var(--res)',mag:'var(--mag)',awk:'#a3326b'};
  const owned=k=>G&&!G.preview?[ME,opp(ME)].map(c=>{const pl=G.players[c];const all=[...pl.draw,...pl.hand,...pl.discard,...(pl.opener?[pl.opener]:[])];return all.filter(x=>x.key===k).length;}):[0,0];
  openModal(`<div class="deckrow" style="margin-bottom:6px"><h3 style="margin:0">カード一覧</h3><span class="grow"></span><button class="btn" data-close type="button">閉じる</button></div>
    <p>対局中に出てくる全カードの効果です。カードの下の数字は、あなたと相手のデッキに残っている枚数（山札・手札・捨て札の合計）です。</p>
    ${jumpNav(['enh','res','mag',...(awakeSeen()?['awk']:[])])}
    ${['enh','res','mag',...(awakeSeen()?['awk']:[])].map(c=>`<div class="cat"><h4><i style="background:${color[c]}"></i>${CAT[c]}</h4>
      ${groupedPool(c,k=>{const[a,b]=owned(k);return `<div class="libitem">${cardHTML(k,null,'static')}${G&&!G.preview?`<div class="libcount">あなた ${a} ／ ${isOnline()?'相手':'bot'} ${b}</div>`:''}</div>`;})}
    </div>`).join('')}
    <div class="cat"><h4><i style="background:var(--poison)"></i>状態と盤面の効果</h4>
      ${GLOSSARY_HTML}</div>`,root=>{
    bindJump(root);
    root.querySelector('[data-close]').addEventListener('click',()=>{if(G)G.modal=prev;closeModal();render();});
  },true);
}
const GLOSSARY_HTML=`      <div class="dbuffs">
        <h5>デバフ（駒に付く悪い状態）</h5>
        <div id="db-poison" class="dbi poison"><b><em class="wd poison">毒</em></b><p>バッジ「毒N」（Nは残りターン）。<b>3ターン</b>たつと自然に消える。毒の間に、<b>別の手番でもう一度毒を受けると倒れる</b>（同じ番に2回当たっても倒れない）。王にも付き、王も2回目で倒れる。<br>付けるもの：毒刃・マーシャル・ハンターズフューリー・毒沼・感染・バイパーズピット。<br>消すもの：解呪・加護・プリースト（加護の間は毒を受けない）。</p></div>
        <div id="db-stun" class="dbi stun"><b><em class="wd stun">スタン</em></b><p>バッジ「眩N」。<b>移動はできるが、駒を取れず、武器も撃てない</b>。狙っている状態（覗き中）のオペレーターがスタンを受けると、スタンの間は動くこともできない。見えない駒にぶつかると移動は無効になりターンが終わる。<br>付けるもの：ブリーチ・ネオン・ローリングサンダー・蝕み・んあー。<br>消すもの：プリースト（着弾してスタンが付いた後のみ。予告中は消せない）。</p></div>
        <div id="db-lethal" class="dbi lethal"><b><em class="wd lethal">致死毒</em></b><p>バッジ「死」。<b>時間では消えない</b>。致死毒の駒に、懸賞以外のデバフ（毒・スタン・延焼・石化・熟睡・うんち・シーズ）が付くと<b>その場で倒れる</b>。すでにデバフを受けている駒に致死毒が当たると即死。致死毒に致死毒でも即死。王にも付く。<br>付けるもの：アウトロー・猛毒化（毒を致死毒に変える）・アサシンの暗殺（潜伏からバレた次の番に王を取る手）。<br>消すもの：解呪・プリーストだけ。<b>加護を貫通する</b>（加護の付いた駒にも致死毒が付き、加護では消えない）。ただし加護の間はほかのデバフを受けないので、それでは倒れない。加護の間でも、もう一度致死毒を受けると倒れる。</p></div>
        <div id="db-burn" class="dbi burn"><b><em class="wd burn">延焼</em></b><p>バッジ「延」。<b>次の自分の番の終わりまでにその駒を動かさないと倒れる</b>。動かせば消える。動けない駒（石・熟睡・囲まれた王など）に付くとほぼ確実に倒れる。王にも付く。<br>付けるもの：火矢・遠投兵（火炎瓶）。<br>消すもの：動かす・解呪・加護・プリースト。</p></div>
        <div id="db-petri" class="dbi petri"><b><em class="wd petri">石化</em></b><p>バッジ「石」。<b>次の自分の番に動かさないと、その次の番は石になって動けない</b>（バッジ「固」）。石になった後3ターンは、もう一度石化しない。王にも付く。<br>付けるもの：蛇の目（動かずに見張っている時、向いた2マスに止まると発動）・石化の眼。<br>消すもの：動かす・解呪・加護・プリースト。</p></div>
      </div>
      <div class="glossary">
        <div><b>向き</b>毒刃・弩・蛇の目を持つ駒は、前・左・右のどれかを向く。向きは駒を動かす前（弩は溜める前）に選ぶ。駒の矢印バッジが今の向き。</div>
        <div><b>武器の準備</b>毒刃・火矢・弩・蛇の目・バイパーズピットは、付けた番は働かず、次の自分の番から有効。オペレーターは付けた番と次の番は撃てず、動いた・押された・移された時もその番と次の番は撃てない。</div>
        <div><b>覗き中（オペレーター）</b>撃てる状態のオペレーターの駒（バッジ「覗」）。この状態でスタンを受けると、スタン中は動くこともできない。</div>
        <div><b>毒刃の装填</b>毒刃は毒を与えると空になり（刃↻）、次の1回の移動で装填し直す。毒は最初に当たった駒にだけかかる。</div>
        <div><b>アイソアーマー</b>付けた番から次の相手の番が終わるまで、どんな攻撃でも1回だけ耐える（バッジ「甲」）。付けてから2ターン以内にその駒が敵を倒すと、アーマーが1ターン分復活する（バッジ「甲N↻」は復活できる残りターン）。</div>
        <div><b>武器は1つまで</b>毒刃・オペレーター・火矢・弩・蛇の目・ネオン・マーシャル・ブリーチは武器。1つの駒には武器を1つしか持てず、別の武器を付けると前の武器は消えて上書きされる。</div>
        <div><b>アサシンの暗殺</b>潜伏中に敵が近づいてバレた次の番、そのアサシンで王を取る手は、取る代わりに王へ致死毒を刺す（すでに致死毒やデバフがあれば倒れる）。</div>
        <div><b>武器のアイコン</b>「手番」メインの手を使って撃つ。「移動後OK」動いた後なら手を使わない。「移動後」動いた後に手を使わず撃つ。「自動」条件で勝手に発動。「溜め」溜めてから撃つ。「リロードN」撃った後N回の自分の番は撃てない。色付きの「毒・スタン・致死毒・延焼・石化」は与えるデバフで、押すと説明に飛ぶ。「予告N」N ターン後に着弾。「即着弾」その場で当たる。</div>
        <div><b>撃破ボーナス</b>相手の駒を倒すとエネルギー。歩0、香・桂・銀・金+1、飛・角・成った駒+2。</div>
        <div><b>中央</b>11手目から、中央（4四）に自分の駒がいると番の開始時にエネルギー+1。受け取ったら次は2ターン後から。25手目からは毎ターン受け取れる。</div>
        <div><b>保留</b>探索で加えたカード。使うまで手札に残る。</div>
        <div><b>魔法防御</b>相手の陣の残っている段と、魔法障壁（6ターンで解除）の周り1マスには相手の魔法が届かない。15手・25手で1段ずつ自然にはがれる。</div>
        <div><b>爆撃跡</b>アルマゲドンの着弾マス。1ターンの間、入った駒は倒れる（王は耐える）。</div>
      </div>`;
const RULES_HTML=`<div class="rules">
    <div><h4>盤と駒</h4><p>7×7の盤で、あなたが先手、botが後手です。駒の動きは将棋と同じで、取った駒は使えません（持ち駒なし）。相手側の2段に入る・出る・その中で動くと自動で成ります。相手の王（自分の王将は玉）を倒したら勝ちです。</p></div>
    <div><h4>手番</h4><p>毎ターン、駒を必ず1手（メインの手）動かします。動かせる駒がない時だけ、動かさずに終了できます。狙撃はメインの手の代わりに行います。カードは駒を動かす前でも後でも、エネルギーがある限り使えます。</p></div>
    <div><h4>エネルギー</h4><p>最初の手番は2エネルギーと手札3枚で始まります。以降は毎ターンエネルギー+1、カードを2枚引きます。使わなかったエネルギーは持ち越せます（上限10）。使わなかった手札はターン終了時にすべて捨て札へ行き、山札が尽きると捨て札をシャッフルして山札に戻します。</p></div>
    <div><h4>デッキ</h4><p>対局前に8枚を選びます（同じカードは2枚まで）。一番左の「初手」枠のカードは、必ず最初の手札に入ります。使ったカードは捨て札へ行き、山札が尽きたらシャッフルして戻ります。</p></div>
    <div><h4>魔法防御（段階式）</h4><p>各陣地（相手側2段）は魔法防御2段で始まります。15手目を過ぎると手前の段、25手目を過ぎると奥の段も自然にはがれます。「結界崩し」を使えば相手の陣の防御を早めに1段ずつはがせます。魔法障壁を持つ駒の周り1マスにも相手の魔法は届きません（解呪だけは例外）。</p></div>
    <div><h4>毒</h4><p>毒は3ターンで自然に消えます。毒が残っている間に、別の手番でもう一度毒を受けると倒れます。バイパーズピットの中では、持ち主側の駒は毒になっても倒れません。</p></div>
    <div><h4>延焼と石化</h4><p>延焼した駒は、次の自分の番に自分の手（メインの手・疾風・アンカー移動）で動かさないと倒れます。石化した駒は、次の自分の番に動かさないと、その次の番は動けなくなります。転移で動かしても解除されません。固まりが解けた直後は、しばらく石化を受けません。</p></div>
    <div><h4>スタンと武器の準備</h4><p>スタンした駒は移動はできますが、駒を取ることも、狙撃・火矢・弩を撃つこともできません。取れない状態で、煙幕・暗雲に隠れた駒のマスへ動こうとすると、移動は無効になりターンが終わります。武器（毒刃・火矢・弩・蛇の目・バイパーズピット）は付けた番は働かず、次の自分の番から有効です。オペレーターは付けた番と次の番は撃てず、動いた・押された・移された時もその番と次の番は撃てません。撃つと4ターン撃てません。撃てる状態（覗き中）でスタンを受けると、スタン中は動けません。発砲にはエネルギー1が必要です。</p></div>
    <div><h4>弩の溜め</h4><p>弩はメインの手を使って溜めます。溜めた次の番か次の次の番に、手を使わず撃てます。撃たずに過ぎるか、その駒が動くと溜めは消えます。溜めている間は射線が赤く表示されます。</p></div>
    <div><h4>撃破ボーナスと中央</h4><p>相手の駒を倒すとエネルギーが入ります（歩0、香・桂・銀・金+1、飛・角・成った駒+2）。11手目からは、盤の中央（4四）に自分の駒を置いて番を迎えるとエネルギー+1。受け取ったら次に受け取れるのは2ターン後です。25手目からは、中央にいれば毎ターン受け取れます。</p></div>
    <div><h4>botの強さ</h4><p>デッキを組む画面で3段階から選べます。やさしいはすぐに指します。ふつうは約6秒、つよいは約10秒考え、カードと駒の動かし方の組み合わせを先読みして選びます。つよいは5種類の最強デッキ（狙撃部隊・毒と石・焦土作戦・火矢の前線・兵站部隊）のどれかで挑んできます。</p></div>
    <div><h4>王について</h4><p>王は取られるほか、毒・延焼・アトミック・自爆・狙撃・弩でも倒れます。アルマゲドンの爆撃と爆撃跡だけは耐えます。爆発で両方の王が同時に倒れたら引き分けです。</p></div>
    <div><h4>保留と消えるカード</h4><p>探索で手札に加えたカードは「保留」になり、使うまでターンをまたいで手札に残ります。「保持化」を使うと、以降毎ターン終了時に手札を1枚だけ持ち越せます（新しく引くのは2枚のままなので、次の手札は3枚）。供物は使っても消えず、捨て札に戻ります。保険を付けた歩を供物にすると、保険の+2も入ります（合計+3）。</p></div>
    <div><h4>ターンの数え方</h4><p>カードの「2ターン」は、使った人の手番が2回来るまで続きます。駒のバッジや盤上の数字は残りターン数です。</p></div>
  </div>`;
function showRules(){
  const prev=G?G.modal:false;if(G)G.modal=true;
  openModal(`<h3>七路将棋カードバトルのルール</h3>${RULES_HTML}${awakeSeen()?'<div class="rules" style="margin-top:12px">'+AWAKE_RULES+'</div>':''}<div class="modal-actions" style="margin-top:16px"><button class="btn on" data-close type="button">閉じる</button></div>`,root=>{
    root.querySelector('[data-close]').addEventListener('click',()=>{if(G)G.modal=prev;closeModal();render();});

}

/* ---------- online (Firebase Realtime Database) ---------- */
const FB_VER='10.13.2';
const myId=Math.random().toString(36).slice(2,10);
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('load'));document.head.appendChild(s);});}
async function loadFirebase(){
  if(window.firebase&&window.firebase.database)return;
  const bases=[`https://www.gstatic.com/firebasejs/${FB_VER}/`,`https://cdnjs.cloudflare.com/ajax/libs/firebase/${FB_VER}/`,`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/`];
  let last;
  for(const b of bases){try{if(!window.firebase)await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-database-compat.js');if(window.firebase&&window.firebase.database)return;}catch(e){last=e;}}
  throw last||new Error('load');
}
function parseConfig(text){
  if(!text)return null;
  try{const j=JSON.parse(text);if(j&&j.databaseURL)return j;}catch(e){}
  const o={};const re=/(\w+)\s*:\s*["']([^"']+)["']/g;let m;while((m=re.exec(text)))o[m[1]]=m[2];
  return o.databaseURL&&o.apiKey?o:null;
}
function savedConfig(){
  if(FIREBASE_CONFIG)return FIREBASE_CONFIG;
  try{return parseConfig(localStorage.getItem('shogi7_fb')||'');}catch(e){return null;}
}
async function connectDb(){
  const cfg=savedConfig();if(!cfg)throw new Error('Firebaseの設定がありません。');
  try{await loadFirebase();}catch(e){throw new Error('Firebaseの読み込みに失敗しました。');}
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
  const db=firebase.database(app);
  await new Promise((ok,ng)=>{const ref=db.ref('.info/connected');const t=setTimeout(()=>{ref.off();ng(new Error('Firebaseに接続できません。設定のdatabaseURLを確認してください（Claude上のプレビューでは通信できません）。'));},9000);
    ref.on('value',s=>{if(s.val()===true){clearTimeout(t);ref.off();ok();}});});
  return db;
}
function roomCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s;}
function sharedJson(){
  return JSON.stringify({board:G.board,T:G.T,turn:G.turn,players:G.players,main:G.main,fields:G.fields,campManual:G.campManual,over:G.over,resigned:!!G.resigned,log:G.log.slice(0,80),last:G.last});
}
function syncPush(){
  if(!ONLINE||!isOnline()||ONLINE.applying||G.waiting||SIM)return;
  const j=sharedJson();
  if(j===ONLINE.lastJson)return;
  ONLINE.lastJson=j;ONLINE.v++;
  ONLINE.ref.child('state').set({v:ONLINE.v,by:myId,json:j,uid});
}
function applyRemote(d){
  const st=JSON.parse(d.json);const wasOver=G.over;const wasTurn=G.turn;
  Object.assign(G,st);
  uid=Math.max(uid,d.uid||0);
  G.sel=null;G.pending=null;G.shootMode=false;G.faceSel=null;G.waiting=false;
  if(!wasOver||!st.over){G.modal=false;closeModal();}
  ONLINE.v=d.v;ONLINE.lastJson=d.json;
  ONLINE.applying=true;try{render();}finally{ONLINE.applying=false;}
  if(G.turn===ME&&G.players[ME].priestPick===G.T&&!G.over){G.players[ME].priestPick=null;priestStart(ME);}
  if(!wasOver&&G.over)setTimeout(()=>showOver(G.over),400);
  if(wasTurn!==G.turn&&G.turn===ME){try{document.title='▲ あなたの番｜七路将棋';setTimeout(()=>document.title='七路将棋カードバトル',4000);}catch(e){}}
}
function watchRoom(){
  const o=ONLINE;
  o.ref.child('state').on('value',snap=>{const d=snap.val();if(!d||ONLINE!==o)return;if(d.v<=o.v)return;if(d.by===myId){o.v=d.v;return;}applyRemote(d);});
  const pres=o.ref.child('presence/'+myId);pres.set(true);pres.onDisconnect().remove();
  o.ref.child('presence').on('value',snap=>{if(ONLINE!==o||!G||!isOnline())return;const n=Object.keys(snap.val()||{}).length;const gone=n<2&&!G.waiting;if(gone!==!!G.oppGone){G.oppGone=gone;render();}});
}
function startOnlineGame(hostDeck,guestDeck){
  uid=1;pieceEls.clear();$('#pieces').innerHTML='';$('#fx').innerHTML='';closeModal();
  G=freshState(hostDeck,guestDeck,false);G.mode='online';
  for(const[col,deck]of[['s',hostDeck],['g',guestDeck]]){const pl=G.players[col];const i=pl.draw.findIndex(c=>c.key===deck[0]);if(i>=0)pl.opener=pl.draw.splice(i,1)[0];}
  log(`オンライン対局開始（部屋 ${ONLINE.code}）。先手（▲）から。`,null,true);
  startTurn();
}
function waitingState(){
  uid=1;pieceEls.clear();$('#pieces').innerHTML='';$('#fx').innerHTML='';closeModal();
  G=freshState([],[],false);G.mode='online';G.waiting=true;G.log=[{t:`部屋 ${ONLINE.code} に参加しました。相手の準備を待っています`,sep:true}];
  setOrientation();render();
}
async function createRoom(setStatus){
  const db=await connectDb();
  let code,ref;
  for(let i=0;i<5;i++){code=roomCode();ref=db.ref('rooms/'+code);const ex=await ref.get();if(!ex.exists())break;}
  await ref.set({status:'waiting',created:firebase.database.ServerValue.TIMESTAMP,host:{id:myId,deck:myDeck}});
  ref.onDisconnect().update({hostLeft:true});
  ONLINE={db,ref,code,role:'host',v:0,lastJson:null,applying:false};
  setStatus(`<div class="roomcode">${code}</div><p>この合言葉を相手に伝えてください。相手が入ると対局が始まります（あなたは先手）。</p><button class="btn" type="button" data-copy="${code}">合言葉をコピー</button>`);
  const o=ONLINE;
  ref.child('guest').on('value',snap=>{
    const g=snap.val();if(!g||ONLINE!==o||o.started)return;
    o.started=true;ref.child('guest').off();ref.child('status').set('playing');
    ME='s';setOrientation();watchRoom();startOnlineGame(myDeck,g.deck);
  });
}
async function joinRoom(code,setStatus){
  code=(code||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code))throw new Error('合言葉は英数字4文字です。');
  const db=await connectDb();
  const ref=db.ref('rooms/'+code);
  const snap=await ref.get();
  if(!snap.exists())throw new Error('その合言葉の部屋は見つかりません。');
  const room=snap.val();
  if(room.status!=='waiting'||room.guest)throw new Error('その部屋はすでに対局が始まっています。');
  const tr=await ref.child('guest').transaction(cur=>cur?undefined:{id:myId,deck:myDeck});
  if(!tr.committed)throw new Error('ほかの人が先に入りました。');
  ONLINE={db,ref,code,role:'guest',v:0,lastJson:null,applying:false,started:true};
  ME='g';setOrientation();waitingState();watchRoom();
}
function leaveOnline(silent){
  const o=ONLINE;if(!o)return;
  try{o.ref.child('state').off();o.ref.child('presence').off();o.ref.child('guest').off();o.ref.child('presence/'+myId).remove();}catch(e){}
  ONLINE=null;ME='s';setOrientation();
  if(!silent&&G&&isOnline()){G=freshState([],[],true);G.log=[{t:'デッキを選ぶと対局が始まります',sep:true}];pieceEls.clear();$('#pieces').innerHTML='';render();}
}
function resign(){
  if(!isOnline()||G.over)return;
  G.resigned=true;G.over=opp(ME);log(`${who(ME)}が投了した`,ME,true);render();setTimeout(()=>showOver(G.over),300);
}

            <span class="or">または</span>
            <input id="joincode" maxlength="4" placeholder="合言葉" autocomplete="off" value="${(location.hash.match(/^#r([A-Za-z0-9]{4})$/)||[])[1]||''}">
            <button type="button" class="btn" data-join data-need8 ${cfg?'':'disabled'}>部屋に入る（後手）</button>
          </div>
          <div id="onstatus" class="onstatus">${inRoom?`<div class="roomcode">${ONLINE.code}</div><p>相手を待っています。</p>`:''}</div>
          <details class="guide"><summary>初めての準備（Firebaseとページの公開）</summary>
            <ol class="steps">
              <li><b>Firebaseのプロジェクトを作る</b>：console.firebase.google.com でプロジェクトを作り、「Realtime Database」を作成します。</li>
              <li><b>ルールを設定する</b>：Realtime Databaseの「ルール」に次を貼り付けて公開します。<pre>{ "rules": { "rooms": { "$code": { ".read": true, ".write": true } } } }</pre>誰でも部屋を読み書きできる、試遊向けの設定です。</li>
              <li><b>ウェブアプリを登録</b>：プロジェクトの設定でウェブアプリを追加し、表示される firebaseConfig をここに貼り付けます（コードの先頭の FIREBASE_CONFIG に書いておけば、毎回の貼り付けは不要です）。</li>
              <li><b>ページを公開する</b>：ダウンロードした html を GitHub Pages や Cloudflare Pages に置きます。Claude上のこのページからは通信できないため、オンライン対戦は公開したページで遊んでください。</li>
              <li><b>対戦する</b>：片方が「部屋を作る」で合言葉を出し、もう片方がそれを入れて「部屋に入る」。2人とも8枚のデッキを組んでおきます。</li>
            </ol></details>
        </div>`;
      const st=pane.querySelector('#onstatus');
      const setStatus=h=>{st.innerHTML=h;};
      const err=e=>{busyOn=false;upd();setStatus(`<p class="err">${e.message||e}</p>`);};
      pane.querySelector('[data-cfgsave]')&&pane.querySelector('[data-cfgsave]').addEventListener('click',()=>{
        const c=parseConfig(pane.querySelector('#fbcfg').value);
        if(!c){setStatus('<p class="err">設定を読み取れませんでした。apiKey と databaseURL を含む firebaseConfig を貼り付けてください。</p>');return;}
        try{localStorage.setItem('shogi7_fb',JSON.stringify(c));}catch(e){}
        renderPane();upd();
      });
      pane.querySelector('[data-cfgedit]')&&pane.querySelector('[data-cfgedit]').addEventListener('click',()=>{pane.querySelector('.cfgbox').hidden=false;});
      pane.querySelector('[data-create]').addEventListener('click',async()=>{
        if(draft.length!==8)return;myDeck=[...draft];busyOn=true;upd();setStatus('<p>部屋を作っています…</p>');
        try{if(ONLINE)leaveOnline(true);await createRoom(setStatus);}catch(e){err(e);}
      });
      pane.querySelector('[data-join]').addEventListener('click',async()=>{
        if(draft.length!==8)return;myDeck=[...draft];busyOn=true;upd();setStatus('<p>部屋に入っています…</p>');
        try{if(ONLINE)leaveOnline(true);await joinRoom(pane.querySelector('#joincode').value,setStatus);}catch(e){err(e);}
      });
      pane.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const t=b.dataset.copy;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{b.textContent='コピーしました';}).catch(()=>{b.textContent='合言葉：'+t;});});
    };
    const setTab=t=>{
      mode=t;
      root.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',b.dataset.tab===t);});
      pane.hidden=t!=='online';root.querySelector('#lvrow').hidden=t==='online';root.querySelector('#dbGo').hidden=t==='online';
      if(t==='online')renderPane();
    };
    root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
    setTab(mode);
    upd();
  },true);
}

$('#bDeck').addEventListener('click',()=>{
  if(isOnline()&&!G.over&&!G.waiting){
    const prev=G.modal;G.modal=true;
    openModal(`<h3>オンライン対局を抜けますか？</h3><p>抜けると、この対局には戻れません。</p><div class="modal-actions"><button class="btn on" data-yes type="button">投了して抜ける</button><button class="btn" data-no type="button">続ける</button></div>`,root=>{
      root.querySelector('[data-yes]').addEventListener('click',()=>{resign();setTimeout(()=>{leaveOnline();openBuilder('online');},500);});
      root.querySelector('[data-no]').addEventListener('click',()=>{G.modal=prev;closeModal();render();});
    });return;
  }
  if(isOnline())leaveOnline();
  openBuilder();
});
$('#bResign').addEventListener('click',()=>{
  if(!isOnline()||G.over)return;const prev=G.modal;G.modal=true;
  openModal(`<h3>投了しますか？</h3><div class="modal-actions"><button class="btn on" data-yes type="button">投了する</button><button class="btn" data-no type="button">続ける</button></div>`,root=>{
    root.querySelector('[data-yes]').addEventListener('click',()=>{G.modal=false;closeModal();resign();});
    root.querySelector('[data-no]').addEventListener('click',()=>{G.modal=prev;closeModal();render();});
  });
});
$('#bAgain').addEventListener('click',()=>{if(G&&!G.preview)newGame(myDeck);});
$('#bRules').addEventListener('click',showRules);
$('#bLib').addEventListener('click',showLibrary);
$('#chips').addEventListener('click',e=>{{const lb=e.target.closest('[data-lead]');if(lb&&!locked()&&G.leaderFrom){const[r,c]=lb.dataset.lead.split(',').map(Number);leaderPush(G.leaderFrom,r,c);render();return;}}{const nb=e.target.closest('[data-neon]');if(nb&&!locked()&&G.neonFrom){throwNeon(G.neonFrom,+nb.dataset.neon||2);return;}}if(e.target.closest('[data-barracks]')&&!locked())openBarracks();if(e.target.closest('[data-magic]')&&!locked())magicianUse();});
$('#oppHand').addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)showCard(b.dataset.key);});
$('#endBtn').addEventListener('click',()=>{if(!locked()&&!mustMove())endTurn();});
$('#pDraw').addEventListener('click',()=>showPile('draw'));
$('#pDisc').addEventListener('click',()=>showPile('discard'));
$('#hint').addEventListener('click',e=>{if(e.target.closest('[data-swarmdone]')&&!locked()){finishSwarm();return;}const fb=e.target.closest('[data-face]');if(fb&&!locked()&&G.sel){G.faceSel=fb.dataset.face;render();return;}const b=e.target.closest('[data-act]');if(!b||locked()||!G.sel)return;const a=b.dataset.act;G.breachAim=null;G.molAim=null;if(a==='ambush'){doAmbush(G.sel[0],G.sel[1]);return;}if(a==='charge'){chargeXbow(G.sel[0],G.sel[1],G.faceSel);return;}if(a==='move'){G.shootMode=false;render();return;}G.shootMode=G.shootMode===a?false:a;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&!G.modal&&G.pending&&G.pending.multi){finishSwarm();return;}if(e.key==='Escape'&&G&&!G.modal&&(G.pending||G.sel)){G.pending=null;G.sel=null;G.shootMode=false;render();}});
window.addEventListener('resize',()=>{if(G)layoutHand();});

buildBoard();
G=freshState([],[],true);G.log=[{t:'デッキを選ぶと対局が始まります',sep:true}];
render();
openBuilder(/^#r[A-Za-z0-9]{4}$/.test(location.hash)?'online':undefined);
})();
</script>
