<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七路将棋カードバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a kaya-wood 7x7 board lit like a night tea room; your hand of cards below, opponent above, log on the side. Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#131823; --panel:#1b2230; --panel-2:#232c3d; --line:#33405a;
  --fg:#ede4cf; --muted:#9ba6ba;
  --wood:#d8b06a; --wood-dk:#b88a45; --grid:#5a3a14; --koma:#f1d9a4; --koma-ink:#2a1b0c; --pro:#b4231a;
  --enh:#c9502f; --res:#c99a34; --mag:#6e62c9;
  --poison:#8cc66a; --seize:#9d7ae0; --smoke:#c3c8d2; --gold:#e1b24c; --danger:#e8603c;
  --beast-l:#8fa39a; --beast-r:#cbc2b8; --beast-head:#a6736b; --beast-body:#3e3345;
  --parch:#f2e7cc; --parch-ink:#2a2230;
  --f-disp:'Dela Gothic One','Hiragino Sans',sans-serif;
  --f-min:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  --bs:max(270px, min(calc(100vw - 56px), calc(100vh - 400px), 560px));
  --cw:124px; --ch:200px;
}
@supports (height:100svh){ :root{ --bs:max(270px, min(calc(100vw - 56px), calc(100svh - 400px), 560px)); } }
@media (min-width:1000px){
  :root{ --bs:max(320px, min(calc(100vw - 460px), calc(100vh - 340px), 600px)); }
  @supports (height:100svh){ :root{ --bs:max(320px, min(calc(100vw - 460px), calc(100svh - 340px), 600px)); } }
}
@media (max-width:700px){ :root{ --cw:108px; --ch:186px; } }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;min-height:100%;
  background-image:radial-gradient(ellipse at 50% -20%, #263049 0%, transparent 60%)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:var(--f-min);font-weight:800;font-size:22px;letter-spacing:.12em;color:var(--gold)}
.logo span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stage{display:grid;grid-template-columns:1fr;gap:16px;padding-block:12px 24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:1000px){ .stage{grid-template-columns:minmax(0,1fr) 300px;align-items:start} }
.play{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}

.strip{width:min(100%, 900px);display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.strip.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.who{font-weight:700;display:flex;align-items:center;gap:8px}
.who .mk{font-size:16px}
.stat{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg)}
.stat .en b{color:var(--gold)}
.turnno{margin-left:auto;font-size:12px;color:var(--muted)}

.board-wrap{position:relative;padding:22px 26px 10px 10px;border-radius:6px;background:linear-gradient(#5b3c1c,#3e2911);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.files,.ranks{position:absolute;display:flex;font-family:var(--f-min);font-weight:800;color:#f0d9a8;font-size:12px;pointer-events:none}
.files{left:10px;top:3px;width:var(--bs);justify-content:space-around}
.ranks{right:6px;top:22px;height:var(--bs);flex-direction:column;justify-content:space-around}
.board{position:relative;width:var(--bs);height:var(--bs);user-select:none;-webkit-user-select:none;background:var(--wood)}
.squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);border:2px solid var(--grid)}
.sq{position:relative;border:0;padding:0;cursor:pointer;background:var(--wood);box-shadow:inset 0 0 0 .5px var(--grid)}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none}
.sq.last::before{inset:0;background:rgba(201,80,47,.22)}
.sq.sel::before{inset:0;box-shadow:inset 0 0 0 3px var(--enh);background:rgba(201,80,47,.25)}
.sq.mv::after{width:24%;height:24%;left:38%;top:38%;border-radius:50%;background:rgba(42,27,12,.45)}
.sq.hmv::after{width:24%;height:24%;left:38%;top:38%;border-radius:50%;background:transparent;box-shadow:0 0 0 3px rgba(42,27,12,.55)}
.sq.cap::after{inset:6%;border-radius:4px;box-shadow:inset 0 0 0 4px rgba(201,80,47,.9)}
.sq.tgt::before{inset:0;background:var(--tgtc);opacity:.42;animation:pulse 1.2s ease-in-out infinite}
.sq.tgt:hover::before{opacity:.7}
.sq.chk::before{inset:0;background:radial-gradient(circle, rgba(232,96,60,.85), rgba(232,96,60,0) 72%)}
.sq.area::before{inset:0;background:var(--tgtc);opacity:.6;box-shadow:inset 0 0 0 2px #fff}
.sq.shot::after{inset:10%;border-radius:50%;border:3px solid var(--danger);background:radial-gradient(circle,transparent 30%,rgba(232,96,60,.3) 32%);box-shadow:0 0 0 1px #000 inset}
.sq .cd{position:absolute;right:3%;top:2%;font-family:var(--f-disp);font-size:calc(var(--bs) / 34);color:#7a1a0c;pointer-events:none;text-shadow:0 0 3px #fff}
.hint .hb{margin-left:8px;border:1px solid var(--danger);background:transparent;color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.hint .hb.on{background:var(--danger);color:#fff}
.hint .facepick{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:12.5px}
.hint .hb.face{margin-left:0;border-color:var(--gold)}
.hint .hb.face.on{background:var(--gold);color:#241a06}
@keyframes pulse{50%{opacity:.18}}

.pieces,.fx{position:absolute;inset:2px;pointer-events:none}
.pc{position:absolute;width:calc(100%/7);height:calc(100%/7);display:grid;place-items:center;transition:left .28s ease, top .28s ease, opacity .3s, transform .3s}
.pc .kw{width:78%;height:86%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));display:grid}
.pc .k{clip-path:polygon(50% 0,86% 16%,100% 100%,0 100%,14% 16%);background:linear-gradient(170deg,#f7e4b6,var(--koma) 55%,#d6b679);
  display:grid;place-items:center;padding-top:14%;font-family:var(--f-min);font-weight:800;color:var(--koma-ink);font-size:calc(var(--bs) / 7 * .44);line-height:1}
.pc.g .kw{transform:rotate(180deg)}
.pc.pro .k{color:var(--pro)}
.pc.beast .k{position:relative;color:transparent;background:linear-gradient(90deg,var(--beast-l) 50%,var(--beast-r) 50%)}
.pc.beast .k::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--beast-body);clip-path:polygon(0 45%,28% 0,72% 0,100% 45%,100% 100%,0 100%)}
.pc.beast .k::before{content:"";position:absolute;z-index:1;width:46%;aspect-ratio:1;left:27%;top:30%;border-radius:50%;background:var(--beast-head)}
.pc.king .k{font-size:calc(var(--bs) / 7 * .48)}
.pc.hid .k{color:#55606f;background:linear-gradient(170deg,#c9ccd3,#a5aab5)}
.pc.mine-hid .kw{opacity:.72}
.pc.gone{opacity:0;transform:scale(.6)}
.pc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.badges{position:absolute;left:2%;right:2%;bottom:1%;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;z-index:2}
.bd{font-size:calc(var(--bs) / 52);min-width:calc(var(--bs) / 34);padding:0 2px;line-height:1.35;border-radius:3px;font-weight:700;text-align:center;color:#fff;background:var(--enh);font-variant-numeric:tabular-nums}
.bd.res{background:#9a7420}.bd.mag{background:var(--mag)}.bd.poi{background:var(--poison);color:#14260a}.bd.dng{background:var(--danger)}
.ring{position:absolute;inset:4%;border-radius:50%;border:2px dashed rgba(110,98,201,.85);pointer-events:none}

.fxt{position:absolute;width:calc(100%/7);text-align:center;font-weight:700;font-size:clamp(11px, calc(var(--bs) / 36), 15px);white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 2px #000;animation:rise 1.1s ease-out forwards;z-index:5}
.fxt.enh{color:#ffb08f}.fxt.poi{color:var(--poison)}.fxt.mag{color:#c8bdff}.fxt.kill{color:var(--danger)}.fxt.res{color:var(--gold)}
@keyframes rise{from{transform:translateY(10%);opacity:1}to{transform:translateY(-120%);opacity:0}}

.hint{min-height:24px;font-size:13px;color:var(--muted);text-align:center;max-width:640px;text-wrap:balance}
.hint b{color:var(--fg)}

.me{width:min(100%, 900px);display:grid;grid-template-columns:130px minmax(0,1fr) 150px;grid-template-areas:"left hand right";gap:12px;align-items:end}
@media (max-width:700px){ .me{grid-template-columns:1fr auto;grid-template-areas:"left right" "hand hand"} }
.me-left{grid-area:left;display:flex;flex-direction:column;align-items:center;gap:6px}
.me-right{grid-area:right;display:flex;flex-direction:column;gap:8px}
@media (max-width:700px){ .me-left{flex-direction:row;justify-self:start} .me-right{flex-direction:row;align-items:center} }
.orb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;color:#2a1c04;
  background:radial-gradient(circle at 35% 30%, #fff0bf 0%, var(--gold) 50%, #7a5612 100%);box-shadow:0 0 18px rgba(225,178,76,.4), inset 0 -4px 8px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.orb.off{filter:grayscale(.8) brightness(.6);box-shadow:none}
.orb-note{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.chips{display:flex;flex-direction:column;gap:4px;align-items:center}
@media (max-width:700px){.chips{align-items:flex-start}}
.chip{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--enh);white-space:nowrap}
.chip.on{background:var(--enh);color:#fff;font-weight:700}
.chip.off{border-color:var(--line);color:var(--muted)}
.piles{display:flex;gap:6px}
.pile{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;cursor:pointer;font-size:11px;line-height:1.25;text-align:center}
.pile b{display:block;font-family:var(--f-disp);font-weight:400;font-size:16px}
.pile:hover{border-color:var(--gold)}
.endbtn{border:0;border-radius:8px;padding:12px 10px;background:linear-gradient(#e9c16a,#b3862b);color:#241a06;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #6f5114}
.endbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #6f5114}
.endbtn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}

.hand{grid-area:hand;display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--ch) + 18px);padding-top:18px;min-width:0}
@media (max-width:700px){ .hand{justify-content:flex-start;overflow-x:auto;padding-bottom:6px} }
.empty-hand{color:var(--muted);font-size:13px;align-self:center}

.card{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:9px;border:0;padding:0;cursor:pointer;background:var(--frame);
  box-shadow:0 6px 14px rgba(0,0,0,.45);transition:transform .15s ease, filter .15s;text-align:center;display:flex;flex-direction:column}
.card.enh{--frame:var(--enh)} .card.awk{--frame:#a3326b} .card.res{--frame:var(--res)} .card.mag{--frame:var(--mag)}
.card .cost{position:absolute;left:-7px;top:-7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;z-index:2;font-family:var(--f-disp);font-size:15px;color:#2a1c04;
  background:radial-gradient(circle at 35% 30%, #fff0bf, var(--gold) 55%, #7a5612);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.card .cost.down{background:radial-gradient(circle at 35% 30%, #e6ffd2, #7fd05a 55%, #2f6a18)}
.card .cname{font-family:var(--f-min);font-weight:800;font-size:13px;color:#fff6e4;padding:8px 6px 2px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card .art{margin:2px 8px 0;height:19%;border-radius:4px;display:grid;place-items:center;font-family:var(--f-min);font-weight:800;font-size:calc(var(--ch) * .13);
  color:var(--frame);background:radial-gradient(circle at 50% 40%, #fff7e3, #dccba4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.card .ctype{font-size:9px;letter-spacing:.15em;color:#fff6e4;opacity:.9;padding:2px 0}
.card .ctext{flex:1;margin:0 7px 8px;border-radius:4px;background:var(--parch);color:var(--parch-ink);font-size:9.6px;line-height:1.42;padding:4px 5px;text-align:left;overflow:hidden}
@media (max-width:700px){ .card .ctext{font-size:9px;padding:3px 4px} .card .cname{font-size:12px} }
.hand .card:hover{transform:translateY(-12px);z-index:5}
.card.pending{transform:translateY(-18px);z-index:6;box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,0,0,.5)}
.card.dim{filter:saturate(.35) brightness(.7);cursor:not-allowed}
.hand .card.dim:hover{transform:translateY(-4px)}
.card.static{cursor:default}
.opp-hand{width:min(100%, 900px);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.oh-label{font-size:12px;color:var(--muted);margin-right:2px}
.oh-empty{font-size:12px;color:var(--muted)}
.ochip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;padding:3px 10px 3px 4px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;background:var(--enh)}
.ochip.res{background:#9a7420}.ochip.awk{background:#a3326b}.ochip.mag{background:var(--mag)}
.ochip:hover{filter:brightness(1.15)}
.ochip .oc{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:400;font-size:11px;color:#2a1c04;background:radial-gradient(circle at 35% 30%, #fff0bf, var(--gold) 55%, #7a5612)}
.ochip .oheld{font-size:10px;background:var(--danger);border-radius:6px;padding:0 5px}
.libitem{display:flex;flex-direction:column;align-items:center;gap:4px}
.libcount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;font-size:12.5px}
.glossary div{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.glossary b{display:block;color:var(--gold);margin-bottom:2px}
.card .heldtag{position:absolute;right:-6px;top:-8px;z-index:3;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.card.held{box-shadow:0 0 0 2px var(--danger),0 6px 14px rgba(0,0,0,.45)}

.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side h2{font-family:var(--f-min);font-weight:800;font-size:15px;margin:0;letter-spacing:.05em}
.notice{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px 10px;font-size:12.5px}
.notice b{color:var(--gold);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:min(50vh,460px);overflow:auto;font-size:12.5px}
.log li{padding:5px 10px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log li.sep{color:var(--gold);font-weight:700;background:var(--panel-2)}
.log li.g{color:#c6cde0}
.legend{font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,10,16,.78);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.modal.wide{max-width:1040px}
.modal h3{font-family:var(--f-min);font-weight:800;font-size:22px;margin:0 0 6px;text-wrap:balance}
.modal p{margin:0 0 12px;color:var(--muted)}
.grid-cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-min);font-weight:800;font-size:38px;color:var(--gold);text-align:center;margin:6px 0 10px}
.rules{display:grid;gap:12px;font-size:13.5px}
.rules h4{font-family:var(--f-min);font-weight:800;font-size:15px;margin:0 0 2px;color:var(--gold)}
.rules p{margin:0;color:var(--fg);max-width:68ch}

/* deck builder */
.deckbar{position:sticky;top:-22px;z-index:3;background:var(--panel);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px;display:grid;gap:8px}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:640px){ .slots{grid-template-columns:repeat(4,minmax(0,1fr))} }
.slot{min-height:40px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:2px 4px;text-align:center;line-height:1.2}
.slot.f{border-style:solid;color:#fff;font-weight:700}
.slot.f.enh{background:var(--enh);border-color:var(--enh)} .slot.f.res{background:#9a7420;border-color:#9a7420} .slot.f.mag{background:var(--mag);border-color:var(--mag)}
.slot.f:hover{filter:brightness(1.15)}
.slot .c{font-family:var(--f-disp);font-weight:400;font-size:11px;opacity:.85}
.board-wrap.flip .squares,.board-wrap.flip .pieces{transform:rotate(180deg)}
.board-wrap.flip .badges,.board-wrap.flip .sq .cd{transform:rotate(180deg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--panel-2);padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;color:var(--muted)}
.tab.on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:700}
.onl{display:grid;gap:10px;font-size:13px}
.onl p{margin:0}
.onl .ok{color:#9fd47f}
.onl .err{color:var(--danger);font-weight:700}
.cfgbox{display:grid;gap:6px}
.cfgbox textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.onrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.onrow input{width:7em;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:700 15px var(--f-disp);letter-spacing:.2em;text-transform:uppercase}
.onrow .or{color:var(--muted);font-size:12px}
.onstatus{min-height:1em}
.roomcode{font-family:var(--f-disp);font-size:40px;letter-spacing:.25em;color:var(--gold);line-height:1.1}
.linkbtn{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
details.guide{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px 12px;margin-top:10px}
details.guide summary{cursor:pointer;font-family:var(--f-min);font-weight:800;font-size:15px;color:var(--gold)}
details.guide .rules{margin-top:10px}
details.guide .glossary{margin-top:10px}

/* ---------- movement ---------- */
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]],DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];
function rawMoves(r,c){
  const p=G.board[r][c];

  if(p.b.rewind&&p.b.rewind.until>G.T){for(const m of genMoves(r,c,-fw(p.c)))if(!m.cap&&!out.some(x=>x.r===m.r&&x.c===m.c))out.push(m);}

  return out;
}
function genMoves(r,c,f){
  const b=G.board,p=b[r][c],out=[];
  const step=(dr,dc)=>{const rr=r+dr,cc=c+dc;if(!inB(rr,cc))return;const t=b[rr][cc];if(t&&t.c===p.c)return;const iv=!!t&&invis(t);out.push({r:rr,c:cc,cap:!!t&&!iv,path:[[rr,cc]],bump:iv?[rr,cc]:null});};

  const GOLD=[[f,0],[f,-1],[f,1],[0,-1],[0,1],[-f,0]];
  const t=p.t;
  if(t==='K')[...ORTH,...DIAG].forEach(([a,d])=>step(a,d));
  else if(t==='G'||(p.pro&&'PLNS'.includes(t)))GOLD.forEach(([a,d])=>step(a,d));

}
function pitField(p){return G.fields.find(f=>f.type==='pit'&&f.carrier===p.id);}

const inOwnPitArea=(p,r,c)=>has(pitCellsOf(p),r,c);
function pitKingMoves(r,c){const p=G.board[r][c],out=[];for(const[a,d]of[...ORTH,...DIAG]){const rr=r+a,cc=c+d;if(!inB(rr,cc))continue;if(!inOwnPitArea(p,rr,cc))continue;const t=G.board[rr][cc];if(t&&t.c===p.c)continue;const iv=!!t&&invis(t);out.push({r:rr,c:cc,cap:!!t&&!iv,path:[[rr,cc]],bump:iv?[rr,cc]:null,pitk:true});}

function movesFor(r,c){
  {const p0=G.board[r][c];if(p0&&p0.b.grand&&p0.b.grand.jumpT===G.T&&G.turn===p0.c)return [];if(p0&&p0.b.mercy&&p0.b.mercy.rev)return [];if(p0&&p0.b.mercy){return movesFor1(r,c).filter(m=>!m.cap);}}

function died(p,r,c,cause,killer,by){

    case 'poop':{if(P.lethal){lethalTrigger(P,'うんち');break;}if(isWeak(P)){weakTrigger(P,'うんち');break;}P.poop={by:me,at:G.T+2};fx(t[0],t[1],'うんち','kill');note=at();break;}
    case 'peek':{pl.peek={until:G.T+1};const nx=pl.draw[pl.draw.length-1];note=nx?`次に引くのは「${CARDS[nx.key].name}」`:'山札が空（次はシャッフル）';break;}
    case 'roar':{const k=findKing(me);let n=0;if(k)for(let rr=k[0]-2;rr<=k[0]+2;rr++)for(let cc=k[1]-2;cc<=k[1]+2;cc++){if(!inB(rr,cc))continue;const q=b[rr][cc];if(q&&q!==k[2]){stunFor(q,2);fx(rr,cc,'スタン2','mag');n++;}}G.main=false;G.forceEnd=true;note=`${n}体をスタン。ターン終了`;if(!SIM&&!isBotC(me))setTimeout(()=>{if(G.forceEnd&&G.turn===me&&!G.over)endTurn();},800);break;}
    case 'mist':{const cells=areaCells('mist',me,t[0],t[1]);let n=0;for(const[rr,cc]of cells){const q=b[rr][cc];if(q&&q.c!==me&&!immBlock(q)&&!wardBlock(q)){if(q.lethal){lethalTrigger(q,'熟睡');n++;continue;}if(isWeak(q)){weakTrigger(q,'熟睡');n++;continue;}q.b.lock={until:G.T+2};fx(rr,cc,'熟睡','mag');n++;}}note=`${n}体を熟睡させた`;break;}

    case 'here':P.bounty={by:me,from:G.T+2,until:G.T+3,here:true};fx(t[0],t[1],'ここだよ','res');note=at();break;
    case 'bounty':P.bounty={by:me,from:G.T+2,until:G.T+3};fx(t[0],t[1],'懸賞','res');note=at();break;
    case 'swarm':break;

    case 'infect':{note=at();let n=0;for(let rr=t[0]-1;rr<=t[0]+1;rr++)for(let cc=t[1]-1;cc<=t[1]+1;cc++){if(!inB(rr,cc)||(rr===t[0]&&cc===t[1]))continue;const q=b[rr][cc];if(q&&q.c!==me&&!isProtected(me,rr,cc)){poisonPiece(rr,cc,'感染');n++;}}note+=`の周り${n}体に感染`;break;}
    case 'erode':note=at();stunFor(P,1);fx(t[0],t[1],'スタン','mag');break;
    case 'magician':note=at();P.b.magician=true;fx(t[0],t[1],'魔術師','mag');break;
    case 'roll':{const cells=areaCells('roll',me,t[0],t[1]);G.fields.push({type:'roll',owner:me,cells,at:G.T+2,until:G.T+3});note=`${nota(t[0],t[1])}の前方を予告`;break;}
    case 'breaker':{const o=opp(me);G.campManual[o]=Math.max(0,Math.min(G.campManual[o],campLevel(o))-1);note=`${who(o)}の敵陣の魔法防御が残り${campLevel(o)}段`;break;}
    case 'seize':case 'swamp':case 'smoke':{
      const cells=areaCells(card.key,me,t[0],t[1]);G.fields.push({type:card.key,owner:me,cells,until:G.T+(card.key==='smoke'?8:4)});note=`${nota(t[0],t[1])}を中心に`;if(card.key==='seize')seizeLethal(cells);break;}
    case 'thunder':{
      const[a,z]=t;const lines=rectLines(a,z).map(l=>l.filter(([r,c])=>!isProtected(me,r,c)));

      const stages=[{at:G.T+4,cells:[...lines[0],...lines[1]]},{at:G.T+6,cells:[...lines[2]]},{at:G.T+8,cells:[...lines[3],...lines[4]]}];
      G.fields.push({type:'thunder',owner:me,cells,stages,until:G.T+9});note=`${nota(...a)}側から、2ターン後に着弾開始`;break;}
    case 'dispel':{const cells=areaCells('dispel',me,t[0],t[1]);let n=0;
      for(const[r,c]of cells){const q=b[r][c];if(q&&q.c===me&&(q.poison||q.lethal||q.weak||q.b.lock||q.burn||q.petri||q.bounty||q.poop)){q.poison=null;delete q.lethal;delete q.weak;delete q.b.lock;delete q.burn;delete q.petri;delete q.bounty;delete q.poop;fx(r,c,'解呪','mag');n++;}}
      for(const f of G.fields)if((f.type==='seize'||f.type==='swamp')&&f.owner!==me){const before=f.cells.length;f.cells=f.cells.filter(x=>!has(cells,x[0],x[1]));n+=before-f.cells.length;}
      note=`${nota(t[0],t[1])}周辺（${n}件を解除）`;break;}
    case 'warp':{const[a,z]=t;const q=b[a[0]][a[1]];b[z[0]][z[1]]=q;b[a[0]][a[1]]=null;if(canPromote(q)&&zone(q.c,z[0]))q.pro=true;q.b.lock={until:G.T+2,warp:true};if(q.b.xbow)q.b.xbow.ch=null;if(q.b.grand)q.b.grand.ch=null;if(q.b.op)q.b.op.ready=Math.max(q.b.op.ready,G.T+4);if(q.b.snake)q.b.snake.movedT=G.T;fx(z[0],z[1],'転移','mag');
      note=`${isHidden(q,z[0],z[1])?'？':pname(q)} ${nota(...a)}→${nota(...z)}`;checkBurn(z[0],z[1]);snakeCheck(z[0],z[1]);break;}
  }

  log(`${who(me)}${opts.virtual?'の兵舎が':opts.swarm?'の多勢に無勢で':opts.auto?'の魔術師が':''}「${d.name}」${note&&!hiddenNote?'→ '+note:''}`,me);

  if(card.key==='amazon'){const opts=shuffle(amazonKeys(me)).slice(0,3);if(opts.length){if(!SIM&&!isBotC(me))openAmazon(opts);else amazonGive(me,amazonBotPick(opts,me));}}
  asnCheck();
  if(card.key==='reserve'){
    const cands=pl.hand.filter(c=>!c.held);
    if(cands.length){if(me===ME&&!SIM)openReserve(cands);
      else{const sc=c=>CARDS[c.key].cost+(CARDS[c.key].cost>pl.energy?1:0)-(c.zero?1:0)+Math.random()*0.2;[...cands].sort((a,b)=>sc(b)-sc(a)).slice(0,2).forEach(c=>c.held=true);if(!SIM)log(`${who(me)}は手札を${Math.min(2,cands.length)}枚保留にした`,me);}}
  }
  if(card.key==='search'){
    const pickS=()=>{const L=[...pl.draw].filter(c=>c.key!=='search');const aff=L.filter(c=>CARDS[c.key].cost<=pl.energy);const pool=aff.length?aff:L;return pool.sort((a,b)=>CARDS[b.key].cost-CARDS[a.key].cost||Math.random()-0.5)[0];};
    if(me!==ME){const best=pickS();if(best){pl.draw=pl.draw.filter(x=>x!==best);pl.hand.push(best);if(!SIM)log(`${who(me)}は山札からカードを1枚手札に加えた`,me);}}
    else if(!SIM)openSearch();
    else{const best=pickS();if(best){pl.draw=pl.draw.filter(x=>x!==best);pl.hand.push(best);}}
  }
  render();
}

/* ---------- input ---------- */
const SWARM_KEYS=['ward','rewind','bomb','plunder','insure'];
function swarmKeys(col,except){const pl=G.players[col];const ks=new Set([...pl.draw,...pl.hand,...pl.discard,...(pl.opener?[pl.opener]:[])].filter(c=>!c.fetched&&(!except||c.uid!==except.uid)).map(c=>c.key));return SWARM_KEYS.filter(k=>ks.has(k)&&validTargets(k,null,col).length);}
function fixateKeys(col,except){if(0)return;const pl=G.players[col];const ks=new Set([...pl.draw,...pl.hand,...pl.discard,...(pl.opener?[pl.opener]:[])].filter(c=>!c.zero&&!c.fetched&&(!except||c.uid!==except.uid)).map(c=>c.key));return [...ks].filter(k=>CARDS[k].cost===1&&k!=='search');}
function setFixate(col,key){G.players[col].fixate={key,next:G.T+2};log(`固定化：${who(col)}は2ターンに1回「${CARDS[key].name}」（コスト0）を手札に加える`,col);}
function openFixate(card){
  const keys=fixateKeys(ME,card);G.modal=true;
  openModal(`<h3>固定化：毎回もらうカードを選ぶ</h3><p>デッキに入っている1コストのカードから選びます。2ターンに1回、そのコピーがコスト0で手札に入ります（使うと消えます。使わずにターンを終えても消えます）。</p>
    <div class="grid-cards">${keys.map((k,i)=>cardHTML(k,-(i+1),'',ME)).join('')}</div>`,root=>{
    root.querySelectorAll('.grid-cards .card').forEach(el=>el.addEventListener('click',()=>{const k=keys[-(+el.dataset.uid)-1];G.modal=false;closeModal();setFixate(ME,k);render();}));
  });
}
function swarmApply(col,key,targets){
  const vc={uid:-999,key};
  for(const t of targets){const q=G.board[t[0]][t[1]];if(q&&q.c===col&&has(validTargets(key,null,col),t[0],t[1]))playCard(vc,t,{free:true,auto:true,swarm:true});if(G.over)return;}
}
function swarmAuto(col){
  const op=opp(col);let best=null;
  for(const k of swarmKeys(col)){
    const sc=([r,c])=>{const p=G.board[r][c];const att=attackedBy(r,c,op);
      if(k==='ward')return (p.poison||p.burn||p.petri?4:0)+(att?1:0)+(p.t==='K'?2:0);
      if(k==='insure')return att?2+val(p)*0.1:0;
      if(k==='plunder')return (col==='g'?r:6-r)*0.4+(p.t==='K'?-5:0);
      if(k==='bomb'){let v=0;for(const[r2,c2,q]of piecesOf(op))if(cheb(r,c,r2,c2)<=1)v+=q.t==='K'?20:val(q);for(const[r2,c2,q]of piecesOf(col))if(q!==p&&cheb(r,c,r2,c2)<=1)v-=q.t==='K'?40:val(q);return v-val(p);}
      return 0.3;};
    const list=validTargets(k,null,col).map(t=>[t,sc(t)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const tot=list.reduce((a,x)=>a+x[1],0);
    if(list.length&&(!best||tot>best.tot))best={k,ts:list.map(x=>x[0]),tot};
  }
  if(best)swarmApply(col,best.k,best.ts);
}
function openSwarm(mcard){
  const keys=swarmKeys(ME,mcard);G.modal=true;
  openModal(`<h3>多勢に無勢：付ける駒強化を選ぶ</h3><p>デッキに入っている1コストの駒強化から1つ選びます。そのあと、付ける駒を最大3つ選んでください（カードそのものは減りません）。</p>
    <div class="grid-cards">${keys.map((k,i)=>cardHTML(k,-(i+1),'',ME)).join('')}</div>`,root=>{
    root.querySelectorAll('.grid-cards .card').forEach(el=>el.addEventListener('click',()=>{const k=keys[-(+el.dataset.uid)-1];G.modal=false;closeModal();G.pending={uid:-999,key:k,first:null,aim:null,multi:true,picked:[],vcard:{uid:-999,key:k}};G.sel=null;G.shootMode=false;render();}));
  });
}
function finishSwarm(){
  if(!G.pending||!G.pending.multi)return;const P=G.pending;G.pending=null;
  if(P.summon){if(!P.picked.length){render();return;}playCard(P.card,P.picked,P.magic?{free:true,auto:true}:undefined);if(P.magic)magicianFinish(ME);render();return;}
  swarmApply(ME,P.key,P.picked);render();
}
const isBotC=c=>typeof isBotSide==='function'?isBotSide(c):(G.mode!=='online'&&c!==ME);
const AWAKE_DECK=['poop','poop','here','here','peek','roar','mist','lifeup'];
function awakeSeen(){if(G&&(G.players.s.awake||G.players.g.awake))return true;try{return localStorage.getItem('shogi7_awake')==='1';}catch(e){return false;}}

function scoreMove(fr,fc,m,me){

async function botTurn(){
  if(botLevel>1)return botTurnSearch();
  const myG=G;if(!G||G.over||G.turn!=='g')return;
  G.busy=true;render();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stale=()=>G!==myG||G.over;
  if(barracksReady('g')){for(const c of shuffle(barracksCards('g'))){const a=botCard(false,c);if(a){await wait(600);if(stale())return;a();break;}}if(stale())return;}
  for(let i=0;i<2;i++){await wait(650);if(stale())return;const a=botCard(false);if(!a)break;a();if(stale())return;if(G.forceEnd)break;}
  for(const[r,c,p]of piecesOf('g')){if(canXbow(p)){const ts=xbowTargets(r,c);if(ts.length){const[tr,tc]=ts.sort((a,z)=>seenVal(G.board[z[0]][z[1]],...z)-seenVal(G.board[a[0]][a[1]],...a))[0];await wait(600);if(stale())return;fireXbow(r,c,tr,tc);if(stale())return;}}}
  for(let i=0;i<5;i++){
    await wait(600);if(stale())return;
    if(G.forceEnd)break;
    if(G.main){
      const mv=bestMove('g',false),sh=bestShot('g');
      let ar=null,cg=null;
      for(const[r,c,p]of piecesOf('g')){
        if(canArrow(p))for(const[tr,tc]of arrowTargets(r,c)){const q=G.board[tr][tc];if(ward(q))continue;const v=q.t==='K'?8:seenVal(q,tr,tc)*0.6;if(!ar||v>ar.v)ar={fr:r,fc:c,tr,tc,v};}
        if(canCharge(p)){for(const f of['f','l','r']){const v=xbowTargets(r,c,f).reduce((m,[tr,tc])=>Math.max(m,G.board[tr][tc].t==='K'?10:seenVal(G.board[tr][tc],tr,tc)),0);if(v>=3&&(!cg||v>cg.v))cg={r,c,v,f};}}
      }
      const mvS=mv?mv.s:-99;
      const gm=greedyMain('g');
      if(gm&&['marshal','molotov','outlaw','chain','taser'].includes(gm.type)){simApply(gm);}
      else if(sh&&sh.v>=3&&sh.v>=mvS){shoot(sh.fr,sh.fc,sh.tr,sh.tc);}
      else if(ar&&ar.v>=2&&ar.v>=mvS){fireArrow(ar.fr,ar.fc,ar.tr,ar.tc);}
      else if(cg&&mvS<1.5&&Math.random()<0.8){chargeXbow(cg.r,cg.c,cg.f);}
      else if(mv)doMove(mv.fr,mv.fc,mv.m.r,mv.m.c);
      else break;
    }else{const h=bestMove('g',true);if(!h||h.s<0.2)break;doMove(h.fr,h.fc,h.m.r,h.m.c);}
    if(stale())return;
    if(G.forceEnd)break;
  }
  await wait(450);if(stale())return;
  const a=botCard(true);if(a){a();await wait(500);if(stale())return;}
  if(!G.over){greedyBreach(G.turn,null);greedyArrow(G.turn,null);greedyInterro(G.turn,null);greedyTaser(G.turn,null);greedyHunter(G.turn,null);botAmbush(G.turn);}
  G.busy=false;endTurn();
}

/* ---------- search AI (levels 2 and 3) ---------- */
function targetOk(key,t,col){
  const d=CARDS[key];
  if(d.target==='none')return t==null;
  if(!t)return false;
  if(key==='summon'&&Array.isArray(t[0])){const v=validTargets(key,null,col);return t.length>=1&&t.length<=2&&t.every(x=>has(v,x[0],x[1]));}
  if(d.target==='warp'||d.target==='thunder'||d.target==='dirShot'||d.target==='hunterPath'){if(!has(validTargets(key,null,col),t[0][0],t[0][1]))return false;return has(validTargets(key,t[0],col),t[1][0],t[1][1]);}
  return has(validTargets(key,null,col),t[0],t[1]);
}
function simApply(a){
  const me=G.turn;
  switch(a.type){
    case 'card':{const card=G.players[me].hand.find(x=>x.uid===a.uid);if(!card||!canPlay(card,me)||!targetOk(card.key,a.t,me))return false;playCard(card,a.t);return true;}
    case 'barracks':{if(!barracksReady(me))return false;const vc=barracksCards(me).find(x=>x.key===a.key);if(!vc||!targetOk(a.key,a.t,me))return false;playCard(vc,a.t,{free:true,virtual:true});return true;}
    case 'move':{if(!movesFor(a.fr,a.fc).some(m=>m.r===a.tr&&m.c===a.tc))return false;doMove(a.fr,a.fc,a.tr,a.tc,a.face);return true;}
    case 'shoot':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canShoot(p)||!has(shootTargets(a.fr,a.fc),a.tr,a.tc))return false;shoot(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'akimbo':return doAkimbo(a.id,a.picks);
    case 'curse':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canCurse(p)||!has(curseCenters(a.fr,a.fc),a.tr,a.tc))return false;fireCurse(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'knife':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canKnife(p)||!has(knifeTargets(a.fr,a.fc),a.tr,a.tc))return false;fireKnife(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'lsend':return leaderSend(a.id);
    case 'gcharge':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canGCharge(p))return false;chargeGrand(a.r,a.c);return true;}
    case 'marshal':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canMarshal(p)||!has(marshalTargets(a.fr,a.fc),a.tr,a.tc))return false;fireMarshal(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'arrow':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canArrow(p)||!has(arrowTargets(a.fr,a.fc),a.tr,a.tc))return false;fireArrow(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'charge':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canCharge(p))return false;chargeXbow(a.r,a.c,a.face);return true;}
    case 'taser':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canTaser(p))return false;fireTaser(a.r,a.c);return true;}
    case 'interro':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canInterro(p)||!has(interroTargets(a.r,a.c),a.tr,a.tc))return false;fireInterro(a.r,a.c,a.tr,a.tc);return true;}
    case 'chain':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canChain(p)||!has(chainTargets(a.fr,a.fc),a.tr,a.tc))return false;fireChain(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'molotov':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canMolotov(p))return false;const o=molotovOpts(a.r,a.c)[a.oi];if(!o)return false;fireMolotov(a.r,a.c,o.cells);return true;}
    case 'outlaw':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canOutlaw(p)||!has(outlawTargets(a.fr,a.fc),a.tr,a.tc))return false;fireOutlaw(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'hunter2':{return aimHunter2(me,a.dd);}
    case 'breach':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canBreach(p)||!breachAreas(a.r,a.c)[a.ai])return false;fireBreach(a.r,a.c,a.ai);return true;}
    case 'xbow':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canXbow(p)||!has(xbowTargets(a.fr,a.fc),a.tr,a.tc))return false;fireXbow(a.fr,a.fc,a.tr,a.tc);return true;}
  }
  return false;
}
function greedyFree(me,rec){
  for(const[r,c,p]of piecesOf(me)){if(G.over)return;if(!canXbow(p))continue;const ts=xbowTargets(r,c);if(!ts.length)continue;
    const[tr,tc]=ts[0];const q=G.board[tr][tc];if(!q)continue;const a={type:'xbow',fr:r,fc:c,tr,tc};if(simApply(a)&&rec)rec.push(a);}
}
function greedyFreeShots(me,rec){
  for(const[r,c,p]of piecesOf(me)){if(G.over)return;if(!afree(p))continue;let a=null,bv=0.5;
    const tv=q=>q.t==='K'?20:val(q);
    if(p.b.op&&canShoot(p))for(const[tr,tc]of shootTargets(r,c)){const v=tv(G.board[tr][tc])*1.2;if(v>bv){bv=v;a={type:'shoot',fr:r,fc:c,tr,tc};}}

function runPlan(base,plan,real,deep){

      if(!G.over&&G.main&&m&&m!=='auto'){const g3=greedyMain('g');if(g3&&simApply(g3))rec.push(g3);}

    if(!G.over)oppGreedyTurn();
    if(deep){if(!G.over)oppGreedyTurn();if(!G.over)oppGreedyTurn();}

async function searchPlan(level,budget){
  const real=G,deadline=performance.now()+budget*BUDGET_SCALE;
  const base=maskedClone(real);
  let lastYield=performance.now(),lastShow=0;
  const timeUp=()=>performance.now()>=deadline;
  const tick=async()=>{
    if(performance.now()-lastYield<35)return;
    if(performance.now()-lastShow>400){real.thinkLeft=Math.max(0,Math.ceil((deadline-performance.now())/1000));render();lastShow=performance.now();}
    await new Promise(r=>setTimeout(r,0));lastYield=performance.now();
  };
  G=structuredClone(base);SIM=true;
  let mains,cardOpts;
  try{mains=genMains('g');cardOpts=genCardOpts('g');}finally{G=real;SIM=false;}
  const results=[];
  const tryPlan=async(plan)=>{if(timeUp()||G!==real)return null;const r=runPlan(base,plan,real);const e={plan,sum:r.score,n:1,rec:r.rec};results.push(e);await tick();return e;};
  const mean=e=>e.sum/e.n;
  // 1: every main action without cards
  for(const m of mains){if(!(await tryPlan({pre:[],main:m}))&&timeUp())break;}
  if(!mains.length)await tryPlan({pre:[],main:'auto'});
  const topMains=results.slice().sort((a,b)=>mean(b)-mean(a)).slice(0,level===3?8:4).map(e=>e.plan.main).filter(m=>m&&m!=='auto');
  // 2: one card before the main action
  for(const o of cardOpts){
    if(timeUp())break;
    await tryPlan({pre:[o],main:'auto'});
    for(const m of topMains){if(timeUp())break;await tryPlan({pre:[o],main:m});}
  }
  // 3: one card after the main action (level 3)
  if(level===3){
    for(const m of topMains.slice(0,5))for(const o of cardOpts){if(timeUp())break;await tryPlan({pre:[],main:m,post:[o]});}
  }
  // 4: two cards before the main action (level 3)
  if(level===3){
    const firsts=results.filter(e=>e.plan.pre.length===1).sort((a,b)=>mean(b)-mean(a)).slice(0,6).map(e=>e.plan.pre[0]);
    for(const o1 of firsts)for(const o2 of cardOpts){if(timeUp())break;if(o2.type==='card'&&o1.type==='card'&&o2.uid===o1.uid)continue;await tryPlan({pre:[o1,o2],main:'auto'});}
  }

  // 5: refine the best candidates with more samples (all remaining time if not looking deeper)
  const end5=deepOn?performance.now()+Math.max(0,deadline-performance.now())*0.3:Infinity;
  while(!timeUp()&&performance.now()<end5&&G===real&&results.length){
    const top=results.slice().sort((a,b)=>mean(b)-mean(a)).slice(0,level===3?8:5);
    for(const e of top){if(timeUp())break;const r=runPlan(base,e.plan,real);e.sum+=r.score;e.n++;await tick();}
    if(level===2&&top.every(e=>e.n>=4))break;

  // 6: look one more turn ahead (my next turn + their reply) for the best candidates
  let deepTop=[];
  if(deepOn&&results.length>1){
    deepTop=results.slice().sort((a,b)=>mean(b)-mean(a)).slice(0,level===3?20:10);
    for(const e of deepTop){e.dsum=0;e.dn=0;}
    while(!timeUp()&&G===real){
      for(const e of deepTop){if(timeUp())break;const r=runPlan(base,e.plan,real,true);e.dsum+=r.score;e.dn++;await tick();}
      if(level===2&&deepTop.every(e=>e.dn>=4))break;
    }
  }
  real.thinkLeft=null;
  if(!results.length)return null;
  results.sort((a,b)=>mean(b)-mean(a));

  if(dd.length>=2){const mn=Math.min(...dd.map(e=>e.dn));const ok=dd.filter(e=>e.dn>=mn);ok.sort((a,b)=>b.dsum/b.dn-a.dsum/a.dn);

async function botTurnSearch(){

  const best=await searchPlan(botLevel,botLevel===3?10000:6000);
  if(stale())return;
  render();
  if(best)for(const a of best.rec){await wait(550);if(stale())return;simApply(a);if(stale())return;if(G.forceEnd)break;}
  if(G.main&&!G.forceEnd){const g2=greedyMain('g');if(g2){await wait(500);if(stale())return;simApply(g2);if(stale())return;}}
  await wait(450);if(stale())return;
  if(!G.over){greedyBreach(G.turn,null);greedyArrow(G.turn,null);greedyInterro(G.turn,null);greedyTaser(G.turn,null);greedyHunter(G.turn,null);botAmbush(G.turn);}
  G.busy=false;endTurn();
}

function layoutHand(){
  const hand=$('#hand'),cards=[...hand.querySelectorAll('.card')];if(!cards.length)return;
  if(window.matchMedia('(max-width:700px)').matches){cards.forEach((c,i)=>c.style.marginLeft=i?'6px':'0');return;}
  const cw=cards[0].offsetWidth,w=hand.clientWidth,n=cards.length;
  let gap=10;if(n>1&&n*cw+(n-1)*gap>w)gap=Math.max(-cw*0.6,(w-n*cw)/(n-1));

function mkDiag(H,W,P,cells,legend,pl){
  const m=new Map();for(const[r,c,k,l]of cells)if(r>=0&&r<H&&c>=0&&c<W)m.set(r*W+c,[k,l]);
  let g='';for(let r=0;r<H;r++)for(let c=0;c<W;c++){const isP=P&&P[0]===r&&P[1]===c;const v=m.get(r*W+c);g+=`<i class="${isP?'dp':v?'d'+v[0]:''}">${isP?(pl||'駒'):v&&v[1]!=null?v[1]:''}</i>`;}
  return `<div class="dgw"><div class="dgrid" style="grid-template-columns:repeat(${W},1fr)">${g}</div>${legend&&legend.length?`<div class="dleg">${legend.map(([k,t])=>`<span><i class="d${k}"></i>${t}</span>`).join('')}</div>`:''}</div>`;
}
const rays=(P,dirs,H,W,k)=>{const o=[];for(const[a,b]of dirs){let r=P[0]+a,c=P[1]+b;while(r>=0&&r<H&&c>=0&&c<W){o.push([r,c,k]);r+=a;c+=b;}}return o;};
const sq=(cr,cc,rad,k)=>{const o=[];for(let r=cr-rad;r<=cr+rad;r++)for(let c=cc-rad;c<=cc+rad;c++)o.push([r,c,k]);return o;};

const RULES_HTML=`<div class="rules">
    <div><h4>盤と駒</h4><p>7×7の盤で、あなたが先手、botが後手です。駒の動きは将棋と同じで、取った駒は使えません（持ち駒なし）。相手側の2段に入る・出る・その中で動くと自動で成ります。相手の王（自分の王将は玉）を倒したら勝ちです。</p></div>
    <div><h4>手番</h4><p>毎ターン、駒を必ず1手（メインの手）動かします。動かせる駒がない時だけ、動かさずに終了できます。狙撃はメインの手の代わりに行います。カードは駒を動かす前でも後でも、エネルギーがある限り使えます。</p></div>
    <div><h4>エネルギー</h4><p>最初の手番は2エネルギーと手札4枚で始まります。以降は毎ターンエネルギー+1、カードを3枚引きます。使わなかったエネルギーは持ち越せます（上限10）。使わなかった手札は、ターン終了時に3コスト以下のカードを1枚だけ次のターンへ持ち越せ（保持化で2枚になり、増えた1枚はコストに関係なく残せる。それ以外で4コスト以上を残すには「保留」のカード）、残りは捨て札へ行き（手札は最大6枚。引いて7枚以上になったら、6枚になるまで選んで捨てる）、山札が尽きると捨て札をシャッフルして山札に戻します。</p></div>
    <div><h4>デッキ</h4><p>対局前に12枚を選びます（同じカードは2枚まで。使うと対局から消えるカード（保持化・兵舎・固定化・補給線など）は1枚まで）。一番左の「初手」枠のカードは、必ず最初の手札に入ります。使ったカードは捨て札へ行き、山札が尽きたらシャッフルして戻ります。</p></div>
    <div><h4>魔法防御（段階式）</h4><p>各陣地（相手側2段）は魔法防御2段で始まります。15手目を過ぎると手前の段、25手目を過ぎると奥の段も自然にはがれます。「結界崩し」を使えば相手の陣の防御を早めに1段ずつはがせます。魔法障壁を持つ駒の周り1マスにも相手の魔法は届きません（解呪だけは例外）。</p></div>

    <div><h4>延焼と石化</h4><p>延焼した駒は、次の自分の番に自分の手（メインの手・疾風・アンカー移動）で動かさないと倒れます。石化した駒は、次の自分の番に動かさないと、その次の番は動けなくなります。転移で動かしても解除されません。固まりが解けた直後は、しばらく石化を受けません。</p></div>
    <div><h4>スタンと武器の準備</h4><p>スタンした駒は移動はできますが、駒を取ることも、狙撃・火矢・弩を撃つこともできません。取れない状態で、煙幕・暗雲に隠れた駒のマスへ動こうとすると、移動は無効になりターンが終わります。武器（毒刃・火矢・弩・蛇の目・バイパーズピット）は付けた番は働かず、次の自分の番から有効です。オペレーターは付けた番と次の番は撃てず、動いた・押された・移された時もその番と次の番は撃てません。撃つと4ターン撃てません。撃てる状態（覗き中）でスタンを受けると、スタン中は動けません。発砲にはエネルギー1が必要です。</p></div>
    <div><h4>弩の溜め</h4><p>弩はメインの手を使って溜めます。溜めた次の番か次の次の番に、手を使わず撃てます。撃たずに過ぎるか、その駒が動くと溜めは消えます。溜めている間は射線が赤く表示されます。</p></div>
    <div><h4>撃破ボーナスと中央</h4><p>相手の駒を倒すとエネルギーが入ります（歩0、香・桂・銀・金+1、飛・角・成った駒+2）。11手目からは、盤の中央（4四）に自分の駒を置いて番を迎えるとエネルギー+1。受け取ったら次に受け取れるのは2ターン後です。25手目からは、中央にいれば毎ターン受け取れます。</p></div>
    <div><h4>botの強さ</h4><p>デッキを組む画面で3段階から選べます。やさしいはすぐに指します。ふつうは約6秒、つよいは約10秒考え、カードと駒の動かし方の組み合わせを先読みして選びます。つよいは大会の上位5デッキ（物資争奪・補給ドロー・守り反撃・致死毒シーズ・保留大技）のどれかで挑んできます。</p></div>

  </div>`;

async function loadFirebase(){

  const bases=[`https://www.gstatic.com/firebasejs/${FB_VER}/`,`https://cdnjs.cloudflare.com/ajax/libs/firebase/${FB_VER}/`,`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/`];

function parseConfig(text){
  if(!text)return null;
  try{const j=JSON.parse(text);if(j&&j.databaseURL)return j;}catch(e){}
  const o={};const re=/(\w+)\s*:\s*["']([^"']+)["']/g;let m;while((m=re.exec(text)))o[m[1]]=m[2];
  return o.databaseURL&&o.apiKey?o:null;
}
function savedConfig(){
  if(FIREBASE_CONFIG)return FIREBASE_CONFIG;

  try{await loadFirebase();}catch(e){throw new Error('Firebaseの読み込みに失敗しました。');}
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
  const db=firebase.database(app);
  await new Promise((ok,ng)=>{const ref=db.ref('.info/connected');const t=setTimeout(()=>{ref.off();ng(new Error('Firebaseに接続できません。設定のdatabaseURLを確認してください（Claude上のプレビューでは通信できません）。'));},9000);

async function joinRoom(code,setStatus,name){

      root.querySelector('#slots').innerHTML=[...Array(DECK_N)].map((_,i)=>{const k=sorted[i];const op=i===0?' opener':'';
        if(!k)return `<div class="slot${op}">${i===0?'<span class="olabel">初手</span>':''}空き</div>`;
        return `<div class="slot f ${CARDS[k].cat}${op}">${i===0?'<span class="olabel">初手</span>':''}<button type="button" class="sname" data-rm="${i}" aria-label="${CARDS[k].name}を外す"><span class="c">${CARDS[k].cost}</span>${CARDS[k].name}</button>${i>0?`<button type="button" class="star" data-op="${i}" title="初手にする" aria-label="${CARDS[k].name}を初手にする">初手へ</button>`:''}</div>`;}).join('');
      root.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click',()=>{draft.splice(+el.dataset.rm,1);upd();}));
      root.querySelectorAll('[data-op]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.op;const k=draft.splice(i,1)[0];draft.unshift(k);upd();}));
      root.querySelectorAll('.pick').forEach(el=>{const n=draft.filter(x=>x===el.dataset.key).length;const b=el.querySelector('.n');b.hidden=!n;b.textContent='×'+n;el.querySelector('.card').classList.toggle('maxed',n>=maxCopies(el.dataset.key)||draft.length>=DECK_N);});
      const go=root.querySelector('#dbGo');go.disabled=draft.length!==DECK_N;go.textContent=draft.length===DECK_N?`この${DECK_N}枚で対局開始`:`あと${DECK_N-draft.length}枚選んでください`;
      root.querySelectorAll('[data-need8]').forEach(b=>b.disabled=draft.length!==DECK_N||busyOn||!savedConfig());
    };
    builderUpd=upd;
    bindJump(root);
    {const rb=root.querySelector('#dbRules');if(rb)rb.addEventListener('click',()=>openRulesOverlay(false));}
    {const g2=root.querySelector('#dbGo2');if(g2)g2.addEventListener('click',()=>{const g=root.querySelector('#dbGo');if(g)g.click();});}
    root.querySelectorAll('.pick .card').forEach(el=>el.addEventListener('click',()=>{const k=el.parentElement.dataset.key;if(draft.length<DECK_N&&draft.filter(x=>x===k).length<maxCopies(k)){draft.push(k);upd();}}));
    const dpick=root.querySelector('#dpick');const showPick=t=>{dpick.hidden=!t;dpick.innerHTML=t||'';};
    root.querySelector('#dbRand').addEventListener('click',()=>{const pool=TOP_DECKS.filter(x=>x.keys.join()!==draft.join());const t=pool[Math.floor(Math.random()*pool.length)];draft=[...t.keys];upd();showPick(`おまかせ：<b>${t.name}</b>（bot同士の大会での通算勝率${t.wr}%）`);});
    root.querySelector('#dbRand2').addEventListener('click',()=>{draft=botDeck();upd();showPick('ランダム：完全ランダムに組みました');});
    root.querySelector('#dbClear').addEventListener('click',()=>{draft=[];upd();showPick('');});
    root.querySelector('#dbGo').addEventListener('click',()=>{if(draft.length!==DECK_N)return;myDeck=[...draft];newGame(myDeck);});
    const lvNotes=['','すぐに指す。デッキはランダム。','1手ごとに約6秒考え、カードの使い方も読む。デッキはランダム。','1手ごとに約10秒考え、カードの組み合わせまで読む。5種類の最強デッキのどれかで来る。'];
    const updLv=()=>{root.querySelectorAll('[data-lv]').forEach(b=>b.classList.toggle('on',+b.dataset.lv===botLevel));root.querySelector('#lvnote').textContent=lvNotes[botLevel];};
    root.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>{botLevel=+b.dataset.lv;updLv();}));
    updLv();
    let busyOn=false;
    const pane=root.querySelector('#onlinePane');
    const renderPane=()=>{
      const cfg=savedConfig();
      const inRoom=ONLINE&&ONLINE.role==='host'&&!ONLINE.started;
      pane.innerHTML=`
        <div class="onl">
          ${cfg?`<p class="ok">Firebase：設定済み（${(cfg.projectId||cfg.databaseURL||'').replace(/^https?:\/\//,'')}）${FIREBASE_CONFIG?'':'　<button type="button" class="linkbtn" data-cfgedit>設定を変える</button>'}</p>`:''}
          <div class="cfgbox" ${cfg?'hidden':''}>
            <label for="fbcfg"><b>Firebaseの設定を貼り付け</b>（Firebaseコンソール →プロジェクトの設定 →マイアプリ の firebaseConfig）</label>
            <textarea id="fbcfg" rows="4" placeholder='{ apiKey: "...", authDomain: "...", databaseURL: "https://...firebaseio.com", projectId: "...", appId: "..." }'></textarea>
            <button type="button" class="btn" data-cfgsave>保存する</button>
          </div>
          <div class="onrow"><label for="pname"><b>名前</b></label><input id="pname" maxlength="12" placeholder="名前" autocomplete="off" value="${esc(myName()||randomFood())}"><button type="button" class="btn" data-rname title="食べ物の名前をランダムに">🎲</button></div>
          <div class="onrow">
            <button type="button" class="btn on" data-create ${cfg?'':'disabled'}>部屋を作る</button>
            <span class="or">または</span>
            <input id="joincode" maxlength="4" placeholder="合言葉" autocomplete="off" value="${(location.hash.match(/^#r([A-Za-z0-9]{4})$/)||[])[1]||''}">
            <button type="button" class="btn" data-join ${cfg?'':'disabled'}>部屋に入る</button>
          </div>
          <div id="onstatus" class="onstatus">${ONLINE&&ONLINE.status!=='playing'?lobbyHTML():''}</div>
          <details class="guide"><summary>初めての準備（Firebaseとページの公開）</summary>
            <ol class="steps">
              <li><b>Firebaseのプロジェクトを作る</b>：console.firebase.google.com でプロジェクトを作り、「Realtime Database」を作成します。</li>
              <li><b>ルールを設定する</b>：Realtime Databaseの「ルール」に次を貼り付けて公開します。<pre>{ "rules": { "rooms": { "$code": {
  ".read": true, ".write": true,
  ".validate": "$code.matches(/^[A-Z0-9]{4}$/)",
  "state": { ".validate": "newData.child('json').isString() &amp;&amp; newData.child('json').val().length &lt; 300000" },
  "members": { "$id": { "name": { ".validate": "newData.isString() &amp;&amp; newData.val().length &lt;= 12" } } },
  "$other": { ".validate": "$other.matches(/^(status|created|host|members|seats|state|presence|settings)$/)" }
} } } }</pre>部屋の合言葉を知っている人だけが、その部屋を読み書きできます（部屋の一覧は読めません）。決まった形以外のデータや、大きすぎるデータは書き込めません。部屋主が抜けると部屋は消えます。</li>
              <li><b>ウェブアプリを登録</b>：プロジェクトの設定でウェブアプリを追加し、表示される firebaseConfig をここに貼り付けます（コードの先頭の FIREBASE_CONFIG に書いておけば、毎回の貼り付けは不要です）。</li>
              <li><b>ページを公開する</b>：ダウンロードした html を GitHub Pages や Cloudflare Pages に置きます。Claude上のこのページからは通信できないため、オンライン対戦は公開したページで遊んでください。</li>
              <li><b>対戦する</b>：1人が「部屋を作る」で合言葉を出し、ほかの人（4人まで）はそれを入れて「部屋に入る」。ロビーで先手・後手・観戦を選び、部屋主が「対局開始」を押します。座る人は12枚のデッキを組んでおきます。対局中に入った人は観戦になります。</li>
            </ol></details>
        </div>`;
      const st=pane.querySelector('#onstatus');
      const setStatus=h=>{st.innerHTML=h;};
      const err=e=>{busyOn=false;if(root.querySelector('#dc'))upd();setStatus(`<p class="err">${e.message||e}</p>`);};
      pane.querySelector('[data-cfgsave]')&&pane.querySelector('[data-cfgsave]').addEventListener('click',()=>{
        const c=parseConfig(pane.querySelector('#fbcfg').value);
        if(!c){setStatus('<p class="err">設定を読み取れませんでした。apiKey と databaseURL を含む firebaseConfig を貼り付けてください。</p>');return;}
        try{localStorage.setItem('shogi7_fb',JSON.stringify(c));}catch(e){}
        renderPane();upd();
      });
      pane.querySelector('[data-cfgedit]')&&pane.querySelector('[data-cfgedit]').addEventListener('click',()=>{pane.querySelector('.cfgbox').hidden=false;});
      const getName=()=>{const v=(pane.querySelector('#pname').value||'').trim().slice(0,12)||randomFood();pane.querySelector('#pname').value=v;saveName(v);return v;};
      pane.querySelector('[data-rname]').addEventListener('click',()=>{pane.querySelector('#pname').value=randomFood();});
      pane.querySelector('[data-create]').addEventListener('click',async()=>{
        const nm=getName();busyOn=true;upd();setStatus('<p>部屋を作っています…</p>');
        try{if(ONLINE)leaveOnline(true);await createRoom(setStatus,nm);}catch(e){err(e);}finally{busyOn=false;if(root.isConnected&&root.querySelector('#dc'))upd();}
      });
      pane.querySelector('[data-join]').addEventListener('click',async()=>{
        const nm=getName();busyOn=true;upd();setStatus('<p>部屋に入っています…</p>');
        try{if(ONLINE)leaveOnline(true);await joinRoom(pane.querySelector('#joincode').value,setStatus,nm);}catch(e){err(e);}finally{busyOn=false;if(root.isConnected&&root.querySelector('#dc'))upd();}
      });
      pane.addEventListener('change',e=>{if(e.target.id==='ltime'&&ONLINE&&ONLINE.host===myId){const v=Math.max(0,Math.min(600,Math.round(+e.target.value||0)));e.target.value=v;ONLINE.ref.child('settings/time').set(v);}});
      pane.addEventListener('click',e=>{const b=e.target.closest('[data-seat]');if(b&&!b.disabled){takeSeat(b.dataset.seat).catch(err);return;}
        if(e.target.closest('[data-lstart]')){startFromLobby().catch(err);return;}
        if(e.target.closest('[data-lleave]')){leaveOnline(true);setStatus('<p>部屋を出ました。</p>');return;}});
      pane.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const t=b.dataset.copy;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{b.textContent='コピーしました';}).catch(()=>{b.textContent='合言葉：'+t;});});
    };
    const setTab=t=>{
      mode=t;
      root.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',b.dataset.tab===t);});
      pane.hidden=t!=='online';root.querySelector('#lvrow').hidden=t==='online';root.querySelector('#dbGo').hidden=t==='online';
      if(t==='online')renderPane();
    };
    root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
    setTab(mode);
    upd();
  },true);
}

$('#bDeck').addEventListener('click',()=>{
  if(isOnline()&&!G.over&&!G.waiting){
    const prev=G.modal;G.modal=true;
    openModal(`<h3>オンライン対局を抜けますか？</h3><p>抜けると、この対局には戻れません。</p><div class="modal-actions"><button class="btn on" data-yes type="button">投了して抜ける</button><button class="btn" data-no type="button">続ける</button></div>`,root=>{
      root.querySelector('[data-yes]').addEventListener('click',()=>{resign();setTimeout(()=>{leaveOnline();openBuilder('online');},500);});
      root.querySelector('[data-no]').addEventListener('click',()=>{G.modal=prev;closeModal();render();});
    });return;
  }
  if(isOnline())leaveOnline();
  openBuilder();
});
$('#bResign').addEventListener('click',()=>{
  if(!isOnline()||G.over)return;const prev=G.modal;G.modal=true;
  openModal(`<h3>投了しますか？</h3><div class="modal-actions"><button class="btn on" data-yes type="button">投了する</button><button class="btn" data-no type="button">続ける</button></div>`,root=>{
    root.querySelector('[data-yes]').addEventListener('click',()=>{G.modal=false;closeModal();resign();});
    root.querySelector('[data-no]').addEventListener('click',()=>{G.modal=prev;closeModal();render();});
  });
});
$('#bAgain').addEventListener('click',()=>{if(G&&!G.preview)newGame(myDeck);});
$('#bRules').addEventListener('click',showRules);
$('#bLib').addEventListener('click',showLibrary);
$('#chips').addEventListener('click',e=>{{const mb=e.target.closest('[data-mercy]');if(mb&&!locked()){const[a,b]=mb.dataset.mercy.split(',').map(Number);mercyStart(a,b);render();return;}}{const ab=e.target.closest('[data-akimbo]');if(ab&&!locked()){openAkimbo(+ab.dataset.akimbo);return;}}{const lb=e.target.closest('[data-enc]');if(lb&&!locked()&&G.encourage){encouragePush(+lb.dataset.enc);render();return;}}{const nb=e.target.closest('[data-neon]');if(nb&&!locked()&&G.neonFrom){throwNeon(G.neonFrom,+nb.dataset.neon||2);return;}}if(e.target.closest('[data-barracks]')&&!locked())openBarracks();if(e.target.closest('[data-magic]')&&!locked())magicianUse();});
$('#oppHand').addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)showCard(b.dataset.key);});
$('#endBtn').addEventListener('click',()=>{if(!locked()&&!mustMove())endTurn();});
$('#pDraw').addEventListener('click',()=>showPile('draw'));
$('#pDisc').addEventListener('click',()=>showPile('discard'));
$('#hint').addEventListener('click',e=>{if(e.target.closest('[data-swarmdone]')&&!locked()){finishSwarm();return;}const fb=e.target.closest('[data-face]');if(fb&&!locked()&&G.sel){G.faceSel=fb.dataset.face;render();return;}const b=e.target.closest('[data-act]');if(!b||locked()||!G.sel)return;const a=b.dataset.act;G.breachAim=null;G.molAim=null;if(a==='ambush'){doAmbush(G.sel[0],G.sel[1]);return;}if(a==='charge'){chargeXbow(G.sel[0],G.sel[1],G.faceSel);return;}if(a==='gcharge'){chargeGrand(G.sel[0],G.sel[1]);return;}if(a==='lsend'){const lp=G.board[G.sel[0]][G.sel[1]];if(lp)leaderSend(lp.id);render();return;}if(a==='move'){G.shootMode=false;render();return;}G.shootMode=G.shootMode===a?false:a;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&!G.modal&&G.pending&&G.pending.multi){finishSwarm();return;}if(e.key==='Escape'&&G&&!G.modal&&(G.pending||G.sel)){G.pending=null;G.sel=null;G.shootMode=false;render();}});
window.addEventListener('resize',()=>{if(G)layoutHand();});

buildBoard();
G=freshState([],[],true);G.log=[{t:'デッキを選ぶと対局が始まります',sep:true}];
render();
openBuilder(/^#r[A-Za-z0-9]{4}$/.test(location.hash)?'online':undefined);
{let seen=false;try{seen=localStorage.getItem('shogi7_rules')==='1';}catch(e){}if(!seen&&!/^#r[A-Za-z0-9]{4}$/.test(location.hash))openRulesOverlay(true);}
})();
</script>
