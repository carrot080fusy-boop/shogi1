<title>七路将棋カードバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a kaya-wood 7x7 board lit like a night tea room; your hand of cards below, opponent above, log on the side. Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#131823; --panel:#1b2230; --panel-2:#232c3d; --line:#33405a;
  --fg:#ede4cf; --muted:#9ba6ba;
  --wood:#d8b06a; --wood-dk:#b88a45; --grid:#5a3a14; --koma:#f1d9a4; --koma-ink:#2a1b0c; --pro:#b4231a;
  --enh:#c9502f; --res:#c99a34; --mag:#6e62c9;
  --poison:#8cc66a; --seize:#9d7ae0; --smoke:#c3c8d2; --gold:#e1b24c; --danger:#e8603c;
  --parch:#f2e7cc; --parch-ink:#2a2230;
  --f-disp:'Dela Gothic One','Hiragino Sans',sans-serif;
  --f-min:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  --bs:max(270px, min(calc(100vw - 56px), calc(100vh - 400px), 560px));
  --cw:124px; --ch:200px;
}
@supports (height:100svh){ :root{ --bs:max(270px, min(calc(100vw - 56px), calc(100svh - 400px), 560px)); } }
@media (min-width:1000px){
  :root{ --bs:max(320px, min(calc(100vw - 460px), calc(100vh - 340px), 600px)); }
  @supports (height:100svh){ :root{ --bs:max(320px, min(calc(100vw - 460px), calc(100svh - 340px), 600px)); } }
}
@media (max-width:700px){ :root{ --cw:108px; --ch:186px; } }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;min-height:100%;
  background-image:radial-gradient(ellipse at 50% -20%, #263049 0%, transparent 60%)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:var(--f-min);font-weight:800;font-size:22px;letter-spacing:.12em;color:var(--gold)}
.logo span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stage{display:grid;grid-template-columns:1fr;gap:16px;padding-block:12px 24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:1000px){ .stage{grid-template-columns:minmax(0,1fr) 300px;align-items:start} }
.play{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}

.strip{width:min(100%, 900px);display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.strip.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.who{font-weight:700;display:flex;align-items:center;gap:8px}
.who .mk{font-size:16px}
.stat{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg)}
.stat .en b{color:var(--gold)}
.turnno{margin-left:auto;font-size:12px;color:var(--muted)}

.board-wrap{position:relative;padding:22px 26px 10px 10px;border-radius:6px;background:linear-gradient(#5b3c1c,#3e2911);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.files,.ranks{position:absolute;display:flex;font-family:var(--f-min);font-weight:800;color:#f0d9a8;font-size:12px;pointer-events:none}
.files{left:10px;top:3px;width:var(--bs);justify-content:space-around}
.ranks{right:6px;top:22px;height:var(--bs);flex-direction:column;justify-content:space-around}
.board{position:relative;width:var(--bs);height:var(--bs);user-select:none;-webkit-user-select:none;background:var(--wood)}
.squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);border:2px solid var(--grid)}
.sq{position:relative;border:0;padding:0;cursor:pointer;background:var(--wood);box-shadow:inset 0 0 0 .5px var(--grid)}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none}
.sq.last::before{inset:0;background:rgba(201,80,47,.22)}
.sq.sel::before{inset:0;box-shadow:inset 0 0 0 3px var(--enh);background:rgba(201,80,47,.25)}
.sq.mv::after{width:24%;height:24%;left:38%;top:38%;border-radius:50%;background:rgba(42,27,12,.45)}
.sq.hmv::after{width:24%;height:24%;left:38%;top:38%;border-radius:50%;background:transparent;box-shadow:0 0 0 3px rgba(42,27,12,.55)}
.sq.cap::after{inset:6%;border-radius:4px;box-shadow:inset 0 0 0 4px rgba(201,80,47,.9)}
.sq.tgt::before{inset:0;background:var(--tgtc);opacity:.42;animation:pulse 1.2s ease-in-out infinite}
.sq.tgt:hover::before{opacity:.7}
.sq.chk::before{inset:0;background:radial-gradient(circle, rgba(232,96,60,.85), rgba(232,96,60,0) 72%)}
.sq.area::before{inset:0;background:var(--tgtc);opacity:.6;box-shadow:inset 0 0 0 2px #fff}
.sq.shot::after{inset:10%;border-radius:50%;border:3px solid var(--danger);background:radial-gradient(circle,transparent 30%,rgba(232,96,60,.3) 32%);box-shadow:0 0 0 1px #000 inset}
.sq .cd{position:absolute;right:3%;top:2%;font-family:var(--f-disp);font-size:calc(var(--bs) / 34);color:#7a1a0c;pointer-events:none;text-shadow:0 0 3px #fff}
.hint .hb{margin-left:8px;border:1px solid var(--danger);background:transparent;color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.hint .hb.on{background:var(--danger);color:#fff}
.hint .facepick{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:12.5px}
.hint .hb.face{margin-left:0;border-color:var(--gold)}
.hint .hb.face.on{background:var(--gold);color:#241a06}
@keyframes pulse{50%{opacity:.18}}

.pieces,.fx{position:absolute;inset:2px;pointer-events:none}
.pc{position:absolute;width:calc(100%/7);height:calc(100%/7);display:grid;place-items:center;transition:left .28s ease, top .28s ease, opacity .3s, transform .3s}
.pc .kw{width:78%;height:86%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));display:grid}
.pc .k{clip-path:polygon(50% 0,86% 16%,100% 100%,0 100%,14% 16%);background:linear-gradient(170deg,#f7e4b6,var(--koma) 55%,#d6b679);
  display:grid;place-items:center;padding-top:14%;font-family:var(--f-min);font-weight:800;color:var(--koma-ink);font-size:calc(var(--bs) / 7 * .44);line-height:1}
.pc.g .kw{transform:rotate(180deg)}
.pc.pro .k{color:var(--pro)}
.pc.king .k{font-size:calc(var(--bs) / 7 * .48)}
.pc.hid .k{color:#55606f;background:linear-gradient(170deg,#c9ccd3,#a5aab5)}
.pc.mine-hid .kw{opacity:.72}
.pc.gone{opacity:0;transform:scale(.6)}
.pc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.badges{position:absolute;left:2%;right:2%;bottom:1%;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;z-index:2}
.bd{font-size:calc(var(--bs) / 52);min-width:calc(var(--bs) / 34);padding:0 2px;line-height:1.35;border-radius:3px;font-weight:700;text-align:center;color:#fff;background:var(--enh);font-variant-numeric:tabular-nums}
.bd.res{background:#9a7420}.bd.mag{background:var(--mag)}.bd.poi{background:var(--poison);color:#14260a}.bd.dng{background:var(--danger)}
.ring{position:absolute;inset:4%;border-radius:50%;border:2px dashed rgba(110,98,201,.85);pointer-events:none}

.fxt{position:absolute;width:calc(100%/7);text-align:center;font-weight:700;font-size:clamp(11px, calc(var(--bs) / 36), 15px);white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 2px #000;animation:rise 1.1s ease-out forwards;z-index:5}
.fxt.enh{color:#ffb08f}.fxt.poi{color:var(--poison)}.fxt.mag{color:#c8bdff}.fxt.kill{color:var(--danger)}.fxt.res{color:var(--gold)}
@keyframes rise{from{transform:translateY(10%);opacity:1}to{transform:translateY(-120%);opacity:0}}

.hint{min-height:24px;font-size:13px;color:var(--muted);text-align:center;max-width:640px;text-wrap:balance}
.hint b{color:var(--fg)}

.me{width:min(100%, 900px);display:grid;grid-template-columns:130px minmax(0,1fr) 150px;grid-template-areas:"left hand right";gap:12px;align-items:end}
@media (max-width:700px){ .me{grid-template-columns:1fr auto;grid-template-areas:"left right" "hand hand"} }
.me-left{grid-area:left;display:flex;flex-direction:column;align-items:center;gap:6px}
.me-right{grid-area:right;display:flex;flex-direction:column;gap:8px}
@media (max-width:700px){ .me-left{flex-direction:row;justify-self:start} .me-right{flex-direction:row;align-items:center} }
.orb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;color:#2a1c04;
  background:radial-gradient(circle at 35% 30%, #fff0bf 0%, var(--gold) 50%, #7a5612 100%);box-shadow:0 0 18px rgba(225,178,76,.4), inset 0 -4px 8px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.orb.off{filter:grayscale(.8) brightness(.6);box-shadow:none}
.orb-note{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.chips{display:flex;flex-direction:column;gap:4px;align-items:center}
@media (max-width:700px){.chips{align-items:flex-start}}
.chip{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--enh);white-space:nowrap}
.chip.on{background:var(--enh);color:#fff;font-weight:700}
.chip.off{border-color:var(--line);color:var(--muted)}
.piles{display:flex;gap:6px}
.pile{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;cursor:pointer;font-size:11px;line-height:1.25;text-align:center}
.pile b{display:block;font-family:var(--f-disp);font-weight:400;font-size:16px}
.pile:hover{border-color:var(--gold)}
.endbtn{border:0;border-radius:8px;padding:12px 10px;background:linear-gradient(#e9c16a,#b3862b);color:#241a06;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #6f5114}
.endbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #6f5114}
.endbtn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}

.hand{grid-area:hand;display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--ch) + 18px);padding-top:18px;min-width:0}
@media (max-width:700px){ .hand{justify-content:flex-start;overflow-x:auto;padding-bottom:6px} }
.empty-hand{color:var(--muted);font-size:13px;align-self:center}

.card{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:9px;border:0;padding:0;cursor:pointer;background:var(--frame);
  box-shadow:0 6px 14px rgba(0,0,0,.45);transition:transform .15s ease, filter .15s;text-align:center;display:flex;flex-direction:column}
.card.enh{--frame:var(--enh)} .card.res{--frame:var(--res)} .card.mag{--frame:var(--mag)}
.card .cost{position:absolute;left:-7px;top:-7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;z-index:2;font-family:var(--f-disp);font-size:15px;color:#2a1c04;
  background:radial-gradient(circle at 35% 30%, #fff0bf, var(--gold) 55%, #7a5612);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.card .cost.down{background:radial-gradient(circle at 35% 30%, #e6ffd2, #7fd05a 55%, #2f6a18)}
.card .cname{font-family:var(--f-min);font-weight:800;font-size:13px;color:#fff6e4;padding:8px 6px 2px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card .art{margin:2px 8px 0;height:19%;border-radius:4px;display:grid;place-items:center;font-family:var(--f-min);font-weight:800;font-size:calc(var(--ch) * .13);
  color:var(--frame);background:radial-gradient(circle at 50% 40%, #fff7e3, #dccba4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.card .ctype{font-size:9px;letter-spacing:.15em;color:#fff6e4;opacity:.9;padding:2px 0}
.card .ctext{flex:1;margin:0 7px 8px;border-radius:4px;background:var(--parch);color:var(--parch-ink);font-size:9.6px;line-height:1.42;padding:4px 5px;text-align:left;overflow:hidden}
@media (max-width:700px){ .card .ctext{font-size:9px;padding:3px 4px} .card .cname{font-size:12px} }
.hand .card:hover{transform:translateY(-12px);z-index:5}
.card.pending{transform:translateY(-18px);z-index:6;box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,0,0,.5)}
.card.dim{filter:saturate(.35) brightness(.7);cursor:not-allowed}
.hand .card.dim:hover{transform:translateY(-4px)}
.card.static{cursor:default}
.opp-hand{width:min(100%, 900px);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.oh-label{font-size:12px;color:var(--muted);margin-right:2px}
.oh-empty{font-size:12px;color:var(--muted)}
.ochip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;padding:3px 10px 3px 4px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;background:var(--enh)}
.ochip.res{background:#9a7420}.ochip.mag{background:var(--mag)}
.ochip:hover{filter:brightness(1.15)}
.ochip .oc{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:400;font-size:11px;color:#2a1c04;background:radial-gradient(circle at 35% 30%, #fff0bf, var(--gold) 55%, #7a5612)}
.ochip .oheld{font-size:10px;background:var(--danger);border-radius:6px;padding:0 5px}
.libitem{display:flex;flex-direction:column;align-items:center;gap:4px}
.libcount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;font-size:12.5px}
.glossary div{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.glossary b{display:block;color:var(--gold);margin-bottom:2px}
.card .heldtag{position:absolute;right:-6px;top:-8px;z-index:3;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.card.held{box-shadow:0 0 0 2px var(--danger),0 6px 14px rgba(0,0,0,.45)}

.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side h2{font-family:var(--f-min);font-weight:800;font-size:15px;margin:0;letter-spacing:.05em}
.notice{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px 10px;font-size:12.5px}
.notice b{color:var(--gold);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:min(50vh,460px);overflow:auto;font-size:12.5px}
.log li{padding:5px 10px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log li.sep{color:var(--gold);font-weight:700;background:var(--panel-2)}
.log li.g{color:#c6cde0}
.legend{font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,10,16,.78);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.modal.wide{max-width:1040px}
.modal h3{font-family:var(--f-min);font-weight:800;font-size:22px;margin:0 0 6px;text-wrap:balance}
.modal p{margin:0 0 12px;color:var(--muted)}
.grid-cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-min);font-weight:800;font-size:38px;color:var(--gold);text-align:center;margin:6px 0 10px}
.rules{display:grid;gap:12px;font-size:13.5px}
.rules h4{font-family:var(--f-min);font-weight:800;font-size:15px;margin:0 0 2px;color:var(--gold)}
.rules p{margin:0;color:var(--fg);max-width:68ch}

/* deck builder */
.deckbar{position:sticky;top:-22px;z-index:3;background:var(--panel);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px;display:grid;gap:8px}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:640px){ .slots{grid-template-columns:repeat(4,minmax(0,1fr))} }
.slot{min-height:40px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;padding:2px 4px;text-align:center;line-height:1.2}
.slot.f{border-style:solid;color:#fff;font-weight:700}
.slot.f.enh{background:var(--enh);border-color:var(--enh)} .slot.f.res{background:#9a7420;border-color:#9a7420} .slot.f.mag{background:var(--mag);border-color:var(--mag)}
.slot.f:hover{filter:brightness(1.15)}
.slot .c{font-family:var(--f-disp);font-weight:400;font-size:11px;opacity:.85}
.board-wrap.flip .squares,.board-wrap.flip .pieces{transform:rotate(180deg)}
.board-wrap.flip .badges,.board-wrap.flip .sq .cd{transform:rotate(180deg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--panel-2);padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;color:var(--muted)}
.tab.on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:700}
.onl{display:grid;gap:10px;font-size:13px}
.onl p{margin:0}
.onl .ok{color:#9fd47f}
.onl .err{color:var(--danger);font-weight:700}
.cfgbox{display:grid;gap:6px}
.cfgbox textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.onrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.onrow input{width:7em;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:700 15px var(--f-disp);letter-spacing:.2em;text-transform:uppercase}
.onrow .or{color:var(--muted);font-size:12px}
.onstatus{min-height:1em}
.roomcode{font-family:var(--f-disp);font-size:40px;letter-spacing:.25em;color:var(--gold);line-height:1.1}
.linkbtn{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
details.guide{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px 12px;margin-top:10px}
details.guide summary{cursor:pointer;font-family:var(--f-min);font-weight:800;font-size:15px;color:var(--gold)}
details.guide .rules{margin-top:10px}
details.guide .glossary{margin-top:10px}
.steps{margin:8px 0 0;padding-left:1.3em;display:grid;gap:6px;max-width:70ch}
.steps pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px ui-monospace,Menlo,Consolas,monospace;margin:4px 0;overflow-x:auto}
.lvrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lvlabel{font-weight:700;font-size:13px;margin-right:4px}
.lvnote{font-size:12px;color:var(--muted);flex-basis:100%}
@media (min-width:700px){.lvnote{flex-basis:auto;margin-left:6px}}
.slot{position:relative;flex-direction:column}
.slots{padding-top:8px}
.slot .sname{background:none;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;display:flex;gap:4px;align-items:center;padding:0;line-height:1.2}

<script>
(function(){
const $=s=>document.querySelector(s);
const N=7, ROWS='一二三四五六七';
const KJ={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'王'}, KJP={P:'と',L:'杏',N:'圭',S:'全',B:'馬',R:'龍'};
const VAL={P:1,L:3,N:3,S:4,G:5,B:7,R:8,K:100}, VALP={P:4,L:5,N:5,S:5,B:10,R:11};
const CAT={enh:'駒強化',res:'エネルギー・サーチ',mag:'魔法'};
const CARDS={
  haste:{name:'疾風',cost:2,cat:'enh',art:'疾',target:'own',text:'次の自分の番から、この駒はメインの手とは別に1回動ける（駒は取れない）。使うと消える。'},
  ward:{name:'加護',cost:1,cat:'enh',art:'護',target:'own',text:'3ターンの間、毒・延焼・石化・シーズなど相手の妨害を受けない。今かかっている毒・延焼・石化も消す。'},
  blade:{name:'毒刃',cost:2,cat:'enh',art:'刃',target:'ownNoKing',text:'武器。動く前に向き（前・左・右）を決める。動くたび、向いた方向2マスにいる敵駒に毒を与える。'},
  operator:{name:'オペレーター',cost:4,cat:'enh',art:'狙',target:'ownNoKing',text:'狙撃銃を持たせる。メインの手の代わりに発砲し、縦横斜めの射線で最初に当たる敵駒（王も可）を破壊。撃つと2ターン撃てない。'},
  rib:{name:'ランイットバック',cost:4,cat:'enh',art:'戻',target:'own',text:'今のマスにアンカーを置く。次の番はメインと別に1回動ける（取れる）。倒されるか3ターン後にアンカーへ戻る。そこに駒がいると倒れる。'},
  atomic:{name:'アトミック',cost:4,cat:'enh',art:'核',target:'ownPawn',text:'歩にだけ付けられる。4ターン後、この駒を中心に5×5マスの駒を、王も含め敵味方関係なくすべて破壊。'},
  bomb:{name:'自爆',cost:2,cat:'enh',art:'爆',target:'ownNoKing',text:'3ターン後、この駒を中心に3×3マスの駒を、王も含め敵味方関係なくすべて破壊。'},
  plunder:{name:'略奪',cost:2,cat:'enh',art:'奪',target:'own',text:'この駒が敵駒を倒すたびにエネルギー+1。取った時だけでなく、狙撃・弩・毒・延焼・爆発などこの駒の能力で倒した時も入る。'},

  arrow:{name:'火矢',cost:3,cat:'enh',art:'火',target:'ownNoKing',text:'メインの手の代わりに、真っすぐ前2マスで最初に当たる敵駒（王も可）に延焼を付ける。撃つと1ターン撃てない。'},
  xbow:{name:'弩',cost:3,cat:'enh',art:'弩',target:'ownNoKing',text:'メインの手で溜め、次か次の次の番に手を使わず、向いた方向（前・左・右）3マスで最初の敵駒（王も可）を破壊。動くと溜めは消える。'},
  snake:{name:'蛇の目',cost:3,cat:'enh',art:'睨',target:'ownNoKing',text:'向いた方向（前・左・右）2マス以内に止まった敵駒を石化させる。向きは動く前に決める。'},
  barrier:{name:'魔法障壁',cost:2,cat:'enh',art:'障',target:'own',text:'6ターンの間、この駒の周囲1マスは魔法防御になり、相手の魔法が届かない。'},
  rewind:{name:'逆行',cost:1,cat:'enh',art:'逆',target:'ownNoKing',text:'3ターンの間、この駒は動きを前後反対にした「戻る動き」もできる（戻る動きでは駒を取れない）。桂馬や歩も下がれる。'},
  leg:{name:'桂脚',cost:1,cat:'enh',art:'跳',target:'ownNoKing',text:'2ターンの間、この駒は桂馬の動きもできる。'},
  command:{name:'前線指揮',cost:3,cat:'res',art:'指',target:'own',text:'この駒が中央の段か相手側にいる間、自分の魔法のコストが1下がる。付けられるのは1駒だけ。'},
  search:{name:'探索',cost:2,cat:'res',art:'探',target:'none',text:'山札から好きなカードを1枚選び、保留で手札に加える。保留のカードは使うまでターンをまたいで手札に残る。'},
  insure:{name:'保険',cost:1,cat:'res',art:'保',target:'own',text:'次の相手の番が終わるまでにこの駒が倒されたら、エネルギー+3。'},
  barracks:{name:'兵舎',cost:4,cat:'res',art:'営',target:'none',exhaust:true,text:'この対局中、3ターンごとに、デッキに入っている3コスト以下の駒強化を1つ選び、コストなしで駒に付けられる。カードは減らない。使うと対局から消える。'},
  combo:{name:'連撃の構え',cost:1,cat:'res',art:'連',target:'none',text:'このターン、次に使うカードのコストが2下がる。'},
  keeper:{name:'保持化',cost:2,cat:'res',art:'持',target:'none',exhaust:true,text:'この対局中ずっと、毎ターン終了時に手札を1枚だけ次のターンへ持ち越せる。重ねて使えない。使うと対局から消える。'},
  insight:{name:'閃き',cost:1,cat:'res',art:'閃',target:'none',text:'カードを2枚引く。'},
  offering:{name:'供物',cost:0,cat:'res',art:'供',target:'ownPawn',exhaust:true,text:'自分の歩を1枚盤上から取り除き、エネルギー+1。使うとこのカードは対局から消える。'},
  cloud:{name:'暗雲',cost:4,cat:'mag',art:'雲',target:'none',text:'3ターンの間、自陣と自分の魔法障壁の範囲にいる自分の駒は、相手から正体が見えない。'},
  seize:{name:'シーズ',cost:3,cat:'mag',art:'縛',target:'area',text:'3×3に2ターン残る。中の駒は敵味方とも範囲の外へ出られない（中では自由。転移なら脱出できる）。'},
  swamp:{name:'毒沼',cost:3,cat:'mag',art:'沼',target:'area',text:'3×3に2ターン残る沼。置いた時に敵駒がいるマスは沼にならず毒もかからない。通った相手の駒は毒。'},
  smoke:{name:'煙幕',cost:3,cat:'mag',art:'煙',target:'area',text:'3×3に2ターン残る煙。中にいる自分の駒は相手から正体が見えない。'},
  thunder:{name:'ローリングサンダー',cost:5,cat:'mag',art:'轟',target:'thunder',text:'横5×縦2を指定。2ターン後から毎ターン、右から2列→1列→2列と爆撃し中の駒を倒す。爆撃跡は1ターン残る。'},
  warp:{name:'転移',cost:2,cat:'mag',art:'転',target:'warp',text:'自分の駒1つを隣の空きマスへ移す。シーズからも抜け出せる。移した駒は次の自分の番まで動けず撃てない。'},
  dispel:{name:'解呪',cost:2,cat:'mag',art:'解',target:'area',text:'3×3の範囲で、自分の駒の毒・延焼・石化・拘束を消し、相手のシーズと毒沼を取り除く。'},
  petri:{name:'石化の眼',cost:2,cat:'mag',art:'石',target:'enemyNear3',text:'自分の駒から3マス以内の敵駒1つ（王も可）を石化。次の番に動かないと、その次の番は動けない。'},
  summon:{name:'徴兵',cost:2,cat:'mag',art:'兵',target:'summonSq',text:'自陣の魔法防御が残っている段か、自分の魔法障壁の範囲の空きマスに歩を1枚呼び出す。'},
  breaker:{name:'結界崩し',cost:2,cat:'mag',art:'崩',target:'none',text:'相手の敵陣の魔法防御を1段はがす（手前の段→奥の段の順）。'},
};
const PRESET=['haste','blade','rib','search','insure','swamp','seize','breaker'];
const TGT_HINT={own:'強化する自分の駒を選んでください',ownNoKing:'強化する自分の駒（王以外）を選んでください',ownPawn:'自分の歩を選んでください',
  area:'3×3の中心にするマスを選んでください',summonSq:'歩を呼び出す空きマスを選んでください',ownPLN:'成っていない自分の歩・香・桂を選んでください',ownForward:'成っていない自分の歩・香・桂を選んでください',enemyNear3:'石化させる敵駒（自分の駒から3マス以内）を選んでください',thunder:'爆撃範囲（横5×縦2）の中心を選んでください',enemyBuffed:'強化を消す相手の駒を選んでください',warp:'移す自分の駒を選んでください'};

let G=null, uid=1, myDeck=[...PRESET];
let SIM=false, botLevel=1;
let ME='s', ONLINE=null;
/* Firebase の設定をここに書くと、毎回の貼り付けが不要になります（例：{apiKey:"...",databaseURL:"https://xxx-default-rtdb.firebaseio.com",projectId:"xxx",appId:"..."}） */
const FIREBASE_CONFIG={apiKey:"AIzaSyBBoeHEP5tvf902I4JPuYcD1jSVg-Dl5Hk",authDomain:"syougi-d845b.firebaseapp.com",databaseURL:"https://syougi-d845b-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"syougi-d845b",storageBucket:"syougi-d845b.firebasestorage.app",messagingSenderId:"23172097196",appId:"1:23172097196:web:13356a0dbaeda019d16b09"};
const isOnline=()=>G&&G.mode==='online';
const BUDGET_SCALE=1;
const LV_NAME=['','やさしい','ふつう','つよい'];
const HARD_DECKS=[
  {name:'狙撃部隊',keys:['combo','operator','operator','xbow','plunder','insure','search','petri']},
  {name:'毒と石',keys:['blade','blade','swamp','petri','petri','snake','insure','dispel']},
  {name:'焦土作戦',keys:['combo','thunder','seize','seize','atomic','bomb','command','insure']},
  {name:'火矢の前線',keys:['arrow','arrow','petri','snake','plunder','haste','combo','insure']},
  {name:'兵站部隊',keys:['barracks','blade','arrow','plunder','haste','insure','search','rib']},
];
const pieceEls=new Map();
const opp=c=>c==='s'?'g':'s';
const inB=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
const cheb=(a,b,c,d)=>Math.max(Math.abs(a-c),Math.abs(b-d));
const fw=c=>c==='s'?-1:1;
const nota=(r,c)=>`${7-c}${ROWS[r]}`;
const mark=c=>c==='s'?'▲':'△';
const who=c=>(G&&G.mode==='online')?(c==='s'?'先手':'後手'):(c===ME?'あなた':'bot');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const has=(cells,r,c)=>cells.some(x=>x[0]===r&&x[1]===c);
const turnsLeft=at=>Math.max(0,Math.ceil((at-G.T)/2));

function mkPiece(t,c){return {id:uid++,t,c,pro:false,b:{},poison:null};}
function setup(){
  const b=[...Array(N)].map(()=>Array(N).fill(null)), backG='RNSKGBL', backS='LBGKSNR';
  for(let i=0;i<N;i++){b[0][i]=mkPiece(backG[i],'g');b[1][i]=mkPiece('P','g');b[5][i]=mkPiece('P','s');b[6][i]=mkPiece(backS[i],'s');}
  return b;
}
function eachPiece(fn){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=G.board[r][c];if(p)fn(p,r,c);}}
function piecesOf(col){const o=[];eachPiece((p,r,c)=>{if(p.c===col)o.push([r,c,p]);});return o;}
function findKing(col){let k=null;eachPiece((p,r,c)=>{if(p.c===col&&p.t==='K')k=[r,c,p];});return k;}
function findById(id){let f=null;eachPiece((p,r,c)=>{if(p.id===id)f=[r,c,p];});return f;}
const pname=p=>p.t==='K'?(p.c==='s'?'玉':'王'):(p.pro?KJP[p.t]:KJ[p.t]);
const val=p=>p.pro?VALP[p.t]:VAL[p.t];
const inCamp=(col,r)=>col==='s'?r>=5:r<=1;
const zone=(col,r)=>col==='s'?r<=1:r>=5;
const canPromote=p=>!p.pro&&'PLNSBR'.includes(p.t);
const ward=p=>p.b.ward&&p.b.ward.until>G.T;
const hasteReady=p=>p.b.haste&&G.T>=p.b.haste.ready;
const ribExtra=p=>p.b.rib&&p.b.rib.extraAt===G.T&&!p.b.rib.used;
const isLocked=p=>p.b.lock&&p.b.lock.until>G.T;
const canShoot=p=>p.b.op&&G.T>=p.b.op.ready&&G.main&&!isLocked(p);
const active=f=>f.until>G.T;
const canArrow=p=>p.b.arrow&&G.T>=p.b.arrow.ready&&G.main&&!isLocked(p);
const canCharge=p=>p.b.xbow&&p.b.xbow.ch==null&&G.main&&!isLocked(p);
const xbowReady=p=>p.b.xbow&&p.b.xbow.ch!=null&&G.T>=p.b.xbow.ch+2&&G.T<=p.b.xbow.ch+4;
const canXbow=p=>xbowReady(p)&&!isLocked(p);
const CENTER=[3,3];
const hasFacing=p=>p.b.blade||p.b.xbow||p.b.snake;
function faceVec(col,face){const f=fw(col);if(face==='l')return [0,col==='s'?-1:1];if(face==='r')return [0,col==='s'?1:-1];return [f,0];}
function faceCells(col,face,r,c,len){const[dr,dc]=faceVec(col,face);const out=[];for(let k=1;k<=len;k++){const rr=r+dr*k,cc=c+dc*k;if(!inB(rr,cc))break;out.push([rr,cc]);}return out;}
const ARROW_GLYPH=v0=>{const v=ME==='g'?[-v0[0],-v0[1]]:v0;return v[0]<0?'↑':v[0]>0?'↓':v[1]<0?'←':'→';};
const fieldsAt=(type,r,c)=>G.fields.filter(f=>f.type===type&&active(f)&&f.cells&&has(f.cells,r,c));

/* --- magic defense --- */
function campLevel(col){ const nat=G.T<=15?2:G.T<=25?1:0; return Math.min(nat,G.campManual[col]); }
function campRowProtected(col,r){ const lv=campLevel(col); if(lv>=2)return inCamp(col,r); if(lv===1)return r===(col==='s'?6:0); return false; }
function isProtected(caster,r,c,ignoreBarrier){
  if(campRowProtected(opp(caster),r))return true;
  if(ignoreBarrier)return false;
  return piecesOf(opp(caster)).some(([r2,c2,p])=>p.b.barrier&&cheb(r,c,r2,c2)<=1);
}
function inOwnPit(p,r,c){return G.fields.some(f=>f.type==='pit'&&f.owner===p.c&&has(f.cells,r,c));}
function isHidden(p,r,c){
  if(inOwnPit(p,r,c))return true;
  return G.fields.some(f=>f.owner===p.c&&active(f)&&(
    (f.type==='smoke'&&has(f.cells,r,c))||
    (f.type==='cloud'&&(inCamp(p.c,r)||piecesOf(p.c).some(([r2,c2,q])=>q.b.barrier&&cheb(r,c,r2,c2)<=1)))));
}
function hasCommand(col){return piecesOf(col).some(([r,c,p])=>p.b.command&&(col==='s'?r<=3:r>=3));}
function costOf(key,col){const d=CARDS[key];let c=d.cat==='mag'?d.cost-(hasCommand(col)?1:0):d.cost;const pl=G&&G.players&&G.players[col];if(pl&&pl.discount&&key!=='combo')c-=pl.discount;return Math.max(0,c);}
function log(t,c,sep){if(SIM)return;G.log.unshift({t,c,sep});if(G.log.length>150)G.log.pop();}

/* --- shapes --- */
function areaCells(key,caster,r,c){
  const out=[];
  if(key==='thunder'){
    const cc0=Math.min(4,Math.max(2,c)); let r2=r+fw(caster); if(!inB(r2,0))r2=r-fw(caster);
    for(const rr of[r,r2])for(let cc=cc0-2;cc<=cc0+2;cc++)if(!isProtected(caster,rr,cc))out.push([rr,cc]);
    return out;
  }
  for(let rr=r-1;rr<=r+1;rr++)for(let cc=c-1;cc<=c+1;cc++){
    if(!inB(rr,cc)||isProtected(caster,rr,cc))continue;
    if(key==='swamp'){const q=G.board[rr][cc];if(q&&q.c!==caster)continue;}
    out.push([rr,cc]);
  }
  return out;
}
function pitCells(col,r,c){
  const out=[];const r2=r+fw(col);
  for(const rr of[r,r2]){if(!inB(rr,0))continue;for(let cc=c-2;cc<=c+2;cc++)if(inB(rr,cc))out.push([rr,cc]);}
  return out;
}

/* ---------- game flow ---------- */
function mkPlayer(keys){return {draw:shuffle(keys.map(k=>({uid:uid++,key:k}))),hand:[],discard:[],exhaust:[],energy:0,started:false};}
function botDeck(){
  const by=c=>Object.keys(CARDS).filter(k=>CARDS[k].cat===c);
  const pick=(list,n,out)=>{let g=0;while(n>0&&g++<60){const k=list[Math.random()*list.length|0];if(out.filter(x=>x===k).length<2){out.push(k);n--;}}};
  const out=[];pick(by('enh'),3,out);pick(by('res'),2,out);pick(by('mag'),3,out);return out;
}
function freshState(deckS,deckG,preview){
  return {mode:'bot',board:setup(),T:0,turn:'s',players:{s:mkPlayer(deckS),g:mkPlayer(deckG)},main:true,sel:null,pending:null,shootMode:false,
    fields:[],campManual:{s:2,g:2},over:null,log:[],last:null,busy:false,modal:!!preview,preview:!!preview,flash:null};
}
function newGame(deck){
  if(ONLINE)leaveOnline(true);
  ME='s';setOrientation();
  uid=1;pieceEls.clear();$('#pieces').innerHTML='';$('#fx').innerHTML='';closeModal();
  let bd,deckName='';
  if(botLevel===3){const d=HARD_DECKS[Math.random()*HARD_DECKS.length|0];bd=[...d.keys];deckName=d.name;}else bd=botDeck();
  G=freshState(deck,bd,false);G.botDeckName=deckName;
  {const pl=G.players.g;const i=pl.draw.findIndex(c=>c.key===bd[0]);if(botLevel===3&&i>=0){pl.opener=pl.draw.splice(i,1)[0];}}
  {const pl=G.players.s;const i=pl.draw.findIndex(c=>c.key===deck[0]);if(i>=0){pl.opener=pl.draw.splice(i,1)[0];}}
  log('対局開始。あなたが先手（▲）、botが後手（△）。',null,true);
  log(`bot（${LV_NAME[botLevel]}）のデッキ${deckName?'「'+deckName+'」':''}：${bd.map(k=>CARDS[k].name).join('・')}`,'g');
  startTurn();
}
function draw(col,n){
  const pl=G.players[col];
  for(let i=0;i<n;i++){
    if(pl.hand.length>=6)break;
    if(!pl.draw.length){if(!pl.discard.length)break;pl.draw=shuffle(pl.discard);pl.discard=[];log(`${who(col)}の捨て札をシャッフルして山札に戻した`,col);}
    pl.hand.push(pl.draw.pop());
  }
}
function startTurn(){
  G.T++;const me=G.turn,pl=G.players[me];
  log(`第${G.T}手・${who(me)}（${mark(me)}）`,me,true);
  if(G.T===16)log('敵陣の魔法防御が自然に1段はがれた（手前の段）');
  if(G.T===26)log('敵陣の魔法防御がすべてはがれた');
  G.fields=G.fields.filter(f=>active(f)&&(f.type!=='pit'||findById(f.carrier)));
  eachPiece(p=>{if(p.poison&&p.poison.until<=G.T)p.poison=null;for(const k of['ward','leg','insure','barrier','rewind'])if(p.b[k]&&p.b[k].until<=G.T)delete p.b[k];});
  // rolling thunder strikes
  for(const f of G.fields.filter(f=>f.type==='thunder'&&f.owner===me)){
    for(const st of f.stages){
      if(st.done||st.at>G.T)continue; st.done=true;
      const cells=f.cells.filter(x=>st.cols.includes(x[1]));
      log(`${who(me)}のローリングサンダーが着弾（${cells.length}マス）`,me);
      for(const[r,c]of cells){fx(r,c,'爆撃','kill');const q=G.board[r][c];if(q&&q.t!=='K')killPiece(r,c,'thunder',me);}
      G.fields.push({type:'burn',cells,until:G.T+2,owner:me});
    }
  }
  if(G.over)return;
  // run it back: forced return
  for(const[r,c,p]of piecesOf(me)){ if(p.b.rib&&p.b.rib.until<=G.T){ log(`${pname(p)}（${nota(r,c)}）がアンカーへ強制帰還`,me); G.board[r][c]=null; ribReturn(p); if(G.over)return; } }
  // atomics
  for(const[r,c,p]of piecesOf(me)){
    for(const[k,rad]of[['atomic',2],['bomb',1]]){ if(p.b[k]&&p.b[k].at<=G.T){ const f=findById(p.id); if(f&&f[2].b[k]){delete f[2].b[k];atomicBlast(f[0],f[1],rad);} if(G.over)return; } }
  }
  // viper's pit ticks
  for(const f of G.fields.filter(f=>f.type==='pit'&&f.owner===me)){
    for(const[r,c]of f.cells){const q=G.board[r][c];if(!q)continue;
      if(q.c===me){ if(!ward(q)){ q.poison={at:(q.poison&&q.poison.until>G.T)?q.poison.at:G.T,until:G.T+8}; } }
      else{const cf=findById(f.carrier);poisonPiece(r,c,'バイパーズピット',cf&&cf[2]);}}
  }
  if(G.over)return;
  for(const[r,c,p]of piecesOf(me)){if(p.b.xbow&&p.b.xbow.ch!=null&&G.T>p.b.xbow.ch+4){p.b.xbow.ch=null;log(`${pname(p)}（${nota(r,c)}）の弩の溜めが切れた`,me);}}
  if(!pl.started){pl.started=true;pl.energy=2;if(pl.opener){pl.hand.push(pl.opener);pl.opener=null;draw(me,2);}else draw(me,3);}
  else{pl.energy=Math.min(10,pl.energy+1);draw(me,2);}
  if(G.T>=11){const q=G.board[CENTER[0]][CENTER[1]];if(q&&q.c===me){pl.energy=Math.min(10,pl.energy+1);fx(CENTER[0],CENTER[1],'中央+1','res');log(`中央（${nota(...CENTER)}）を押さえているので${who(me)}はエネルギー+1`,me);}}
  G.main=true;G.sel=null;G.pending=null;G.shootMode=false;
  render();
  if(me==='g'&&!SIM&&G.mode!=='online')setTimeout(botTurn,700);
}
function endTurn(){
  const me=G.turn,pl=G.players[me];
  const cands=pl.hand.filter(c=>!c.held);
  if(pl.keeper&&cands.length){
    if(me===ME&&!SIM){openKeep(cands);return;}
    const k=[...cands].sort((a,b)=>CARDS[b.key].cost-CARDS[a.key].cost)[0];
    finishEnd(k.uid);return;
  }
  finishEnd(null);
}
function finishEnd(keepUid){
  const me=G.turn,pl=G.players[me];
  G.modal=false;pl.discount=0;
  for(const[r,c,p]of piecesOf(me)){
    if(p.burn&&p.burn.dl<=G.T){log(`${pname(p)}（${nota(r,c)}）は動かなかったため延焼で倒れた`,opp(me));killPiece(r,c,'fire',opp(me),p.burn.by);if(G.over){render();return;}}
  }
  for(const[r,c,p]of piecesOf(me)){
    if(p.petri&&p.petri.dl<=G.T){delete p.petri;p.b.lock={until:G.T+3};p.petImm=G.T+6;fx(r,c,'石化','mag');log(`${pname(p)}（${nota(r,c)}）は動かなかったため石になり、次の番は動けない`,opp(me));}
  }
  const out=pl.hand.filter(c=>!c.held&&c.uid!==keepUid);
  pl.hand=pl.hand.filter(c=>c.held||c.uid===keepUid);
  if(out.length){out.forEach(c=>pl.discard.push(c));log(`使わなかった${out.length}枚を捨て札へ`,me);}
  const kept=pl.hand.find(c=>c.uid===keepUid);
  if(kept)log(me===ME&&!isOnline()?`「${CARDS[kept.key].name}」を次のターンへ持ち越した`:`${who(me)}は1枚を次のターンへ持ち越した`,me);
  G.sel=null;G.pending=null;G.shootMode=false;G.turn=opp(G.turn);startTurn();
}
function openKeep(cands){
  G.modal=true;
  openModal(`<h3>保持化：持ち越すカードを1枚選ぶ</h3><p>選んだ1枚は次のターンも手札に残ります。次のターンは、この1枚と新しく引く2枚で手札が3枚になります。</p>
    <div class="grid-cards">${cands.map(c=>cardHTML(c.key,c.uid,'',ME)).join('')}</div>
    <div class="modal-actions"><button class="btn" data-none type="button">持ち越さない</button></div>`,root=>{
    root.querySelectorAll('.grid-cards .card').forEach(el=>el.addEventListener('click',()=>{closeModal();finishEnd(+el.dataset.uid);}));
    root.querySelector('[data-none]').addEventListener('click',()=>{closeModal();finishEnd(null);});
  });
}

/* ---------- movement ---------- */
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]],DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];
function rawMoves(r,c){
  const p=G.board[r][c];
  let out=genMoves(r,c,fw(p.c));
  if(p.b.rewind&&p.b.rewind.until>G.T){for(const m of genMoves(r,c,-fw(p.c)))if(!m.cap&&!out.some(x=>x.r===m.r&&x.c===m.c))out.push(m);}
  if(!ward(p)){const sz=fieldsAt('seize',r,c);if(sz.length)out=out.filter(m=>sz.every(f=>has(f.cells,m.r,m.c)));}
  return out;
}
function genMoves(r,c,f){
  const b=G.board,p=b[r][c],out=[];
  const step=(dr,dc)=>{const rr=r+dr,cc=c+dc;if(!inB(rr,cc))return;const t=b[rr][cc];if(t&&t.c===p.c)return;out.push({r:rr,c:cc,cap:!!t,path:[[rr,cc]]});};
  const slide=(dr,dc)=>{let rr=r+dr,cc=c+dc;const path=[];while(inB(rr,cc)){const t=b[rr][cc];if(t&&t.c===p.c)break;path.push([rr,cc]);out.push({r:rr,c:cc,cap:!!t,path:[...path]});if(t)break;rr+=dr;cc+=dc;}};
  const GOLD=[[f,0],[f,-1],[f,1],[0,-1],[0,1],[-f,0]];
  const t=p.t;
  if(t==='K')[...ORTH,...DIAG].forEach(([a,d])=>step(a,d));
  else if(t==='G'||(p.pro&&'PLNS'.includes(t)))GOLD.forEach(([a,d])=>step(a,d));
  else if(t==='P')step(f,0);
  else if(t==='L')slide(f,0);
  else if(t==='N'){step(2*f,-1);step(2*f,1);}
  else if(t==='S')[[f,0],[f,-1],[f,1],[-f,-1],[-f,1]].forEach(([a,d])=>step(a,d));
  else if(t==='B'){DIAG.forEach(([a,d])=>slide(a,d));if(p.pro)ORTH.forEach(([a,d])=>step(a,d));}
  else if(t==='R'){ORTH.forEach(([a,d])=>slide(a,d));if(p.pro)DIAG.forEach(([a,d])=>step(a,d));}
  if(p.b.leg&&p.b.leg.until>G.T){step(2*f,-1);step(2*f,1);}
  const seen=new Set();return out.filter(m=>{const k=m.r*N+m.c;if(seen.has(k))return false;seen.add(k);return true;});
}
function movesFor(r,c){
  const p=G.board[r][c];
  if(!p||p.c!==G.turn||isLocked(p))return [];
  const mv=rawMoves(r,c);
  if(G.main||ribExtra(p))return mv;
  return hasteReady(p)?mv.filter(m=>!m.cap):[];
}
function shootTargets(r,c){
  const p=G.board[r][c],out=[];
  for(const[dr,dc]of[...ORTH,...DIAG]){let rr=r+dr,cc=c+dc;while(inB(rr,cc)){const q=G.board[rr][cc];if(q){if(q.c!==p.c)out.push([rr,cc]);break;}rr+=dr;cc+=dc;}}
  return out;
}
function attackedBy(r,c,by){
  for(const[r2,c2,p]of piecesOf(by)){
    if(isHidden(p,r2,c2))continue;
    if(rawMoves(r2,c2).some(m=>m.r===r&&m.c===c&&m.cap))return true;
    if(p.b.op&&shootTargets(r2,c2).some(t=>t[0]===r&&t[1]===c))return true;
  }
  return false;
}
function died(p,r,c,cause,killer,by){
  if(p.b.rib&&cause!=='rib'){ribReturn(p);return false;}
  if(cause!=='capture')fx(r,c,{poison:'毒で倒れた',atomic:'消滅',thunder:'爆撃',shot:'狙撃',burn:'爆撃跡',rib:'帰還失敗',fire:'延焼',bolt:'弩'}[cause]||'消滅','kill');
  if(p.b.insure&&p.b.insure.until>G.T&&killer&&killer!==p.c){const pl=G.players[p.c];pl.energy=Math.min(10,pl.energy+3);log(`保険が発動。${who(p.c)}はエネルギー+3`,p.c);}
  if(killer&&killer!==p.c&&p.t!=='K'){const bonus=p.t==='P'&&!p.pro?0:(p.pro||'BR'.includes(p.t))?2:1;if(bonus){const kp=G.players[killer];kp.energy=Math.min(10,kp.energy+bonus);log(`撃破ボーナス：${who(killer)}はエネルギー+${bonus}`,killer);}}
  if(by&&by.b.plunder&&killer&&killer!==p.c&&by.c===killer){const kp=G.players[killer];kp.energy=Math.min(10,kp.energy+1);fx(r,c,'略奪+1','res');log(`略奪：${who(killer)}はエネルギー+1`,killer);}
  if(p.t==='K'){ if(G.blast)G.blast.push(p.c); else gameOver(opp(p.c)); }
  return true;
}
function killPiece(r,c,cause,killer,by){const p=G.board[r][c];if(!p)return false;G.board[r][c]=null;return died(p,r,c,cause,killer,by);}
function ribReturn(p){
  const[a0,a1]=p.b.rib.anchor;delete p.b.rib;
  if(!G.board[a0][a1]){G.board[a0][a1]=p;fx(a0,a1,'帰還','enh');log(`${pname(p)}がアンカー（${nota(a0,a1)}）へ戻った`,p.c);}
  else{log(`アンカー（${nota(a0,a1)}）がふさがっていて${pname(p)}は倒れた`,opp(p.c));died(p,a0,a1,'rib',null);}
}
function checkBurn(r,c,path){
  const p=G.board[r][c];if(!p||p.t==='K')return;
  const cells=path||[[r,c]];
  if(cells.some(([rr,cc])=>fieldsAt('burn',rr,cc).length)){log(`${pname(p)}（${nota(r,c)}）が爆撃跡に入って倒れた`,opp(p.c));killPiece(r,c,'burn',opp(p.c));}
}
function doMove(fr,fc,tr,tc,face){
  const b=G.board,p=b[fr][fc],t=b[tr][tc];
  const mv=rawMoves(fr,fc).find(m=>m.r===tr&&m.c===tc);
  const hid=isHidden(p,fr,fc);
  let tag='';
  if(ribExtra(p)){p.b.rib.used=true;tag='〔アンカー移動〕';}
  else if(!t&&hasteReady(p)){delete p.b.haste;tag='〔疾風〕';}
  else G.main=false;
  G.sel=null;G.shootMode=false;
  if(p.burn){delete p.burn;fx(fr,fc,'延焼回避','enh');}
  if(p.petri)delete p.petri;
  if(p.b.xbow&&p.b.xbow.ch!=null){p.b.xbow.ch=null;log(`${pname(p)}が動いたので弩の溜めが消えた`,p.c);}
  const pn=hid?'？':pname(p), tn=t?pname(t):'';
  b[fr][fc]=null;b[tr][tc]=p;
  if(t){ died(t,tr,tc,'capture',p.c,p); }
  let promo=false;if(canPromote(p)&&(zone(p.c,fr)||zone(p.c,tr))){p.pro=true;promo=true;}
  G.last={fr,fc,tr,tc};
  log(`${mark(p.c)}${nota(tr,tc)}${pn}${promo&&!hid?'成':''}${t?`（${tn}を取る）`:''}${tag}`,p.c);
  if(promo&&!isHidden(p,tr,tc))fx(tr,tc,'成り','res');
  if(G.over){render();return;}
  if(hasFacing(p)){const nf=face||(p.c==='g'?bestFace(p,tr,tc):null);if(nf)p.face=nf;}
  G.faceSel=null;
  if(p.b.blade){for(const[rr,cc]of faceCells(p.c,p.face||'f',tr,tc,2)){const q=b[rr][cc];if(q&&q.c!==p.c)poisonPiece(rr,cc,'毒刃',p);}}
  if(mv&&b[tr][tc]===p&&mv.path.some(([r,c])=>fieldsAt('swamp',r,c).some(f=>f.owner!==p.c)))poisonPiece(tr,tc,'毒沼');
  if(mv&&b[tr][tc]===p)checkBurn(tr,tc,mv.path);
  if(b[tr][tc]===p)snakeCheck(tr,tc);
  render();
}
function shoot(fr,fc,tr,tc){
  const p=G.board[fr][fc],t=G.board[tr][tc];
  G.main=false;p.b.op.ready=G.T+6;G.sel=null;G.shootMode=false;
  log(`${mark(p.c)}${isHidden(p,fr,fc)?'？':pname(p)}（${nota(fr,fc)}）が狙撃、${pname(t)}（${nota(tr,tc)}）を破壊`,p.c);
  G.last={fr,fc,tr,tc};
  killPiece(tr,tc,'shot',p.c,p);
  render();
}
function lineFirst(r,c,dirs,len){
  const out=[];
  for(const[dr,dc]of dirs){let rr=r+dr,cc=c+dc,n=0;while(inB(rr,cc)&&n<len){const q=G.board[rr][cc];if(q){out.push([rr,cc,q]);break;}rr+=dr;cc+=dc;n++;}}
  return out;
}
function arrowTargets(r,c){const p=G.board[r][c];return lineFirst(r,c,[[fw(p.c),0]],2).filter(x=>x[2].c!==p.c).map(x=>[x[0],x[1]]);}
function xbowTargets(r,c,face){const p=G.board[r][c];return lineFirst(r,c,[faceVec(p.c,face||p.face||'f')],3).filter(x=>x[2].c!==p.c).map(x=>[x[0],x[1]]);}
function xbowLineCells(r,c){const p=G.board[r][c];const[dr,dc]=faceVec(p.c,p.face||'f');const out=[];let rr=r+dr,cc=c+dc,n=0;while(inB(rr,cc)&&n<3){out.push([rr,cc]);if(G.board[rr][cc])break;rr+=dr;cc+=dc;n++;}return out;}
function bestFace(p,r,c){
  let best=p.face||'f',bv=-1;
  for(const f of['f','l','r']){let v=0;
    if(p.b.xbow){const ts=lineFirst(r,c,[faceVec(p.c,f)],3).filter(x=>x[2].c!==p.c);if(ts.length)v+=ts[0][2].t==='K'?10:val(ts[0][2]);}
    for(const[rr,cc]of faceCells(p.c,f,r,c,2)){const q=G.board[rr][cc];if(q&&q.c!==p.c)v+=p.b.blade?Math.min(val(q),10):0.5;else if(!q&&p.b.snake)v+=0.3;}
    if(f==='f')v+=0.1;
    if(v>bv){bv=v;best=f;}}
  return best;
}
function modeTargets(mode,r,c){return mode==='op'?shootTargets(r,c):mode==='arrow'?arrowTargets(r,c):mode==='xbow'?xbowTargets(r,c):[];}
function burnPiece(r,c,src,by){
  const p=G.board[r][c];if(!p||ward(p))return;
  p.burn={dl:G.T+1,by};fx(r,c,'延焼','kill');
  log(`${isHidden(p,r,c)?'？':pname(p)}（${nota(r,c)}）が${src}で延焼。次の番に動かないと倒れる`,opp(p.c));
}
function petrify(r,c,src){
  const p=G.board[r][c];if(!p||ward(p)||p.petri||isLocked(p)||(p.petImm&&p.petImm>G.T))return false;
  p.petri={dl:G.T+1};fx(r,c,'石化','mag');
  log(`${isHidden(p,r,c)?'？':pname(p)}（${nota(r,c)}）が${src}で石化。次の番に動かないと、その次の番は動けない`,opp(p.c));

}
function snakeCheck(r,c){
  const q=G.board[r][c];if(!q)return;
  for(const[sr,sc,s]of piecesOf(opp(q.c))){if(s.b.snake&&has(faceCells(s.c,s.face||'f',sr,sc,2),r,c))petrify(r,c,'蛇の目');}
}
function fireArrow(fr,fc,tr,tc){
  const p=G.board[fr][fc];G.main=false;p.b.arrow.ready=G.T+4;G.sel=null;G.shootMode=false;
  log(`${mark(p.c)}${pname(p)}（${nota(fr,fc)}）が火矢を放った`,p.c);G.last={fr,fc,tr,tc};
  burnPiece(tr,tc,'火矢',p);render();
}
function chargeXbow(r,c,face){
  const p=G.board[r][c];G.main=false;p.b.xbow.ch=G.T;if(face)p.face=face;G.faceSel=null;G.sel=null;G.shootMode=false;fx(r,c,'溜め','enh');
  log(`${mark(p.c)}${pname(p)}（${nota(r,c)}）が弩を溜めた。次か次の次の番に撃てる`,p.c);render();
}
function fireXbow(fr,fc,tr,tc){
  const p=G.board[fr][fc],t=G.board[tr][tc];p.b.xbow.ch=null;G.sel=null;G.shootMode=false;
  log(`${mark(p.c)}${pname(p)}（${nota(fr,fc)}）の弩が${pname(t)}（${nota(tr,tc)}）を撃ち抜いた`,p.c);G.last={fr,fc,tr,tc};
  killPiece(tr,tc,'bolt',p.c,p);render();
}
function poisonPiece(r,c,src,by){
  const p=G.board[r][c];if(!p||ward(p))return;
  if(inOwnPit(p,r,c)){p.poison={at:(p.poison&&p.poison.until>G.T)?p.poison.at:G.T,until:G.T+8};return;}
  if(p.poison&&p.poison.until>G.T){
    if(p.poison.at!==G.T){log(`${isHidden(p,r,c)?'？':pname(p)}（${nota(r,c)}）は${src}で2度目の毒を受けて倒れた`,opp(p.c));killPiece(r,c,'poison',opp(p.c),by);}
  }else{p.poison={at:G.T,until:G.T+8};fx(r,c,'毒','poi');log(`${isHidden(p,r,c)?'？':pname(p)}（${nota(r,c)}）が${src}で毒を受けた`,opp(p.c));}
}
function atomicBlast(r,c,rad){
  const me=G.board[r][c];
  log(`${mark(me.c)}${rad===2?'アトミック起動':'自爆'}（${nota(r,c)}中心の${rad*2+1}×${rad*2+1}）`,me.c);
  G.blast=[];
  for(let rr=r-rad;rr<=r+rad;rr++)for(let cc=c-rad;cc<=c+rad;cc++){if(!inB(rr,cc))continue;const q=G.board[rr][cc];if(q)killPiece(rr,cc,'atomic',me.c,me);}
  const lost=G.blast;G.blast=null;
  if(lost.length>=2)gameOver('draw');else if(lost.length===1)gameOver(opp(lost[0]));
}

/* ---------- cards ---------- */
function validTargets(key,first,col){
  col=col||G.turn;const me=col,op=opp(me),d=CARDS[key],mine=piecesOf(me);
  const xy=a=>a.map(([r,c])=>[r,c]);
  switch(d.target){
    case 'none':return [];
    case 'own':return xy(mine);
    case 'ownNoKing':return xy(mine.filter(x=>x[2].t!=='K'));
    case 'ownPawn':return xy(mine.filter(x=>x[2].t==='P'&&!x[2].pro));
    case 'enemyNear3':return xy(piecesOf(op).filter(([r,c,p])=>!isProtected(me,r,c)&&mine.some(([r2,c2])=>cheb(r,c,r2,c2)<=3)&&!ward(p)&&!p.petri&&!isLocked(p)&&!(p.petImm&&p.petImm>G.T)));
    case 'summonSq':{const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(G.board[r][c])continue;if(campRowProtected(me,r)||mine.some(([r2,c2,p])=>p.b.barrier&&cheb(r,c,r2,c2)<=1))o.push([r,c]);}return o;}
    case 'area':case 'thunder':{const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!isProtected(me,r,c))o.push([r,c]);return o;}
    case 'enemyBuffed':return xy(piecesOf(op).filter(([r,c,p])=>Object.keys(p.b).length&&!ward(p)&&!isHidden(p,r,c)&&!isProtected(me,r,c,true)));
    case 'warp':{
      if(!first)return xy(mine);
      const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!G.board[r][c]&&cheb(r,c,first[0],first[1])<=1&&!isProtected(me,r,c))o.push([r,c]);return o;
    }
  }
  return [];
}
function canPlay(card,col){
  col=col||G.turn;const d=CARDS[card.key],pl=G.players[col];
  if(pl.energy<costOf(card.key,col))return false;
  if(card.key==='search')return pl.draw.length>0;
  if(card.key==='keeper')return !pl.keeper;
  if(card.key==='barracks')return !pl.barracks;
  if(card.key==='breaker')return G.campManual[opp(col)]>0&&campLevel(opp(col))>0;
  return d.target==='none'||validTargets(card.key,null,col).length>0;
}
function playCard(card,t,opts){
  opts=opts||{};
  const me=G.turn,pl=G.players[me],d=CARDS[card.key],b=G.board,cost=opts.free?0:costOf(card.key,me);
  pl.energy-=cost;if(card.key!=='combo'&&!opts.free)pl.discount=0;
  if(opts.virtual){pl.barracks.next=G.T+6;}else{pl.hand=pl.hand.filter(x=>x.uid!==card.uid);card.held=false;if(d.exhaust)pl.exhaust.push(card);else pl.discard.push(card);}
  G.pending=null;G.sel=null;G.shootMode=false;
  const P=t&&!Array.isArray(t[0])?b[t[0]][t[1]]:null;
  let note='';
  const at=()=>`${pname(P)}（${nota(t[0],t[1])}）`;
  switch(card.key){
    case 'haste':P.b.haste={ready:G.T+2};fx(t[0],t[1],'疾風','enh');note=at();break;
    case 'ward':P.b.ward={until:G.T+6};P.poison=null;delete P.burn;delete P.petri;fx(t[0],t[1],'加護','enh');note=at();break;
    case 'blade':P.b.blade=true;P.face=P.face||'f';fx(t[0],t[1],'毒刃','enh');note=at();break;
    case 'operator':P.b.op={ready:G.T};fx(t[0],t[1],'狙撃銃','enh');note=at();break;
    case 'rib':P.b.rib={anchor:[t[0],t[1]],extraAt:G.T+2,used:false,until:G.T+6};fx(t[0],t[1],'アンカー','enh');note=at();break;
    case 'atomic':P.b.atomic={at:G.T+8};fx(t[0],t[1],'アトミック','kill');note=at();break;
    case 'pit':{const cells=pitCells(me,t[0],t[1]);G.fields.push({type:'pit',owner:me,cells,carrier:P.id,until:1e9});P.b.pit=true;fx(t[0],t[1],'毒領域','poi');note=at();break;}
    case 'barrier':P.b.barrier={until:G.T+12};fx(t[0],t[1],'魔法障壁','mag');note=at();break;
    case 'rewind':P.b.rewind={until:G.T+6};fx(t[0],t[1],'逆行','enh');note=at();break;
    case 'leg':P.b.leg={until:G.T+4};fx(t[0],t[1],'桂脚','enh');note=at();break;
    case 'command':piecesOf(me).forEach(([,,q])=>delete q.b.command);P.b.command=true;fx(t[0],t[1],'前線指揮','res');note=at();break;
    case 'insure':P.b.insure={until:G.T+2};fx(t[0],t[1],'保険','res');note=at();break;
    case 'insight':draw(me,2);break;
    case 'barracks':pl.barracks={next:G.T};note='3ターンごとに駒強化を付与できるようになった';break;
    case 'combo':pl.discount=2;note='次に使うカードのコスト-2';break;
    case 'arrow':P.b.arrow={ready:G.T};fx(t[0],t[1],'火矢','enh');note=at();break;
    case 'xbow':P.b.xbow={ch:null};P.face=P.face||'f';fx(t[0],t[1],'弩','enh');note=at();break;
    case 'snake':P.b.snake=true;P.face=P.face||'f';fx(t[0],t[1],'蛇の目','enh');note=at();break;
    case 'petri':note=at();petrify(t[0],t[1],'石化の眼');break;
    case 'keeper':pl.keeper=true;note='毎ターン1枚持ち越せるようになった';break;
    case 'offering':note=at();b[t[0]][t[1]]=null;fx(t[0],t[1],'供物','res');pl.energy=Math.min(10,pl.energy+1);break;
    case 'bomb':P.b.bomb={at:G.T+6};fx(t[0],t[1],'自爆まで3','kill');note=at();break;
    case 'plunder':P.b.plunder=true;fx(t[0],t[1],'略奪','res');note=at();break;
    case 'summon':b[t[0]][t[1]]=mkPiece('P',me);fx(t[0],t[1],'徴兵','mag');note=nota(t[0],t[1]);break;
    case 'search':break;
    case 'cloud':G.fields.push({type:'cloud',owner:me,until:G.T+6});break;
    case 'breaker':{const o=opp(me);G.campManual[o]=Math.max(0,Math.min(G.campManual[o],campLevel(o))-1);note=`${who(o)}の敵陣の魔法防御が残り${campLevel(o)}段`;break;}
    case 'seize':case 'swamp':case 'smoke':{
      const cells=areaCells(card.key,me,t[0],t[1]);G.fields.push({type:card.key,owner:me,cells,until:G.T+4});note=`${nota(t[0],t[1])}を中心に`;break;}
    case 'thunder':{
      const cells=areaCells('thunder',me,t[0],t[1]);
      const cols=[...new Set(cells.map(x=>x[1]))].sort((a,z)=>me==='s'?z-a:a-z);
      const stages=[{at:G.T+4,cols:cols.slice(0,2)},{at:G.T+6,cols:cols.slice(2,3)},{at:G.T+8,cols:cols.slice(3,5)}];
      G.fields.push({type:'thunder',owner:me,cells,stages,until:G.T+9});note=`${nota(t[0],t[1])}周辺、2ターン後から着弾`;break;}
    case 'dispel':{const cells=areaCells('dispel',me,t[0],t[1]);let n=0;
      for(const[r,c]of cells){const q=b[r][c];if(q&&q.c===me&&(q.poison||q.b.lock||q.burn||q.petri)){q.poison=null;delete q.b.lock;delete q.burn;delete q.petri;fx(r,c,'解呪','mag');n++;}}
      for(const f of G.fields)if((f.type==='seize'||f.type==='swamp')&&f.owner!==me){const before=f.cells.length;f.cells=f.cells.filter(x=>!has(cells,x[0],x[1]));n+=before-f.cells.length;}
      note=`${nota(t[0],t[1])}周辺（${n}件を解除）`;break;}
    case 'warp':{const[a,z]=t;const q=b[a[0]][a[1]];b[z[0]][z[1]]=q;b[a[0]][a[1]]=null;if(canPromote(q)&&zone(q.c,z[0]))q.pro=true;q.b.lock={until:G.T+2};if(q.b.xbow)q.b.xbow.ch=null;fx(z[0],z[1],'転移','mag');
      note=`${isHidden(q,z[0],z[1])?'？':pname(q)} ${nota(...a)}→${nota(...z)}`;checkBurn(z[0],z[1]);snakeCheck(z[0],z[1]);break;}
  }
  const hiddenNote=P&&d.cat!=='mag'&&G.board[t[0]]&&G.board[t[0]][t[1]]&&isHidden(P,t[0],t[1]);
  log(`${who(me)}${opts.virtual?'の兵舎が':''}「${d.name}」${note&&!hiddenNote?'→ '+note:''}`,me);
  if(card.key==='search'){
    if(me!==ME){const best=[...pl.draw].sort((a,b)=>CARDS[b.key].cost-CARDS[a.key].cost)[0];if(best){pl.draw=pl.draw.filter(x=>x!==best);best.held=true;pl.hand.push(best);log('botは山札からカードを1枚保留で手札に加えた','g');}}
    else if(!SIM)openSearch();
    else{const best=[...pl.draw].sort((a,b)=>CARDS[b.key].cost-CARDS[a.key].cost)[0];if(best){pl.draw=pl.draw.filter(x=>x!==best);best.held=true;pl.hand.push(best);}}
  }
  render();
}

/* ---------- input ---------- */
function barracksCards(col){const pl=G.players[col];const keys=[...new Set([...pl.draw,...pl.hand,...pl.discard,...(pl.opener?[pl.opener]:[])].map(c=>c.key))];let v=-1;return keys.filter(k=>CARDS[k].cat==='enh'&&CARDS[k].cost<=3&&validTargets(k,null,col).length).map(k=>({uid:v--,key:k,virtual:true}));}
function barracksReady(col){const pl=G.players[col];return pl.barracks&&G.T>=pl.barracks.next&&barracksCards(col).length>0;}
function openBarracks(){
  const list=barracksCards(ME);if(!list.length)return;
  G.modal=true;
  openModal(`<h3>兵舎：付ける駒強化を選ぶ</h3><p>デッキに入っている3コスト以下の駒強化から1つ選び、コストなしで駒に付けます。カードそのものは山札・手札・捨て札から減りません。次に使えるのは3ターン後です。</p>
    <div class="grid-cards">${list.map(c=>cardHTML(c.key,c.uid,'',ME)).join('')}</div>
    <div class="modal-actions"><button class="btn" data-close type="button">やめる</button></div>`,root=>{
    root.querySelectorAll('.grid-cards .card').forEach(el=>el.addEventListener('click',()=>{const c=list.find(x=>x.uid===+el.dataset.uid);G.modal=false;closeModal();G.pending={uid:c.uid,key:c.key,first:null,aim:null,barracks:true,vcard:c};G.sel=null;G.shootMode=false;render();}));
    root.querySelector('[data-close]').addEventListener('click',()=>{G.modal=false;closeModal();render();});
  });
}
function mustMove(){
  if(!G||G.turn!==ME||!G.main)return false;
  for(const[r,c,p]of piecesOf(ME)){if(movesFor(r,c).length)return true;if(canShoot(p)&&shootTargets(r,c).length)return true;if(canArrow(p)&&arrowTargets(r,c).length)return true;if(canCharge(p))return true;}
  return false;
}
function locked(){return !G||G.preview||G.over||G.busy||G.modal||G.waiting||G.turn!==ME;}
function onSquare(r,c){
  if(locked())return;
  if(G.pending){
    const card=G.pending.barracks?G.pending.vcard:G.players[ME].hand.find(x=>x.uid===G.pending.uid);const tg=CARDS[card.key].target;
    const v=validTargets(G.pending.key,G.pending.first);
    if(!v.some(t=>t[0]===r&&t[1]===c))return;
    if(tg==='warp'&&!G.pending.first){G.pending.first=[r,c];render();return;}
    if(tg==='area'||tg==='thunder'){
      if(!G.pending.aim||G.pending.aim[0]!==r||G.pending.aim[1]!==c){G.pending.aim=[r,c];render();return;}
    }
    playCard(card,tg==='warp'?[G.pending.first,[r,c]]:[r,c],G.pending.barracks?{free:true,virtual:true}:undefined);return;
  }
  const p=G.board[r][c];
  if(G.sel){
    if(G.shootMode){const st=modeTargets(G.shootMode,G.sel[0],G.sel[1]);if(st.some(t=>t[0]===r&&t[1]===c)){const[a,z]=G.sel;if(G.shootMode==='op')shoot(a,z,r,c);else if(G.shootMode==='arrow')fireArrow(a,z,r,c);else fireXbow(a,z,r,c);return;}}
    else{const mv=movesFor(G.sel[0],G.sel[1]).find(m=>m.r===r&&m.c===c);if(mv){doMove(G.sel[0],G.sel[1],r,c,G.faceSel);return;}}
  }
  if(p&&p.c===ME){G.sel=(G.sel&&G.sel[0]===r&&G.sel[1]===c)?null:[r,c];G.shootMode=false;G.faceSel=null;render();return;}
  G.sel=null;G.shootMode=false;render();
}
function onCard(cuid){
  if(locked())return;
  const card=G.players[ME].hand.find(x=>x.uid===cuid);if(!card)return;
  if(G.pending&&G.pending.uid===cuid){G.pending=null;render();return;}
  if(!canPlay(card)){G.pending=null;G.sel=null;G.flash=card.key;render();return;}
  if(CARDS[card.key].target==='none'){playCard(card,null);return;}
  G.pending={uid:cuid,key:card.key,first:null,aim:null};G.sel=null;G.shootMode=false;render();
}

/* ---------- bot ---------- */
const seenVal=(p,r,c)=>isHidden(p,r,c)?2:val(p);
function danger(r,c,me){
  let d=0;
  for(const f of G.fields){
    if(!active(f)||!f.cells)continue;
    if(f.type==='thunder'&&has(f.cells,r,c)&&f.stages.some(s=>!s.done&&s.cols.includes(c)))d+=1;
    if(f.type==='burn'&&has(f.cells,r,c))d+=3;
      if(f.type==='pit'&&f.owner!==me&&has(f.cells,r,c))d+=0.7;
  }
  eachPiece((q,r2,c2)=>{if(q.c!==me&&q.b.xbow&&q.b.xbow.ch!=null&&has(xbowLineCells(r2,c2),r,c))d+=1.5;if(q.c!==me&&q.b.snake&&has(faceCells(q.c,q.face||'f',r2,c2,2),r,c))d+=0.6;});
  eachPiece((q,r2,c2)=>{if(q.b.atomic&&cheb(r,c,r2,c2)<=2&&turnsLeft(q.b.atomic.at)<=2)d+=1;if(q.b.bomb&&cheb(r,c,r2,c2)<=1&&turnsLeft(q.b.bomb.at)<=2)d+=1;});
  return d;
}
function scoreMove(fr,fc,m,me){
  const b=G.board,p=b[fr][fc],t=b[m.r][m.c],op=opp(me);
  let s=0;
  if(t){if(t.t==='K'&&!t.b.rib)return 1000;s+=t.b.rib?1:seenVal(t,m.r,m.c);}
  const wasAtt=attackedBy(fr,fc,op);
  const pro=p.pro,v0=val(p);
  b[m.r][m.c]=p;b[fr][fc]=null;if(canPromote(p)&&(zone(me,fr)||zone(me,m.r)))p.pro=true;
  const att=attackedBy(m.r,m.c,op);
  const k=findKing(me);const kAtt=k&&attackedBy(k[0],k[1],op);
  const v1=val(p);
  p.pro=pro;b[fr][fc]=p;b[m.r][m.c]=t;
  if(att)s-=Math.min(v1,40)*(p.b.rib?0.2:0.85);
  if(wasAtt&&!att)s+=Math.min(v0,20)*0.6;
  if(kAtt)s-=60;
  s+=(v1-v0)*0.9;
  if(m.path.some(([r,c])=>fieldsAt('swamp',r,c).some(f=>f.owner!==me)))s-=2;
  if(p.t!=='K'&&m.path.some(([r,c])=>fieldsAt('burn',r,c).length))s-=v1+5;
  s+=(danger(fr,fc,me)-danger(m.r,m.c,me))*Math.min(v0,10)*0.5;
  if(p.burn)s+=Math.min(v0,30);
  if(p.petri)s+=Math.min(v0,8)*0.4;
  if(p.b.xbow&&p.b.xbow.ch!=null)s-=2;
  if(G.T>=9&&m.r===CENTER[0]&&m.c===CENTER[1])s+=0.8;
  s+=(me==='g'?m.r-fr:fr-m.r)*0.06+Math.random()*0.2;
  return s;
}
function bestMove(me,extraOnly){
  let best=null;
  for(const[r,c,p]of piecesOf(me)){
    if(isLocked(p))continue;
    const rx=ribExtra(p),hx=hasteReady(p);
    if(extraOnly&&!rx&&!hx)continue;
    for(const m of rawMoves(r,c)){
      if(extraOnly&&!rx&&m.cap)continue;
      const s=scoreMove(r,c,m,me);if(!best||s>best.s)best={fr:r,fc:c,m,s};
    }
  }
  return best;
}
function bestShot(me){
  let best=null;
  for(const[r,c,p]of piecesOf(me)){if(!canShoot(p))continue;for(const[tr,tc]of shootTargets(r,c)){const v=seenVal(G.board[tr][tc],tr,tc);if(!best||v>best.v)best={fr:r,fc:c,tr,tc,v};}}
  return best;
}
function botCard(late,only){
  const me='g',op='s',pl=G.players[me];
  const hand=only?[only]:shuffle([...pl.hand]);
  const pickMax=(list,fn)=>{let best=null,bs=-1e9;for(const x of list){const v=fn(x);if(v>bs){bs=v;best=x;}}return [best,bs];};
  const sumIn=(cells,col)=>cells.reduce((s,[r,c])=>{const q=G.board[r][c];return s+(q&&q.c===col?(q.t==='K'?30:(col===me?val(q):seenVal(q,r,c))):0);},0);
  for(const card of hand){
    if(!only&&!canPlay(card,me))continue;
    if(!only&&Math.random()<0.25)continue;
    const k=card.key;let t=null;
    const own=piecesOf(me),nonKing=own.filter(x=>x[2].t!=='K');
    const threatened=own.filter(([r,c])=>attackedBy(r,c,op));
    if(late&&!['ward','insure','barrier','rib','dispel'].includes(k)&&!card.held)continue;
    switch(k){
      case 'haste':case 'blade':case 'leg':{const key=k==='leg'?'leg':k;const list=nonKing.filter(x=>!x[2].b[key]);const[x]=pickMax(list,x=>x[0]+Math.random());if(x)t=[x[0],x[1]];break;}
      case 'operator':{const list=nonKing.filter(x=>!x[2].b.op);const[x]=pickMax(list,x=>val(x[2])+Math.random());if(x)t=[x[0],x[1]];break;}
      case 'rib':{const list=threatened.filter(x=>!x[2].b.rib);const[x,v]=pickMax(list,x=>val(x[2]));if(x&&v>=4)t=[x[0],x[1]];break;}
      case 'atomic':{const pw=own.filter(x=>x[2].t==='P'&&!x[2].pro&&!x[2].b.atomic);const[x,v]=pickMax(pw,([r,c])=>{const cells=[];for(let rr=r-1;rr<=r+3;rr++)for(let cc=c-2;cc<=c+2;cc++)if(inB(rr,cc))cells.push([rr,cc]);return sumIn(cells,op)-sumIn(cells,me)*0.6;});if(x&&v>=4)t=[x[0],x[1]];break;}
      case 'pit':{const[x,v]=pickMax(own.filter(x=>!x[2].b.pit),([r,c])=>sumIn(pitCells(me,r,c),op));if(x&&v>=4)t=[x[0],x[1]];break;}
      case 'ward':case 'insure':{const list=threatened.filter(x=>!x[2].b[k]);const[x]=pickMax(list,x=>val(x[2]));if(x)t=[x[0],x[1]];break;}
      case 'barrier':{const kk=findKing(me);if(kk&&!kk[2].b.barrier)t=[kk[0],kk[1]];break;}
      case 'command':{if(own.some(x=>x[2].b.command))break;const list=own.filter(([r,c,p])=>r>=3);const[x]=pickMax(list,x=>x[0]);if(x)t=[x[0],x[1]];break;}
      case 'search':case 'insight':if(pl.hand.length<=3)t='none';break;
      case 'keeper':if(G.T<=20)t='none';break;
      case 'barracks':t='none';break;
      case 'offering':{const pw=own.filter(x=>x[2].t==='P'&&!x[2].pro&&x[0]<=1);if(pw.length>=5&&pl.hand.some(c=>c.key!=='offering'&&costOf(c.key,me)===pl.energy+1))t=[pw[0][0],pw[0][1]];break;}
      case 'cloud':if(pl.energy>=5&&Math.random()<0.4)t='none';break;
      case 'breaker':if(pl.hand.some(c=>CARDS[c.key].cat==='mag'&&c.key!=='breaker')&&Math.random()<0.6)t='none';break;
      case 'seize':case 'swamp':case 'smoke':case 'thunder':{
        const[x,v]=pickMax(validTargets(k,null,me),([r,c])=>{const cells=areaCells(k,me,r,c);
          if(k==='seize')return sumIn(cells,op)-sumIn(cells,me);
          if(k==='thunder')return sumIn(cells,op)-sumIn(cells,me)*0.8;
          if(k==='smoke')return sumIn(cells,me);
          return cells.filter(([rr,cc])=>!G.board[rr][cc]&&piecesOf(op).some(([r2,c2])=>cheb(rr,cc,r2,c2)<=1)).length;});
        if(x&&v>=(k==='thunder'?6:4))t=x;break;}
      case 'dispel':{const[x,v]=pickMax(validTargets('dispel',null,me),([r,c])=>{const cells=areaCells('dispel',me,r,c);let s=0;for(const[rr,cc]of cells){const q=G.board[rr][cc];if(q&&q.c===me&&q.poison)s+=val(q)>50?6:val(q);if(q&&q.c===me&&fieldsAt('seize',rr,cc).some(f=>f.owner!==me))s+=2;}return s;});if(x&&v>=3)t=x;break;}
      case 'summon':{const v=validTargets('summon',null,me);if(v.length&&pl.energy>=3&&Math.random()<0.5)t=v[Math.random()*v.length|0];break;}
      case 'arrow':case 'xbow':case 'snake':{const key=k==='arrow'?'arrow':k;const list=nonKing.filter(x=>!x[2].b[key]&&!x[2].b.op);const[x]=pickMax(list,x=>x[0]+val(x[2])*0.2+Math.random());if(x)t=[x[0],x[1]];break;}
      case 'petri':{const[x,v]=pickMax(validTargets('petri',null,me),([r,c])=>{const q=G.board[r][c];return q.t==='K'?8:seenVal(q,r,c);});if(x&&v>=3)t=x;break;}
      case 'combo':{if(pl.hand.some(c=>c.key!=='combo'&&costOf(c.key,me)>pl.energy&&costOf(c.key,me)-2<=pl.energy-1))t='none';break;}
      case 'rewind':{const list=nonKing.filter(([r,c,p])=>!p.b.rewind&&'PLN'.includes(p.t)&&!p.pro&&attackedBy(r,c,op));const[x]=pickMax(list,x=>val(x[2]));if(x)t=[x[0],x[1]];break;}
      case 'plunder':{const list=nonKing.filter(x=>!x[2].b.plunder);const[x]=pickMax(list,x=>x[0]+val(x[2])*0.3);if(x)t=[x[0],x[1]];break;}
      case 'bomb':{const[x,v]=pickMax(nonKing.filter(x=>!x[2].b.bomb),([r,c])=>{const cells=[];for(let rr=r;rr<=r+2;rr++)for(let cc=c-1;cc<=c+1;cc++)if(inB(rr,cc))cells.push([rr,cc]);return sumIn(cells,op)-sumIn(cells,me)*0.6;});if(x&&v>=3)t=[x[0],x[1]];break;}
    }
    if(t)return ()=>playCard(card,t==='none'?null:t,only?{free:true,virtual:true}:undefined);
  }
  return null;
}
async function botTurn(){
  if(botLevel>1)return botTurnSearch();
  const myG=G;if(!G||G.over||G.turn!=='g')return;
  G.busy=true;render();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stale=()=>G!==myG||G.over;
  if(barracksReady('g')){for(const c of shuffle(barracksCards('g'))){const a=botCard(false,c);if(a){await wait(600);if(stale())return;a();break;}}if(stale())return;}
  for(let i=0;i<2;i++){await wait(650);if(stale())return;const a=botCard(false);if(!a)break;a();if(stale())return;}
  for(const[r,c,p]of piecesOf('g')){if(canXbow(p)){const ts=xbowTargets(r,c);if(ts.length){const[tr,tc]=ts.sort((a,z)=>seenVal(G.board[z[0]][z[1]],...z)-seenVal(G.board[a[0]][a[1]],...a))[0];await wait(600);if(stale())return;fireXbow(r,c,tr,tc);if(stale())return;}}}
  for(let i=0;i<5;i++){
    await wait(600);if(stale())return;
    if(G.main){
      const mv=bestMove('g',false),sh=bestShot('g');
      let ar=null,cg=null;
      for(const[r,c,p]of piecesOf('g')){
        if(canArrow(p))for(const[tr,tc]of arrowTargets(r,c)){const q=G.board[tr][tc];if(ward(q))continue;const v=q.t==='K'?8:seenVal(q,tr,tc)*0.6;if(!ar||v>ar.v)ar={fr:r,fc:c,tr,tc,v};}
        if(canCharge(p)){for(const f of['f','l','r']){const v=xbowTargets(r,c,f).reduce((m,[tr,tc])=>Math.max(m,G.board[tr][tc].t==='K'?10:seenVal(G.board[tr][tc],tr,tc)),0);if(v>=3&&(!cg||v>cg.v))cg={r,c,v,f};}}
      }
      const mvS=mv?mv.s:-99;
      if(sh&&sh.v>=3&&sh.v>=mvS){shoot(sh.fr,sh.fc,sh.tr,sh.tc);}
      else if(ar&&ar.v>=2&&ar.v>=mvS){fireArrow(ar.fr,ar.fc,ar.tr,ar.tc);}
      else if(cg&&mvS<1.5&&Math.random()<0.8){chargeXbow(cg.r,cg.c,cg.f);}
      else if(mv)doMove(mv.fr,mv.fc,mv.m.r,mv.m.c);
      else break;
    }else{const h=bestMove('g',true);if(!h||h.s<0.2)break;doMove(h.fr,h.fc,h.m.r,h.m.c);}
    if(stale())return;
  }
  await wait(450);if(stale())return;
  const a=botCard(true);if(a){a();await wait(500);if(stale())return;}
  G.busy=false;endTurn();
}

/* ---------- search AI (levels 2 and 3) ---------- */
function targetOk(key,t,col){
  const d=CARDS[key];
  if(d.target==='none')return t==null;
  if(!t)return false;
  if(d.target==='warp'){if(!has(validTargets(key,null,col),t[0][0],t[0][1]))return false;return has(validTargets(key,t[0],col),t[1][0],t[1][1]);}
  return has(validTargets(key,null,col),t[0],t[1]);
}
function simApply(a){
  const me=G.turn;
  switch(a.type){
    case 'card':{const card=G.players[me].hand.find(x=>x.uid===a.uid);if(!card||!canPlay(card,me)||!targetOk(card.key,a.t,me))return false;playCard(card,a.t);return true;}
    case 'barracks':{if(!barracksReady(me))return false;const vc=barracksCards(me).find(x=>x.key===a.key);if(!vc||!targetOk(a.key,a.t,me))return false;playCard(vc,a.t,{free:true,virtual:true});return true;}
    case 'move':{if(!movesFor(a.fr,a.fc).some(m=>m.r===a.tr&&m.c===a.tc))return false;doMove(a.fr,a.fc,a.tr,a.tc,a.face);return true;}
    case 'shoot':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canShoot(p)||!has(shootTargets(a.fr,a.fc),a.tr,a.tc))return false;shoot(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'arrow':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canArrow(p)||!has(arrowTargets(a.fr,a.fc),a.tr,a.tc))return false;fireArrow(a.fr,a.fc,a.tr,a.tc);return true;}
    case 'charge':{const p=G.board[a.r][a.c];if(!p||p.c!==me||!canCharge(p))return false;chargeXbow(a.r,a.c,a.face);return true;}
    case 'xbow':{const p=G.board[a.fr][a.fc];if(!p||p.c!==me||!canXbow(p)||!has(xbowTargets(a.fr,a.fc),a.tr,a.tc))return false;fireXbow(a.fr,a.fc,a.tr,a.tc);return true;}
  }
  return false;
}
function greedyFree(me,rec){
  for(const[r,c,p]of piecesOf(me)){if(G.over)return;if(!canXbow(p))continue;const ts=xbowTargets(r,c);if(!ts.length)continue;
    const[tr,tc]=ts[0];const q=G.board[tr][tc];if(!q)continue;const a={type:'xbow',fr:r,fc:c,tr,tc};if(simApply(a)&&rec)rec.push(a);}
}
function greedyExtras(me,rec){
  for(let i=0;i<3&&!G.over;i++){const h=bestMove(me,true);if(!h||h.s<0.2)break;const a={type:'move',fr:h.fr,fc:h.fc,tr:h.m.r,tc:h.m.c};if(!simApply(a))break;if(rec)rec.push(a);}
}
function greedyMain(me){
  const mv=bestMove(me,false),sh=bestShot(me);let ar=null;
  for(const[r,c,p]of piecesOf(me))if(canArrow(p))for(const[tr,tc]of arrowTargets(r,c)){const q=G.board[tr][tc];if(ward(q))continue;const v=q.t==='K'?8:val(q)*0.6;if(!ar||v>ar.v)ar={fr:r,fc:c,tr,tc,v};}
  const mvS=mv?mv.s:-99;
  if(sh&&sh.v>=3&&sh.v>=mvS)return {type:'shoot',fr:sh.fr,fc:sh.fc,tr:sh.tr,tc:sh.tc};
  if(ar&&ar.v>=2&&ar.v>=mvS)return {type:'arrow',fr:ar.fr,fc:ar.fc,tr:ar.tr,tc:ar.tc};
  if(mv)return {type:'move',fr:mv.fr,fc:mv.fc,tr:mv.m.r,tc:mv.m.c};
  return null;
}
function oppGreedyTurn(){
  const me=G.turn;
  greedyFree(me,null);if(G.over)return;
  const a=greedyMain(me);if(a)simApply(a);if(G.over)return;
  greedyExtras(me,null);if(G.over)return;
  endTurn();
}
function genMains(me){
  const out=[];
  for(const[r,c,p]of piecesOf(me)){
    for(const m of movesFor(r,c))out.push({a:{type:'move',fr:r,fc:c,tr:m.r,tc:m.c},q:scoreMove(r,c,m,me)});
    if(canShoot(p))for(const[tr,tc]of shootTargets(r,c)){const q=G.board[tr][tc];out.push({a:{type:'shoot',fr:r,fc:c,tr,tc},q:(q.t==='K'?100:val(q))*1.2});}
    if(canArrow(p))for(const[tr,tc]of arrowTargets(r,c)){const q=G.board[tr][tc];out.push({a:{type:'arrow',fr:r,fc:c,tr,tc},q:(q.t==='K'?20:val(q))*0.6});}
    if(canCharge(p))for(const f of['f','l','r']){const ts=xbowTargets(r,c,f);if(ts.length){const q=G.board[ts[0][0]][ts[0][1]];out.push({a:{type:'charge',r,c,face:f},q:(q.t==='K'?20:val(q))*0.5});}}
  }
  return out.sort((x,y)=>y.q-x.q).map(x=>x.a);
}
function optTargets(key,me){
  const d=CARDS[key],op=opp(me);
  const pv=t=>{const q=G.board[t[0]][t[1]];return q?(q.t==='K'?30:val(q)):0;};
  if(d.target==='none')return [null];
  if(d.target==='warp'){const out=[];for(const f of validTargets(key,null,me).sort((a,b)=>pv(b)-pv(a)).slice(0,5))for(const z of validTargets(key,f,me))out.push([f,z]);return out.slice(0,12);}
  if(d.target==='area'||d.target==='thunder'){
    const sc=t=>{const cells=areaCells(key,me,t[0],t[1]);let v=0;for(const[r,c]of cells){const q=G.board[r][c];
      if(key==='smoke'){if(q&&q.c===me)v+=val(q)>50?4:val(q);}
      else if(key==='swamp'){if(!q&&piecesOf(op).some(([r2,c2])=>cheb(r,c,r2,c2)<=1))v+=1;}
      else if(key==='dispel'){if(q&&q.c===me&&(q.poison||q.burn||q.petri||q.b.lock))v+=val(q)>50?8:val(q)+1;}
      else if(q)v+=(q.c===op?1:-1)*(q.t==='K'?(key==='thunder'?0:6):val(q));}return v;};
    return validTargets(key,null,me).map(t=>[t,sc(t)]).sort((a,b)=>b[1]-a[1]).slice(0,5).filter(x=>x[1]>0).map(x=>x[0]);
  }
  const list=validTargets(key,null,me);
  return list.sort((a,b)=>pv(b)-pv(a)).slice(0,10);
}
function genCardOpts(me){
  const pl=G.players[me],out=[],seen=new Set();
  for(const card of pl.hand){
    if(seen.has(card.key)||!canPlay(card,me))continue;seen.add(card.key);
    for(const t of optTargets(card.key,me))out.push({type:'card',uid:card.uid,key:card.key,t});
  }
  if(barracksReady(me))for(const vc of barracksCards(me))for(const t of optTargets(vc.key,me).slice(0,5))out.push({type:'barracks',key:vc.key,t});
  return out;
}
function evalState(me){
  if(G.over){if(G.over==='draw')return 0;return G.over===me?1e5:-1e5;}
  const side=col=>{
    const oc=opp(col);let s=0;
    for(const[r,c,p]of piecesOf(col)){
      if(p.t!=='K'){
        let m=1;
        if(p.poison&&p.poison.until>G.T)m-=0.35;
        if(p.burn)m-=0.55;
        if(p.petri)m-=0.15;
        if(isLocked(p))m-=0.1;
        if(G.fields.some(f=>f.type==='thunder'&&f.owner!==col&&active(f)&&has(f.cells,r,c)&&f.stages.some(st=>!st.done&&st.cols.includes(c))))m-=0.5;
        if(G.fields.some(f=>f.type==='pit'&&f.owner!==col&&has(f.cells,r,c)))m-=0.4;
        s+=val(p)*Math.max(0.05,m);
      }
      const b=p.b;
      s+=(b.op?3:0)+(b.xbow?1.5+(b.xbow.ch!=null?1:0):0)+(b.arrow?1.5:0)+(b.blade?1:0)+(b.snake?1:0)+(b.rib?1.5:0)+(b.pit?2:0)+(b.plunder?0.5:0)+(b.haste?0.8:0)+(ward(p)?0.5:0)+(b.barrier?0.5:0)+(b.command?0.8:0)+(b.leg?0.3:0)+(b.rewind?0.2:0)+(b.insure?0.3:0);
      if(G.T>=9&&r===CENTER[0]&&c===CENTER[1])s+=0.6;
      if(p.t!=='K')s+=(col==='g'?r:6-r)*0.05;
      for(const[k,rad]of[['atomic',2],['bomb',1]])if(b[k]){let net=0;for(const[r2,c2,q]of piecesOf(oc))if(cheb(r,c,r2,c2)<=rad)net+=q.t==='K'?25:val(q);for(const[r2,c2,q]of piecesOf(col))if(q!==p&&cheb(r,c,r2,c2)<=rad)net-=q.t==='K'?50:val(q);s+=net*0.45;}
    }
    const pl=G.players[col];s+=Math.min(pl.energy,10)*0.45+pl.hand.length*0.25+(pl.keeper?1:0)+(pl.barracks?1.5:0);
    const k=findKing(col);if(!k)return s-1e5;
    if(attackedBy(k[0],k[1],oc))s-=k[2].b.rib?2:9;
    if(k[2].burn)s-=6;
    if(k[2].poison&&k[2].poison.until>G.T)s-=4;
    for(const[r2,c2]of piecesOf(oc))if(cheb(k[0],k[1],r2,c2)<=1)s-=0.6;
    return s;
  };
  return side(me)-side(opp(me));
}
function maskedClone(g){
  const c=structuredClone(g);c.log=[];c.modal=false;c.busy=false;c.thinkLeft=null;
  const save=G;G=c;
  eachPiece((p,r,cc)=>{if(p.c==='s'&&isHidden(p,r,cc)){p.t='G';p.pro=false;p.b={};}});
  G=save;return c;
}
function runPlan(base,plan,real){
  G=structuredClone(base);SIM=true;
  const rec=[];let score;
  try{
    greedyFree('g',rec);
    for(const a of plan.pre){if(G.over)break;if(simApply(a))rec.push(a);}
    if(!G.over){
      let m=plan.main;
      if(m==='auto'){greedyFree('g',rec);m=greedyMain('g');}
      if(m&&simApply(m))rec.push(m);
      else if(G.main){const g2=greedyMain('g');if(g2&&simApply(g2))rec.push(g2);}
    }
    if(!G.over)greedyExtras('g',rec);
    for(const a of plan.post||[]){if(G.over)break;if(simApply(a))rec.push(a);}
    if(!G.over)endTurn();
    if(!G.over)oppGreedyTurn();
    score=evalState('g');
  }finally{G=real;SIM=false;}
  return {score,rec};
}
async function searchPlan(level,budget){
  const real=G,deadline=performance.now()+budget*BUDGET_SCALE;
  const base=maskedClone(real);
  let lastYield=performance.now(),lastShow=0;
  const timeUp=()=>performance.now()>=deadline;
  const tick=async()=>{
    if(performance.now()-lastYield<35)return;
    if(performance.now()-lastShow>400){real.thinkLeft=Math.max(0,Math.ceil((deadline-performance.now())/1000));render();lastShow=performance.now();}
    await new Promise(r=>setTimeout(r,0));lastYield=performance.now();
  };
  G=structuredClone(base);SIM=true;
  let mains,cardOpts;
  try{mains=genMains('g');cardOpts=genCardOpts('g');}finally{G=real;SIM=false;}
  const results=[];
  const tryPlan=async(plan)=>{if(timeUp()||G!==real)return null;const r=runPlan(base,plan,real);const e={plan,sum:r.score,n:1,rec:r.rec};results.push(e);await tick();return e;};
  const mean=e=>e.sum/e.n;
  // 1: every main action without cards
  for(const m of mains){if(!(await tryPlan({pre:[],main:m}))&&timeUp())break;}
  if(!mains.length)await tryPlan({pre:[],main:'auto'});
  const topMains=results.slice().sort((a,b)=>mean(b)-mean(a)).slice(0,level===3?8:4).map(e=>e.plan.main).filter(m=>m&&m!=='auto');
  // 2: one card before the main action
  for(const o of cardOpts){
    if(timeUp())break;
    await tryPlan({pre:[o],main:'auto'});
    for(const m of topMains){if(timeUp())break;await tryPlan({pre:[o],main:m});}
  }
  // 3: one card after the main action (level 3)
  if(level===3){
    for(const m of topMains.slice(0,5))for(const o of cardOpts){if(timeUp())break;await tryPlan({pre:[],main:m,post:[o]});}
  }
  // 4: two cards before the main action (level 3)
  if(level===3){
    const firsts=results.filter(e=>e.plan.pre.length===1).sort((a,b)=>mean(b)-mean(a)).slice(0,6).map(e=>e.plan.pre[0]);
    for(const o1 of firsts)for(const o2 of cardOpts){if(timeUp())break;if(o2.type==='card'&&o1.type==='card'&&o2.uid===o1.uid)continue;await tryPlan({pre:[o1,o2],main:'auto'});}
  }
  // 5: refine the best candidates with more samples until time runs out
  while(!timeUp()&&G===real&&results.length){
    const top=results.slice().sort((a,b)=>mean(b)-mean(a)).slice(0,level===3?8:5);
    for(const e of top){if(timeUp())break;const r=runPlan(base,e.plan,real);e.sum+=r.score;e.n++;await tick();}
    if(level===2&&top.every(e=>e.n>=4))break;
  }
  real.thinkLeft=null;
  if(!results.length)return null;
  results.sort((a,b)=>mean(b)-mean(a));
  return results[0];
}
async function botTurnSearch(){
  const myG=G;if(!G||G.over||G.turn!=='g')return;
  G.busy=true;render();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stale=()=>G!==myG||G.over;
  const best=await searchPlan(botLevel,botLevel===3?10000:6000);
  if(stale())return;
  render();
  if(best)for(const a of best.rec){await wait(550);if(stale())return;simApply(a);if(stale())return;}
  if(G.main){const g2=greedyMain('g');if(g2){await wait(500);if(stale())return;simApply(g2);if(stale())return;}}
  await wait(450);if(stale())return;
  G.busy=false;endTurn();
}

function gameOver(winner){
  if(G.over)return;
  if(SIM){G.over=winner;return;}
  G.over=winner;G.busy=false;
  log(winner==='draw'?'両方の王が同時に倒れた。引き分け':isOnline()?`${who(winner)}の勝ち`:winner===ME?'botの王を討ち取った！':'あなたの玉が倒された…',winner==='draw'?null:winner,true);
  render();
  setTimeout(()=>showOver(winner),600);
}
function showOver(winner){
  if(!G||G.modal&&$('#modalRoot').innerHTML)return;
  G.modal=true;
  const res=winner==='draw'?'引き分け':winner===ME?'勝ち':'負け';
  const why=winner==='draw'?'両方の王が同時に倒れました':winner===ME?`${isOnline()?'相手':'bot'}の王が倒れました`:'あなたの玉が倒れました';
  const btns=isOnline()?'<button class="btn on" data-lobby type="button">ロビーに戻る</button><button class="btn" data-close type="button">盤面を見る</button>'
    :'<button class="btn on" data-again type="button">同じデッキで再戦</button><button class="btn" data-deck type="button">デッキを組み直す</button><button class="btn" data-close type="button">盤面を見る</button>';
  openModal(`<div class="big">${res}</div><p style="text-align:center">${G.T}手目で${why}${G.resigned?'（投了）':''}。</p><div class="modal-actions">${btns}</div>`,root=>{
    const q=x=>root.querySelector(x);
    if(q('[data-again]'))q('[data-again]').addEventListener('click',()=>newGame(myDeck));
    if(q('[data-deck]'))q('[data-deck]').addEventListener('click',()=>openBuilder());
    if(q('[data-lobby]'))q('[data-lobby]').addEventListener('click',()=>{leaveOnline();openBuilder('online');});
    q('[data-close]').addEventListener('click',()=>{G.modal=false;closeModal();render();});
  });
}

/* ---------- rendering ---------- */
function buildBoard(){
  const box=$('#squares');box.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('button');d.type='button';d.className='sq';d.dataset.r=r;d.dataset.c=c;d.setAttribute('aria-label',nota(r,c));
    d.addEventListener('click',()=>onSquare(r,c));box.appendChild(d);
  }
  setOrientation();
}
function setOrientation(){
  const flip=ME==='g';
  document.querySelector('.board-wrap').classList.toggle('flip',flip);

function badgesFor(p){

  if(p.b.snake)out.push('<span class="bd">睨</span>');
  if(hasFacing(p))out.push(`<span class="bd res">${ARROW_GLYPH(faceVec(p.c,p.face||'f'))}</span>`);
  if(p.b.haste)out.push(`<span class="bd">${hasteReady(p)?'疾':'疾…'}</span>`);
  if(p.b.blade)out.push('<span class="bd">刃</span>');
  if(p.b.ward&&p.b.ward.until>T)out.push('<span class="bd">護</span>');
  if(p.b.leg&&p.b.leg.until>T)out.push('<span class="bd">跳</span>');
  if(p.b.rewind&&p.b.rewind.until>T)out.push(`<span class="bd">逆${turnsLeft(p.b.rewind.until)}</span>`);
